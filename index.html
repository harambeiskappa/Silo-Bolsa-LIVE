/* ══════════════════ LECTOR DE PLANILLAS ══════════════════════════════
   Lee .xlsx y .csv sin una sola librería externa: el ZIP se descomprime
   con DecompressionStream (nativo del navegador) y el XML con DOMParser.
   Contempla los dos formatos de texto que existen en un xlsx:
     · inlineStr      — el que escribe esta app
     · sharedStrings  — el que escribe Excel cuando el usuario guarda
   Si solo se contemplara uno, la planilla guardada desde Excel se leería
   vacía y sin error, que es la peor forma de fallar. */

async function inflarCrudo(bytes){
  const DS = globalThis.DecompressionStream;
  if(!DS) { const e=new Error("SIN_DECOMPRESSION"); e.codigo="SIN_DECOMPRESSION"; throw e; }
  const flujo = new Blob([bytes]).stream().pipeThrough(new DS("deflate-raw"));
  return new Uint8Array(await new Response(flujo).arrayBuffer());
}

async function abrirZip(buffer){
  const u = new Uint8Array(buffer);
  const dv = new DataView(u.buffer, u.byteOffset, u.byteLength);
  let eo = -1;
  for(let i=u.length-22; i>=0 && i>u.length-66000; i--)
    if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; }
  if(eo<0){ const e=new Error("NO_ES_ZIP"); e.codigo="NO_ES_ZIP"; throw e; }
  const n = dv.getUint16(eo+10,true);
  let p = dv.getUint32(eo+16,true);
  const salida = {}, td = new TextDecoder();
  for(let i=0;i<n;i++){
    if(p+46>u.length || dv.getUint32(p,true)!==0x02014b50) break;
    const metodo = dv.getUint16(p+10,true);
    const csize  = dv.getUint32(p+20,true);
    const nlen   = dv.getUint16(p+28,true);
    const elen   = dv.getUint16(p+30,true);
    const clen   = dv.getUint16(p+32,true);
    const lho    = dv.getUint32(p+42,true);
    const nombre = td.decode(u.subarray(p+46, p+46+nlen));
    const lnlen  = dv.getUint16(lho+26,true);
    const lelen  = dv.getUint16(lho+28,true);
    const ini    = lho+30+lnlen+lelen;
    const datos  = u.subarray(ini, ini+csize);
    salida[nombre] = metodo===0 ? datos : await inflarCrudo(datos);
    p += 46+nlen+elen+clen;
  }
  return salida;
}

function xmlDe(bytes){
  return new DOMParser().parseFromString(new TextDecoder().decode(bytes), "application/xml");
}
function colDeRef(ref){          // "BC12" -> 54
  let c=0; for(const ch of ref){ const k=ch.charCodeAt(0);
    if(k<65||k>90) break; c = c*26 + (k-64); } return c-1;
}

async function leerXlsx(buffer){
  const z = await abrirZip(buffer);
  if(!z["xl/workbook.xml"]){ const e=new Error("NO_ES_XLSX"); e.codigo="NO_ES_XLSX"; throw e; }

  // textos compartidos (lo que escribe Excel)
  let compartidos = [];
  if(z["xl/sharedStrings.xml"]){
    compartidos = [...xmlDe(z["xl/sharedStrings.xml"]).getElementsByTagName("si")].map(si=>
      [...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
  }
  // nombre de hoja -> archivo
  const rels = {};
  if(z["xl/_rels/workbook.xml.rels"])
    [...xmlDe(z["xl/_rels/workbook.xml.rels"]).getElementsByTagName("Relationship")]
      .forEach(r=> rels[r.getAttribute("Id")] = r.getAttribute("Target"));
  const wb = xmlDe(z["xl/workbook.xml"]);
  const hojas = {};
  [...wb.getElementsByTagName("sheet")].forEach((s,i)=>{
    const nom = s.getAttribute("name");
    const rid = s.getAttribute("r:id") || s.getAttributeNS &&
                s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    let ruta = rels[rid] || `worksheets/sheet${i+1}.xml`;
    ruta = ruta.replace(/^\/?xl\//,"").replace(/^\//,"");
    const bytes = z["xl/"+ruta] || z[`xl/worksheets/sheet${i+1}.xml`];
    if(!bytes) return;
    hojas[nom] = filasDeHoja(xmlDe(bytes), compartidos);
  });
  return hojas;
}

function filasDeHoja(doc, compartidos){
  const filas = [];
  [...doc.getElementsByTagName("row")].forEach(row=>{
    const idx = parseInt(row.getAttribute("r")||"0",10)-1;
    const celdas = [];
    [...row.getElementsByTagName("c")].forEach(c=>{
      const ci = colDeRef(c.getAttribute("r")||"A1");
      const t  = c.getAttribute("t");
      let v = "";
      if(t==="inlineStr"){
        v = [...c.getElementsByTagName("t")].map(x=>x.textContent).join("");
      } else if(t==="s"){
        const vEl = c.getElementsByTagName("v")[0];
        v = vEl ? (compartidos[parseInt(vEl.textContent,10)] ?? "") : "";
      } else {
        const vEl = c.getElementsByTagName("v")[0];
        v = vEl ? vEl.textContent : "";
      }
      celdas[ci] = String(v).trim();
    });
    filas[idx>=0?idx:filas.length] = celdas;
  });
  for(let i=0;i<filas.length;i++) if(!filas[i]) filas[i]=[];
  return filas;
}

/* ── CSV ────────────────────────────────────────────────────────────── */
function leerCsv(texto){
  const t = texto.replace(/^﻿/,"");
  const sep = (t.split("\n")[0].match(/;/g)||[]).length >= (t.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  const filas=[]; let campo="", fila=[], enCom=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(enCom){
      if(ch==='"'){ if(t[i+1]==='"'){ campo+='"'; i++; } else enCom=false; }
      else campo+=ch;
    } else if(ch==='"') enCom=true;
    else if(ch===sep){ fila.push(campo.trim()); campo=""; }
    else if(ch==="\n"){ fila.push(campo.trim()); filas.push(fila); fila=[]; campo=""; }
    else if(ch!=="\r") campo+=ch;
  }
  if(campo!==""||fila.length){ fila.push(campo.trim()); filas.push(fila); }
  return filas.filter(f=>f.some(c=>c!==""));
}

/* ── ubicar hojas y columnas por su nombre, no por posición ─────────── */
function norm(s){ return String(s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
function buscarHoja(hojas, ...claves){
  const k = Object.keys(hojas);
  for(const c of claves){ const h = k.find(x=>norm(x)===norm(c)); if(h) return hojas[h]; }
  for(const c of claves){ const h = k.find(x=>norm(x).includes(norm(c))); if(h) return hojas[h]; }
  return null;
}
function mapaColumnas(encabezado, defs){
  const m = {};
  Object.entries(defs).forEach(([campo, claves])=>{
    m[campo] = -1;
    encabezado.forEach((h,i)=>{
      if(m[campo]>=0) return;
      const nh = norm(h);
      if(claves.some(c=> nh===norm(c) || (nh && nh.startsWith(norm(c))))) m[campo]=i;
    });
  });
  return m;
}

/* ══════════════════ REVISIÓN PREVIA ══════════════════════════════════
   Todo lo que entra pasa por acá. Nada se guarda hasta que el usuario
   confirma, y cada renglón dice qué se entendió y qué va a pasar. */

const LETRA_ESTADO = { C:"cerrado", U:"en_uso", A:"armando", T:"terminado", X:"retirado" };
function estadoDe(txt){
  const t = String(txt||"").trim();
  if(!t) return null;
  const L = LETRA_ESTADO[t.toUpperCase()];
  if(L) return L;
  const k = Object.keys(ESTADOS).find(k=>norm(ESTADOS[k])===norm(t) || norm(k)===norm(t));
  return k || undefined;          // undefined = escrito pero no se entiende
}
/* Un número puede venir en formato argentino («1.234,5») o en el que
   escribe Excel («1234.5»). Si el punto se trata siempre como separador
   de miles, «64.6» se convierte en 646 y los totales explotan sin avisar.
   Regla: el ÚLTIMO separador que aparece es el decimal, salvo que el
   punto esté agrupando de a tres dígitos. */
function numeroDe(txt){
  let t = String(txt==null?"":txt).trim();
  if(t==="") return null;
  t = t.replace(/\s/g,"").replace(/[^0-9.,+-]/g,"");
  if(t===""||t==="-"||t==="+") return undefined;
  const tienePunto = t.includes("."), tieneComa = t.includes(",");
  if(tienePunto && tieneComa){
    t = t.lastIndexOf(",") > t.lastIndexOf(".")
      ? t.replace(/\./g,"").replace(",",".")     // 1.234,5
      : t.replace(/,/g,"");                      // 1,234.5
  } else if(tieneComa){
    t = t.replace(/,/g,".");                     // 64,6
  } else if(tienePunto){
    // solo puntos: miles solo si agrupa de a tres y no queda nada suelto
    if(/^[+-]?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,"");
    // si no, el punto es decimal y se deja como está (64.6)
  }
  const v = parseFloat(t);
  return isNaN(v) ? undefined : v;   // undefined = escrito pero no es número
}

/* Alimento escrito de cualquier forma razonable: código, nombre, o como lo
   anota Silvana en la hoja de humedad («Silo de maíz»). */
const ALIAS_ALIM = { silodemaiz:"MS", silo:"MS", maizsilo:"MS", silomaiz:"MS", maizgrano:"MG", grano:"MG",
                     maiz:"MG", gluten:"GL", harinadegermen:"HG", germen:"HG", nucleo:"NU" };
function alimentoDe(txt, conSinBolson){
  const t = String(txt||"").trim();
  if(!t) return null;
  const ok = k => D.alimentos[k] && (conSinBolson || !D.alimentos[k].sinBolson);
  const U = t.toUpperCase();
  if(ok(U)) return U;
  const k = Object.keys(D.alimentos).find(k=>ok(k) && norm(D.alimentos[k].nombre)===norm(t));
  if(k) return k;
  const al = ALIAS_ALIM[norm(t)];
  return al && ok(al) ? al : undefined;
}
function fechaDe(txt){
  const t = String(txt||"").trim(); if(!t) return null;
  if(/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0,10);
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ const y = m[3].length===2 ? "20"+m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  if(/^\d{5}(\.\d+)?$/.test(t)){   // número de serie de Excel
    const d = new Date(Date.UTC(1899,11,30) + Math.floor(+t)*86400000); return d.toISOString().slice(0,10); }
  return undefined;
}
function origenMsDe(txt){
  const t = norm(txt);
  return {b:"bolson",bolson:"bolson",c:"celda",celda:"celda",m:"mixer",mixer:"mixer"}[t] || (t?undefined:null);
}
/* "10:73 15:61" → [{min:10,g:73},{min:15,g:61}] */
function pesadasDeTexto(txt){
  const out=[]; String(txt||"").replace(/(\d+)\s*[:=]\s*(\d+(?:[.,]\d+)?)/g,(_,a,b)=>{ out.push({min:+a, g:numeroDe(b)}); return ""; });
  return out;
}
/* El %MS de una muestra y si llegó o no a peso constante. */
function calcMs(r){
  const ps = (r.pesadas||[]).filter(p=>n(p.g)!==null).sort((a,b)=>a.min-b.min);
  const ini = n(r.pesoIni);
  if(ini && ps.length){
    const u = ps[ps.length-1], pv = ps.length>1 ? ps[ps.length-2] : null;
    const pct = u.g/ini*100;
    const constante = pv ? Math.abs(pv.g-u.g) <= PESO_CONSTANTE_G : null;
    const por = pv
      ? (constante ? `llegó a peso constante: ${f(pv.g)} → ${f(u.g)} g entre los minutos ${pv.min} y ${u.min}`
                   : `no llegó a peso constante: siguió bajando ${f(pv.g-u.g)} g entre los minutos ${pv.min} y ${u.min} (umbral ${PESO_CONSTANTE_G} g). La MS real es menor`)
      : `una sola pesada: no se sabe si llegó a peso constante`;
    return { pct, constante, por, desdePesadas:true };
  }
  if(r.pctArchivo!==null && r.pctArchivo!==undefined)
    return { pct:r.pctArchivo, constante:null, por:"sin pesadas registradas: no se sabe si llegó a peso constante", desdePesadas:false };
  return { pct:null, constante:null, por:"sin %MS ni pesadas", desdePesadas:false };
}
/* Ingredientes que faltaban en la dieta: se proponen desde la nota, y
   cada propuesta dice qué parte de la nota la sugirió. */
function proponerFaltantes(nota){
  const t = String(nota||""), tn = norm(t), out = {};
  if(!/(no ten|sin |falt|no hab)/i.test(t)) return out;
  ingsDieta().forEach(k=>{
    const a = D.alimentos[k]; if(!a) return;
    if(tn.includes(norm(a.nombre))) out[k] = `la nota dice «${t.trim()}»`;
  });
  return out;
}

function analizarPlanilla(hojas, fuente){
  let med = buscarHoja(hojas,"Mediciones","Medicion");
  if(!med){ med = Object.values(hojas).find(h=>h && h[0] && mapaColumnas(h[0],{id:["etiqueta","bolson","id"]}).id>=0)
                  || Object.values(hojas)[0]; }
  if(!med || med.length<2){ const e=new Error("SIN_FILAS"); e.codigo="SIN_FILAS"; throw e; }
  const col = mapaColumnas(med[0], {
    id:["etiqueta","bolson","bolsón","id"], alimento:["alimento","alim"], pasada:["pasada"],
    metros:["metros","metro"], estado:["estado"], nota:["observ","nota"], orden:["orden"],
    lectura:["lectura"], fecha:["fecha"]
  });
  if(col.id<0){ const e=new Error("SIN_COLUMNA_ID"); e.codigo="SIN_COLUMNA_ID";
                e.encabezado=med[0].join(" · "); throw e; }

  const filas = [], fechas = new Set();
  for(let r=1;r<med.length;r++){
    const fl = med[r] || [];
    const cel = i => i>=0 ? String(fl[i]==null?"":fl[i]).trim() : "";
    const fila = { renglon:r+1, etiqueta:cel(col.id), aliTxt:cel(col.alimento), pasada:(cel(col.pasada)||"").toUpperCase(),
                   metrosTxt:cel(col.metros), estadoTxt:cel(col.estado), nota:cel(col.nota),
                   lecturaTxt:cel(col.lectura), orden:numeroDe(cel(col.orden)), importar:true, tocado:false };
    if(fila.orden===undefined) fila.orden=null;
    if(col.fecha>=0 && cel(col.fecha)) fechas.add(fechaDe(cel(col.fecha)));
    filas.push(fila);
  }
  marcarRepetidos(filas);

  // materia seca
  const hms = buscarHoja(hojas,"Materia seca","MateriaSeca","Humedad","MS"), ms = [];
  if(hms && hms.length>1 && hms!==med){
    const enc = hms[0];
    const c = mapaColumnas(enc, {alimento:["alimento","muestra"], pct:["msh","ms","porcentaje"],
                                 origen:["origen"], cual:["cual","cuál"], ini:["pesoinicial","inicial"],
                                 nota:["nota","observ"], falt:["falto","faltaron","faltantes"]});
    const fijas = [], pares = {};
    enc.forEach((h,i)=>{
      const k = norm(h); let m;
      if((m = k.match(/^peso(\d+)min/))) fijas.push({i, min:+m[1]});
      else if((m = k.match(/^min(\d)$/))) (pares[m[1]]=pares[m[1]]||{}).min=i;
      else if((m = k.match(/^g(\d)$/))) (pares[m[1]]=pares[m[1]]||{}).g=i;
    });
    for(let r=1;r<hms.length;r++){
      const fl=hms[r]||[]; const cel=i=> i>=0 ? String(fl[i]==null?"":fl[i]).trim() : "";
      const nom=cel(c.alimento);
      if(!nom) continue;
      const pesadas = fijas.map(x=>({min:x.min, g:numeroDe(cel(x.i))})).filter(p=>p.g!==null&&p.g!==undefined);
      Object.values(pares).forEach(p=>{ const mi=numeroDe(cel(p.min)), g=numeroDe(cel(p.g));
        if(n(mi)!==null && n(g)!==null) pesadas.push({min:mi, g}); });
      const pctTxt = cel(c.pct), pesoIni = numeroDe(cel(c.ini));
      if(!pctTxt && !pesadas.length) continue;
      const dieta = norm(nom).includes("dieta");
      const nota = cel(c.nota);
      const fal = {};
      if(dieta){
        Object.assign(fal, proponerFaltantes(nota));
        cel(c.falt).split(/[,;·]/).forEach(x=>{ const k=alimentoDe(x,true); if(k) fal[k]=`la columna «faltó» dice «${cel(c.falt)}»`; });
      }
      ms.push({ id:uuid(), nombre:nom, alimento:dieta?null:alimentoDe(nom,true), dieta, pctArchivo:numeroDe(pctTxt),
                pesoIni: pesoIni===undefined?null:pesoIni, pesadas,
                origen: origenMsDe(cel(c.origen)) ?? (dieta?"mixer":null), origenTxt:cel(c.origen),
                cual:cel(c.cual), nota, faltantes:Object.keys(fal), porQueFaltantes:fal, importar:true });
    }
  }
  // recuento contado a mano + fecha y medidor de la hoja Recuento
  const hrec = buscarHoja(hojas,"Recuento"), recuento = {};
  let fechaRec = null, quienRec = "";
  if(hrec) hrec.forEach(fl=>{
    if(!fl || !fl[0]) return;
    const nom=String(fl[0]).trim();
    if(norm(nom).startsWith("fechademedicion")){ fechaRec = fechaDe(fl[1])||null; return; }
    if(norm(nom).startsWith("medidopor")){ quienRec = String(fl[1]||"").trim(); return; }
    const val=numeroDe(fl[1]);
    if(val===null||val===undefined) return;
    if(norm(nom)==="total"){ recuento.total=val; return; }
    const k = alimentoDe(nom);
    if(k) (recuento.porAlimento = recuento.porAlimento||{})[k]=val;
  });
  const fs = [...fechas].filter(Boolean);
  return { id:uuid(), tipo:"planilla", fuente, fecha: fechaRec || (fs.length===1?fs[0]:hoy()),
           fechaVarias: fs.length>1 ? fs : null, quien:quienRec, filas, ms, recuento, faltantes:[], motivo:"" };
}
function marcarRepetidos(filas){
  const vistos={};
  filas.forEach(x=>{ if(x.etiqueta && x.importar) (vistos[norm(x.etiqueta)]=vistos[norm(x.etiqueta)]||[]).push(x.renglon); });
  filas.forEach(x=>{ x.repetido = x.etiqueta && x.importar && vistos[norm(x.etiqueta)].length>1 ? vistos[norm(x.etiqueta)] : null; });
}
function fNum(v){ return v===null||v===undefined ? "s/d"
  : Number(v).toLocaleString("es-AR",{maximumFractionDigits:1}); }
function fDelta(d){ return (d>0?"+":d<0?"−":"±")+fNum(Math.abs(d))+" m"; }

/* ══════════════════ LA CORRESPONDENCIA ═══════════════════════════════
   El número de la planilla no identifica al bolsón (se renumera en cada
   recorrido). Para cada renglón se propone el bolsón más probable de los
   que hay en la base, con puntos por criterio:
     · posición en el recorrido dentro del mismo alimento: igual 3, a uno 1
     · metros compatibles con su estado: 3 (cerrado: igual ±0,5 m; en uso:
       bajó o igual; en armado: subió o igual)
     · mismo estado anotado (en uso / en armado): 2
     · misma etiqueta: 2 (hoy casi no dice nada; si un día se pintan los
       números, esto solo ya ordena todo)
   Confianza ALTA: 6 o más puntos y 3 de ventaja sobre el segundo — dos
   señales independientes coinciden y ninguna alternativa se acerca.
   MEDIA: 3 o más y 2 de ventaja. Si no, BAJA: queda "revisar", sin asignar.
   Nada se vincula hasta que Iñaki lo confirma. */
const PUNTOS_ALTA = 6, VENTAJA_ALTA = 3, PUNTOS_MEDIA = 3, VENTAJA_MEDIA = 2;
function candidatos(k){ return D.bolsones.filter(b=>b.alimento===k && b.estado!=="retirado" && b.estado!=="terminado"); }
function medRef(b, fecha){
  const ms = medsValidas(b.id).filter(m=>m.origen!=="auditoria" && m.fecha<=fecha)
    .sort((a,c)=>a.fecha.localeCompare(c.fecha)||String(a.cargado_en).localeCompare(String(c.cargado_en)));
  return ms.length?ms[ms.length-1]:null;
}
/* La posición de un bolsón en el recorrido es la de la última HOJA donde
   apareció (una carga a mano no tiene orden de hoja). */
function ordenRef(b, fecha){
  const ms = medsValidas(b.id).filter(m=>m.origen!=="auditoria" && m.fecha<=fecha && m.orden_planilla!=null)
    .sort((a,c)=>a.fecha.localeCompare(c.fecha)||String(a.cargado_en).localeCompare(String(c.cargado_en)));
  return ms.length ? ms[ms.length-1].orden_planilla : null;
}
function puntaje(fl, rR, c, rC, ref){
  let pts=0; const raz=[];
  const dpos = Math.abs(rR-rC);
  if(dpos===0){ pts+=3; raz.push(`misma posición en el recorrido (${rR}.º)`); }
  else if(dpos===1){ pts+=1; raz.push(`a un lugar en el recorrido (${rC}.º → ${rR}.º)`); }
  if(fl.metros!==null && fl.metros!==undefined && ref){
    const d = fl.metros - n(ref.metros_restantes);
    const est = c.estado;
    let ok=false, txt;
    if(est==="armando"){ ok = d >= -TOL_CERRADO_M; txt = ok?`en armado y creció o quedó igual (${fDelta(d)})`:`en armado pero bajó (${fDelta(d)})`; }
    else if(est==="en_uso"){ ok = d <= TOL_CERRADO_M; txt = ok?`en uso y bajó (${fDelta(d)})`:`en uso pero creció (${fDelta(d)})`; }
    else { ok = Math.abs(d) <= TOL_CERRADO_M;
           txt = ok?`cerrado y mide lo mismo (${fDelta(d)})`:`los metros no cierran: estaba cerrado y cambió ${fDelta(d)}`;
           if(!ok && d<0 && fl.estado==="en_uso"){ ok=true; txt=`estaba cerrado, ahora en uso y bajó (${fDelta(d)}): pudo abrirse`; } }
    if(ok) pts+=3; raz.push(txt);
  }
  if(fl.estado && fl.estado===c.estado && (c.estado==="en_uso"||c.estado==="armando")){ pts+=2; raz.push(`mismo estado anotado (${ESTADOS[c.estado].toLowerCase()})`); }
  if(norm(fl.etiqueta)===norm(c.etiqueta)){ pts+=2; raz.push(`misma etiqueta (${c.etiqueta})`); }
  return {pts, raz};
}
function proponer(){
  const fecha = staging.fecha;
  const filas = staging.filas.filter(fl=>fl.importar && !fl.errBase && fl.alimento);
  const reservados = new Set(staging.filas.filter(fl=>fl.importar && fl.tocado && fl.asignado && fl.asignado!=="nuevo").map(fl=>fl.asignado));
  const porAli = {};
  filas.forEach(fl=>{ (porAli[fl.alimento]=porAli[fl.alimento]||[]).push(fl); });
  Object.entries(porAli).forEach(([k, R])=>{
    const nombre = (D.alimentos[k]||{}).nombre||k;
    const C = candidatos(k);
    R.sort((a,b)=>(a.orden??a.renglon)-(b.orden??b.renglon));
    const rankR = new Map(R.map((x,i)=>[x,i+1]));
    const refs = new Map(C.map(c=>[c.id, medRef(c, fecha)]));
    const ords = new Map(C.map(c=>[c.id, ordenRef(c, fecha)]));
    const Cs = [...C].sort((a,b)=>{
      const oa = ords.get(a.id)??1e6, ob = ords.get(b.id)??1e6;
      return oa-ob || (a.ubicacion.fila||"").localeCompare(b.ubicacion.fila||"") || (a.ubicacion.posicion||0)-(b.ubicacion.posicion||0);
    });
    const rankC = new Map(Cs.map((c,i)=>[c.id,i+1]));
    if(!C.length){
      R.forEach(fl=>{ fl.propuesta = {id:"nuevo", conf:"alta", auto:true,
        por:`No hay ningún bolsón de ${nombre} en la base para comparar: se da de alta como nuevo.`}; });
      return;
    }
    // todos los puntajes
    const pares = [];
    R.forEach(fl=>{ fl._pts = {}; Cs.forEach(c=>{ const p = puntaje(fl, rankR.get(fl), c, rankC.get(c.id), refs.get(c.id));
      fl._pts[c.id] = p; pares.push({fl, c, p}); }); });
    // asignación golosa: el par de más puntos primero, sin repetir bolsón
    pares.sort((a,b)=>b.p.pts-a.p.pts || Math.abs(rankR.get(a.fl)-rankC.get(a.c.id))-Math.abs(rankR.get(b.fl)-rankC.get(b.c.id)));
    const tomado = new Set(reservados), asignada = new Map();
    pares.forEach(({fl,c})=>{ if(asignada.has(fl) || tomado.has(c.id)) return; asignada.set(fl, c); tomado.add(c.id); });
    R.forEach(fl=>{
      const c = asignada.get(fl);
      if(!c){ fl.propuesta = {id:"nuevo", conf:"media",
        por:`Hay más renglones de ${nombre} que bolsones sin asignar: este sobra. Si no es ninguno de los que «no vinieron», es un bolsón nuevo.`};
        return; }
      const s1 = fl._pts[c.id].pts;
      const otros = Cs.filter(x=>x.id!==c.id).map(x=>({c:x, pts:fl._pts[x.id].pts})).sort((a,b)=>b.pts-a.pts);
      const s2 = otros.length ? otros[0].pts : 0;
      const conf = (s1>=PUNTOS_ALTA && s1-s2>=VENTAJA_ALTA) ? "alta" : (s1>=PUNTOS_MEDIA && s1-s2>=VENTAJA_MEDIA) ? "media" : "baja";
      const ref = refs.get(c.id);
      fl.propuesta = { id:c.id, conf, pts:s1, pts2:s2,
        por:`${c.etiqueta} (${ref?fNum(n(ref.metros_restantes))+" m el "+dmy(ref.fecha):"sin medición"}, ${ESTADOS[c.estado].toLowerCase()}): `
           + fl._pts[c.id].raz.join(" · ") + `. ${s1} de 10 puntos`
           + (otros.length?`; el siguiente, ${otros[0].c.etiqueta}, saca ${s2}`:"") + "." };
    });
  });
}
function procesarStaging(){
  const st = staging, fecha = st.fecha;
  marcarRepetidos(st.filas);
  st.filas.forEach(fl=>{
    fl.metros = numeroDe(fl.metrosTxt);
    fl.alimento = alimentoDe(fl.aliTxt);
    fl.estado = estadoDe(fl.estadoTxt);
    fl.lectura = norm(fl.lecturaTxt)==="dudosa" ? "dudosa" : "ok";
    fl.vacia = !fl.etiqueta && !fl.metrosTxt && !fl.aliTxt && !fl.estadoTxt;
    fl.errBase = fl.vacia ? null
      : !fl.etiqueta ? "Tiene datos pero no tiene etiqueta (el número que le puso quien midió). No se puede cargar."
      : fl.repetido ? `«${fl.etiqueta}» aparece en los renglones ${fl.repetido.join(" y ")}. Dejá uno solo.`
      : fl.metros===undefined ? `No entiendo «${fl.metrosTxt}» como metros.`
      : (fl.aliTxt && fl.alimento===undefined) ? `«${fl.aliTxt}» no es ninguno de los alimentos que se embolsan.`
      : !fl.alimento ? "Falta el alimento: sin él no se puede buscar a qué bolsón corresponde."
      : (fl.estadoTxt && fl.estado===undefined) ? `No entiendo el estado «${fl.estadoTxt}». Va C, U, A, T o X.`
      : (fl.metros===0 && fl.estado!=="terminado") ? "Dice 0 m pero no dice que esté terminado. Un 0 solo vale en un bolsón terminado: si no se midió, dejalo vacío (s/d); si se terminó, poné estado T."
      : null;
    fl.propuesta = null;
  });
  if(st.tipo==="planilla") proponer();
  st.filas.forEach(fl=>{
    if(fl.tocado || !fl.propuesta) return;
    fl.asignado = fl.propuesta.auto ? "nuevo" : (fl.propuesta.conf==="baja" ? "" : fl.propuesta.id);
    fl.confirmado = !!fl.propuesta.auto;
  });
  // bolsones de la base que no recibieron ningún renglón
  if(st.tipo==="planilla"){
    const usados = new Set(st.filas.filter(fl=>fl.importar && !fl.errBase && fl.asignado && fl.asignado!=="nuevo").map(fl=>fl.asignado));
    const antes = new Map((st.faltantes||[]).map(x=>[x.id,x.decision]));
    st.faltantes = D.bolsones.filter(b=>b.estado!=="retirado" && b.estado!=="terminado" && !usados.has(b.id))
      .map(b=>({id:b.id, decision:antes.get(b.id)||""}));
  } else st.faltantes = [];
  // diagnóstico de cada renglón
  const elegidos = {};
  st.filas.forEach(fl=>{ if(fl.importar && fl.asignado && fl.asignado!=="nuevo") (elegidos[fl.asignado]=elegidos[fl.asignado]||[]).push(fl.renglon); });
  st.filas.forEach(fl=>diagnosticar(fl, elegidos));
  st.ms.forEach(diagnosticarMs);
}
function diagnosticar(fl, elegidos){
  const lin = [], marcas = [];
  fl.accion = null; fl.reemplaza = null; fl.marcaDif = null;
  const infos = [];
  if(fl.vacia) return fl.diag = {nivel:"vacio", lin:["Renglón vacío, se ignora."], marcas};
  if(!fl.importar) return fl.diag = {nivel:"fuera", lin:["Destildado: no se carga."], marcas};
  if(fl.errBase) return fl.diag = {nivel:"error", lin:[fl.errBase], marcas};
  if(!fl.asignado) return fl.diag = {nivel:"revisar", lin:["Revisar: elegí a qué bolsón corresponde o marcá «bolsón nuevo»."], marcas};
  if(fl.asignado!=="nuevo" && elegidos[fl.asignado] && elegidos[fl.asignado].length>1)
    return fl.diag = {nivel:"error", lin:[`${et(bol(fl.asignado))} está elegido en los renglones ${elegidos[fl.asignado].join(" y ")}: un bolsón, un renglón.`], marcas};
  const b = fl.asignado==="nuevo" ? null : bol(fl.asignado);
  if(fl.asignado!=="nuevo" && !b) return fl.diag = {nivel:"error", lin:["Ese bolsón ya no está en la base."], marcas};
  if(b && b.alimento!==fl.alimento)
    return fl.diag = {nivel:"error", lin:[`${et(b)} es de ${ali(b).nombre} y el renglón dice ${D.alimentos[fl.alimento].nombre}.`], marcas};
  const estFinal = fl.estado || (b?b.estado:"cerrado");
  if(fl.metros===0 && estFinal!=="terminado")
    return fl.diag = {nivel:"error", lin:["Dice 0 m pero el bolsón no está terminado. Un 0 solo vale en un bolsón terminado: si no se midió, dejalo vacío (s/d); si se terminó, poné estado T."], marcas};
  if(!b){
    lin.push(`Se da de alta el bolsón ${fl.etiqueta} (${D.alimentos[fl.alimento].nombre})`
      + (fl.metros===null ? ", sin medición (s/d)." : ` con ${fNum(fl.metros)} m.`));
    if(estFinal!=="cerrado") lin.push(`Estado: ${ESTADOS[estFinal]}${fl.nota?" — «"+fl.nota+"»":""}.`);
  } else {
    lin.push(`Se vincula a ${et(b)}.`);
    if(norm(b.etiqueta)!==norm(fl.etiqueta)) lin.push(`La etiqueta cambia ${b.etiqueta} → ${fl.etiqueta}: queda el evento de renumeración, la historia sigue entera.`);
    if(fl.estado && b.estado!==fl.estado) lin.push(`Estado ${ESTADOS[b.estado]} → ${ESTADOS[fl.estado]}.`);
    if(fl.metros===null) lin.push("Sin metros: queda s/d, no se carga medición.");
    else {
      const ya = medEnFecha(b.id, staging.fecha);
      if(ya && n(ya.metros_restantes)===fl.metros){ fl.accion="igual";
        lin.push(`Ya está cargada igual (${fNum(fl.metros)} m del ${dmy(ya.fecha)}): no se vuelve a cargar.`); }
      else if(ya){ fl.reemplaza = ya.id;
        lin.push(`Ya tiene ${fNum(n(ya.metros_restantes))} m del ${dmy(ya.fecha)}: esa se anula (no se borra) y la reemplaza ${fNum(fl.metros)} m, con el motivo de abajo.`); }
      else { const ant = medAnterior(b.id, staging.fecha);
        lin.push(ant ? `Medición: ${fNum(n(ant.metros_restantes))} m el ${dmy(ant.fecha)} → ${fNum(fl.metros)} m.` : `Primera medición: ${fNum(fl.metros)} m.`); }
      const ant = medAnterior(b.id, staging.fecha);
      const sube = ant ? fl.metros - n(ant.metros_restantes) : 0;
      if(fl.accion!=="igual" && ant && estFinal!=="armando" && sube > TOL_CERRADO_M + 1e-9){
        fl.marcaDif = "diferencia_medicion";
        marcas.push(`<b>Diferencia de medición:</b> subió ${fNum(sube)} m desde el ${dmy(ant.fecha)}
          (${fNum(n(ant.metros_restantes))} → ${fNum(fl.metros)} m), más que la resolución de ${fNum(TOL_CERRADO_M)} m.
          Un bolsón ${ESTADOS[estFinal].toLowerCase()} no crece: no se lee como dato y no se calcula ritmo de consumo con este par.
          Se guarda igual, marcado.`);
      } else if(fl.accion!=="igual" && ant && estFinal!=="armando" && sube > 0){
        fl.marcaDif = "dentro_resolucion";
        infos.push(`Dentro de la resolución: subió ${fNum(sube)} m desde el ${dmy(ant.fecha)} (${fNum(n(ant.metros_restantes))} → ${fNum(fl.metros)} m),
          no más de ${fNum(TOL_CERRADO_M)} m. No es alerta; igual no se calcula ritmo de consumo con este par.`);
      }
    }
  }
  if(fl.lectura==="dudosa") marcas.push(`<b>Lectura dudosa</b> en la hoja${fl.nota?": «"+esc(fl.nota)+"»":""}. Se guarda marcada.`);
  else if(fl.nota) marcas.push(`Nota: «${esc(fl.nota)}».`);
  if(fl.asignado!=="nuevo" && !fl.confirmado)
    return fl.diag = {nivel:"revisar", lin:["Falta confirmar la correspondencia."].concat(lin), marcas, infos};
  if(fl.asignado==="nuevo" && !fl.confirmado)
    return fl.diag = {nivel:"revisar", lin:["Falta confirmar que es un bolsón nuevo."].concat(lin), marcas, infos};
  return fl.diag = {nivel:"listo", lin, marcas, infos};
}
function diagnosticarMs(m){
  const c = calcMs(m); m.calc = c; m.reemplaza = null; m.accion = null;
  const lin = [];
  if(!m.importar){ m.diag = {nivel:"fuera", lin:["Destildada: no se carga."]}; return; }
  if(!m.dieta && !m.alimento){ m.diag = {nivel:"error", lin:[`No reconozco «${m.nombre}» como ingrediente.`]}; return; }
  if(c.pct===null || c.pct<=0 || c.pct>100){ m.diag = {nivel:"error", lin:["No hay un %MS válido (ni pesadas ni porcentaje)."]}; return; }
  if(m.origen===undefined){ m.diag = {nivel:"error", lin:[`No entiendo el origen «${m.origenTxt}». Va B (bolsón), C (celda) o M (mixer).`]}; return; }
  lin.push(`${c.constante===false?"≤ ":""}${fNum(c.pct)} %: ${c.por}.`);
  if(c.desdePesadas && m.pctArchivo!==null && m.pctArchivo!==undefined && Math.abs(m.pctArchivo-c.pct)>0.5)
    lin.push(`⚠ La planilla dice ${fNum(m.pctArchivo)} % pero las pesadas dan ${fNum(c.pct)} %: se usa lo de las pesadas.`);
  if(!m.cual && !m.dieta) lin.push(`De qué ${m.origen==="bolson"?"bolsón":"celda"} salió: s/d.`);
  const prev = (D.calidad||[]).find(x=>!x.anulada && x.fecha===staging.fecha && x.tipo===(m.dieta?"dieta":"ingrediente")
                                         && (m.dieta || x.alimento===m.alimento));
  if(prev){
    // las pesadas se comparan por valor: la base devuelve el JSON con las claves en otro orden
    const pes = xs => JSON.stringify((xs||[]).map(x=>[n(x.min), n(x.g)]).sort((a,b)=>a[0]-b[0]));
    const igual = Math.abs(n(prev.ms_pct)-c.pct)<1e-9 && pes(prev.pesadas)===pes(m.pesadas)
               && n(prev.peso_inicial_g)===n(m.pesoIni) && (prev.origen_tipo||"")===(m.origen||(m.dieta?"mixer":"celda"))
               && (prev.origen_id||"")===(m.cual||"") && JSON.stringify([...(prev.ingredientes_faltantes||[])].sort())===JSON.stringify([...(m.dieta?m.faltantes:[])].sort());
    if(igual){ m.accion="igual"; lin.push("Ya está cargada igual para esta fecha: no se vuelve a cargar."); }
    else { m.reemplaza = prev.id; lin.push(`Ya hay una lectura del ${dmy(prev.fecha)} (${txtMs(prev)}): se anula y la reemplaza esta, con el motivo de abajo.`); }
  }
  m.diag = {nivel:"listo", lin};
}

/* ══════════════════ IMPORTAR: LEER Y REVISAR ═════════════════════════ */
const MSG_ERROR = {
  SIN_DECOMPRESSION:"Este navegador no puede abrir archivos .xlsx. Probá desde Chrome, o guardá la planilla como CSV y subila así.",
  NO_ES_ZIP:"Ese archivo no parece un Excel. Un .xlsx por dentro es un ZIP, y este no lo es. ¿Puede ser que sea un .xls viejo? Guardalo como .xlsx o como CSV.",
  NO_ES_XLSX:"Es un ZIP pero no un Excel: no encontré la planilla adentro.",
  SIN_FILAS:"La planilla está vacía: encontré el encabezado pero ningún renglón cargado.",
  SIN_COLUMNA_ID:"No encuentro la columna de la etiqueta del bolsón."
};
/* Se pueden subir varios archivos juntos: p. ej. el CSV de mediciones y el
   de materia seca. Cada CSV se reconoce por su encabezado. */
async function importarPlanilla(files){
  const lista = [...files];
  try{
    const hojas = {}; let fuente = [];
    for(const file of lista){
      if(/\.csv$/i.test(file.name)){
        const filas = leerCsv(await file.text());
        const enc = norm((filas[0]||[]).join("|"));
        const esMs = /muestra|pesoinicial|peso\d+min/.test(enc) || (/^alimento\|ms/.test(enc));
        hojas[esMs ? "Materia seca" : (hojas.Mediciones ? "Mediciones "+file.name : "Mediciones")] = filas;
        fuente.push("CSV");
      } else if(/\.xlsx$/i.test(file.name)){
        Object.assign(hojas, await leerXlsx(await file.arrayBuffer())); fuente.push("Excel");
      } else {
        const e=new Error("NO_ES_ZIP"); e.codigo= /\.pdf$/i.test(file.name)?"NO_ES_ZIP":"NO_ES_ZIP"; throw e;
      }
    }
    staging = analizarPlanilla(hojas, [...new Set(fuente)].join(" + "));
    staging.archivo = lista.map(x=>x.name).join(" + ");
    procesarStaging();
    vista = "revision"; render();
  }catch(err){
    let m = MSG_ERROR[err.codigo] || `No pude leer el archivo: ${err.message}`;
    if(err.codigo==="SIN_COLUMNA_ID")
      m += ` Esperaba una columna que diga «Etiqueta» o «Bolsón». Encontré: ${err.encabezado||"(nada)"}.`;
    abrirModal({titulo:"No se pudo leer la planilla", texto:esc(m), ok:"Entendido", soloOk:true, onOk:cerrarModal});
  }
}

    </div>
    <div class="frow">
      <div><span class="lbl">Fecha de la medición</span><input type="date" id="revFecha" value="${esc(st.fecha)}"></div>

    </div>
    ${st.fechaVarias?`<div class="alert e">El archivo trae renglones con fechas distintas (${st.fechaVarias.map(dmy).join(", ")}). Un lote es una sola fecha: separalo o corregí la fecha arriba.</div>`:""}
    ${!st.quien?`<p class="hint" style="margin:0">Sin «medido por»: queda s/d. Si fue Silvana, escribilo.</p>`:""}`;
  if(st.tipo==="planilla") h += `<details class="hist" style="margin-top:10px"><summary>Cómo se propone cada bolsón</summary>
    <p class="hint" style="margin:8px 0 0">En el campo los bolsones se renumeran en cada recorrido, así que el número de la
    planilla no dice cuál es. Para cada renglón comparo contra los bolsones de la base del mismo alimento: posición en el
    recorrido (igual 3 puntos, a uno 1), metros compatibles con su estado (3: un cerrado mide lo mismo ±${fNum(TOL_CERRADO_M)} m
    — resolución del odómetro y del criterio de punta —, uno en uso solo baja, uno en armado solo sube), mismo estado anotado (2)
    y misma etiqueta (2). <b>Alta</b>: ${PUNTOS_ALTA}+ puntos y ${VENTAJA_ALTA} de ventaja sobre el segundo.
    <b>Media</b>: ${PUNTOS_MEDIA}+ y ${VENTAJA_MEDIA} de ventaja. Si no, <b>revisar</b> y no se propone nada.
    Ninguna correspondencia se guarda sin que la confirmes.</p></details>`;
  h += `</div>`;

  const rec = st.recuento||{};
  if(rec.total!==undefined || rec.porAlimento){
    const cargados = imp.filter(x=>x.diag.nivel!=="error").length;
    const dif = rec.total!==undefined ? cargados-rec.total : null;
    h += dif===null||dif===0
      ? `<div class="alert" style="background:#e7f5ec;border:1px solid #2E9E5B;color:#1c6b3a">

      : `<div class="alert w">El recuento dice <b>${f(rec.total)}</b> bolsones contados en el campo,

  if(altasSinConf.length)
    h += `<div class="bar"><button id="revConfAltas">Confirmar las ${altasSinConf.length} propuestas de confianza alta</button>
      <span class="hint" style="margin:0">Las de confianza media se confirman una por una.</span></div>`;

  const opAli = `<option value="">—</option>` + Object.entries(D.alimentos)
    .filter(([k,a])=>!a.sinBolson).map(([k,a])=>`<option value="${k}">${esc(a.nombre)}</option>`).join("");
  const opEst = `<option value="">—</option>` + Object.entries(ESTADOS)
    .map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  fs.forEach((x,i)=>{
    if(x.diag.nivel==="vacio") return;
    const nv = x.diag.nivel;
    const cands = x.alimento ? candidatos(x.alimento) : [];
    const opAsig = `<option value="">— revisar: sin decidir —</option><option value="nuevo">Bolsón nuevo</option>`

      <div class="cab">
        <label class="tap" title="Cargar este renglón"><input type="checkbox" data-rv="importar" ${x.importar?"checked":""}></label>
        <span class="mono" style="color:#9aa4b5;font-size:12px">R${x.renglon}</span>
        <input data-rv="etiqueta" value="${esc(x.etiqueta)}" style="width:78px" aria-label="Etiqueta">

      </div>
      ${st.tipo==="planilla" && x.importar && !x.errBase ? `<div class="cab" style="margin-top:7px">

  if(vac) h += `<p class="hint">${vac} renglones vacíos, no se muestran.</p>`;

  // materia seca leída
  if(st.ms.length){
    h += `<div class="card" style="margin-top:12px"><h2>Materia seca</h2>

    st.ms.forEach((m,i)=>{
      const ings = ingsDieta();
      h += `<div class="renglon-rev ${m.diag.nivel==="error"?"error":"listo"}" data-ms="${i}">

          <span class="mono">${m.pesoIni?f(m.pesoIni)+" g":""}${(m.pesadas||[]).map(p=>` → ${f(p.g)} g (${p.min} min)`).join("")}</span>
          <span class="chip">${esc(ORIGEN_MS[m.origen]||m.origenTxt||"origen s/d")}</span>
          <span>cuál: ${m.cual?esc(m.cual):SD}</span></div>
        <div class="marca" style="color:${m.diag.nivel==="error"?"#a33":"#465a7e"}">${m.diag.lin.map(esc).join("<br>")}</div>
        ${m.nota?`<div class="marca src">Nota: «${esc(m.nota)}»</div>`:""}
        ${m.dieta?`<div class="marca"><b>¿Qué faltaba en la dieta ese día?</b> El teórico de comparación se calcula sin eso.
          <div class="bar" style="margin:6px 0 0">${ings.map(k=>`<label class="chip" style="cursor:pointer;padding:5px 10px">

          ${(()=>{ const t=msDietaTeorico(m.faltantes); return `<div class="src">Teórico de comparación: ${t?f(t.pct,1)+" %":"s/d"}${m.faltantes.length?" (sin "+m.faltantes.map(k=>(D.alimentos[k]||{}).nombre).join(", ")+")":""}.</div>`; })()}

      «No se midió» no cambia nada; «se terminó» lo cierra; «ya no está» lo saca de los totales y del mapa conservando su historia.</p>

    st.faltantes.forEach((x,i)=>{
      const b=bol(x.id), u=b?ultimaMed(b.id):null;

        <select data-falta="${i}" style="margin-left:auto">
          <option value="">— ¿qué pasó? —</option>
          <option value="no_medido"${x.decision==="no_medido"?" selected":""}>No se midió</option>
          <option value="terminado"${x.decision==="terminado"?" selected":""}>Se terminó</option>
          <option value="retirado"${x.decision==="retirado"?" selected":""}>Ya no está</option></select></div></div>`;
    });
    h += `</div>`;
  }

  const reemp = imp.filter(x=>x.diag.nivel==="listo" && x.reemplaza).length + st.ms.filter(m=>m.importar && m.reemplaza).length;
  if(reemp)
    h += `<div class="card" style="margin-top:12px"><h2>Motivo de los reemplazos</h2>

  const faltDec = st.faltantes.filter(x=>!x.decision).length;

  const bloqueos = [];
  if(err) bloqueos.push(`${err} renglón(es) con problema (corregilos o destildalos)`);
  if(errMs) bloqueos.push(`${errMs} lectura(s) de MS con problema`);
  if(rev) bloqueos.push(`${rev} renglón(es) sin decidir`);
  if(faltDec) bloqueos.push(`${faltDec} bolsón(es) que no vinieron sin respuesta`);
  if(reemp && !String(st.motivo||"").trim()) bloqueos.push("falta el motivo de los reemplazos");
  if(st.fechaVarias) bloqueos.push("fechas mezcladas");
  if(!conMet && !nuevos && !nMs && !st.faltantes.some(x=>x.decision==="terminado"||x.decision==="retirado")) bloqueos.push("no hay nada para guardar");
  h += `<div class="sticky-save">
    ${bloqueos.length?`<div class="hint" style="margin:0 0 6px;color:#8a5d00">Para confirmar falta: ${esc(bloqueos.join(" · "))}.</div>`:""}
    <div style="display:flex;gap:9px">
      <button id="revCancel" style="flex:1">Cancelar</button>
      <button class="p" id="revOk" style="flex:2" ${bloqueos.length?"disabled":""}>
        Confirmar el lote: ${conMet} medición(es), ${nuevos} nuevo(s)${nMs?`, ${nMs} MS`:""}</button>
    </div></div>`;
  return h;
}

function confirmarImport(){
  const st = staging;
  procesarStaging();
  const p = { id:st.id, tipo:st.tipo, archivo:st.archivo||"", fecha:st.fecha, medido_por:(st.quien||"").trim(),
              nuevos:[], renumerar:[], estados:[], mediciones:[], calidad:[], revision:[], resumen:{} };
  const motivo = `Reimportación del ${dmy(st.fecha)}: ${String(st.motivo||"").trim()}`;
  const posSig = {};
  const totales = {};
  st.filas.forEach(x=>{
    if(!x.importar || x.diag.nivel!=="listo") return;
    let id = x.asignado;
    if(id==="nuevo"){
      id = x.idNuevo || (x.idNuevo = uuid());
      const fila = x.pasada==="B" ? "B" : "A";
      if(posSig[fila]===undefined) posSig[fila] = Math.max(0, ...D.bolsones.filter(b=>b.ubicacion.fila===fila).map(b=>b.ubicacion.posicion||0));
      p.nuevos.push({id, etiqueta:x.etiqueta, alimento:x.alimento, fila, posicion:++posSig[fila], nota:""});
      if(x.estado && x.estado!=="cerrado") p.estados.push({bolson_id:id, estado:x.estado});
    } else {
      const b = bol(id);
      if(norm(b.etiqueta)!==norm(x.etiqueta)) p.renumerar.push({bolson_id:id, etiqueta:x.etiqueta});
      if(x.estado && x.estado!==b.estado) p.estados.push({bolson_id:id, estado:x.estado});
    }
    if(x.metros!==null && x.metros!==undefined && x.accion!=="igual"){
      p.mediciones.push({ id:x.idMed || (x.idMed = uuid()), bolson_id:id, metros:x.metros, etiqueta_planilla:x.etiqueta,
        // en una carga a mano no hay hoja: el orden queda vacío (no se inventa)
        orden_planilla: st.tipo==="manual" ? null : (x.orden!=null ? x.orden : x.renglon-1), estado_anotado:x.estado||"", lectura:x.lectura,
        nota:x.nota||"", reemplaza_a:x.reemplaza||null, motivo:x.reemplaza?motivo:null,
        revision_marca: x.marcaDif || null });
      const t = totales[x.alimento] = totales[x.alimento]||{m:0,n:0}; t.m = +(t.m + x.metros).toFixed(2); t.n++;
    }
    p.revision.push({ renglon:x.renglon, etiqueta:x.etiqueta, alimento:x.alimento, metros:x.metros, bolson_id:id,
      decision: x.asignado==="nuevo"?"nuevo":"vinculado", confianza: x.propuesta?x.propuesta.conf:"manual",
      propuesto: x.propuesta?x.propuesta.id:null, por: x.propuesta?x.propuesta.por:"cargado a mano",
      cambiado_a_mano: !!(x.tocado && x.propuesta && x.propuesta.id!==x.asignado),
      lineas: x.diag.lin, marcas: x.diag.marcas.map(m=>m.replace(/<[^>]+>/g,"")), infos: x.diag.infos||[] });
  });
  st.faltantes.forEach(x=>{
    if(x.decision==="terminado"||x.decision==="retirado") p.estados.push({bolson_id:x.id, estado:x.decision});
    p.revision.push({ no_vino:true, bolson_id:x.id, etiqueta:et(bol(x.id)), decision:x.decision });
  });
  st.ms.forEach(m=>{
    if(!m.importar || m.diag.nivel!=="listo" || m.accion==="igual") return;
    p.calidad.push({ id:m.id, tipo:m.dieta?"dieta":"ingrediente", alimento:m.dieta?null:m.alimento,
      origen_tipo:m.origen||(m.dieta?"mixer":"celda"), origen_id:m.cual||"", peso_inicial_g:m.pesoIni,
      pesadas:m.pesadas||[], peso_constante:m.calc.constante, ms_pct:+m.calc.pct.toFixed(4),
      ingredientes_faltantes:m.dieta?m.faltantes:[], nota:m.nota||"",
      reemplaza_a:m.reemplaza||null, motivo:m.reemplaza?motivo:null });
    p.revision.push({ ms:true, nombre:m.nombre, lineas:m.diag.lin });
  });
  p.resumen = { mediciones:p.mediciones.length, nuevos:p.nuevos.length,
    vinculados:p.revision.filter(r=>r.decision==="vinculado").length,
    terminados:st.faltantes.filter(x=>x.decision==="terminado").length,
    retirados:st.faltantes.filter(x=>x.decision==="retirado").length,
    no_medidos:st.faltantes.filter(x=>x.decision==="no_medido").length,
    ms:p.calidad.length, reemplazos:p.mediciones.filter(m=>m.reemplaza_a).length,
    diferencias:p.mediciones.filter(m=>m.revision_marca==="diferencia_medicion").length,
    dentro_resolucion:p.mediciones.filter(m=>m.revision_marca==="dentro_resolucion").length,
    dudosas:p.mediciones.filter(m=>m.lectura==="dudosa").length, totales };
  encolar({fn:"confirmar_lote", args:{p}, desc:`Lote del ${dmy(st.fecha)}: ${p.mediciones.length} medición(es), ${p.nuevos.length} nuevo(s)`});
  staging = null; cargaBuf = {}; cargaModo = null; vista = "panel"; render();
  mostrarAviso(`Lote del ${dmy(p.fecha)} enviado: ${p.mediciones.length} medición(es), ${p.nuevos.length} bolsón(es) nuevo(s), ${p.calidad.length} lectura(s) de MS. Queda pendiente de auditar.`);
}

/* La carga a mano pasa por la misma revisión que la planilla: un solo
   camino para guardar, y las mismas marcas (diferencia de medición, cero). */
function stagingDeMano(){
  const fecha = cargaBuf.__fecha || hoy();
  const filas = [];
  recorrido().forEach((b,i)=>{
    const v = cargaBuf[b.id], est = cargaBuf["est:"+b.id];
    if((v===undefined||String(v).trim()==="") && (!est || est===b.estado)) return;
    filas.push({ renglon:i+1, etiqueta:b.etiqueta, aliTxt:b.alimento, pasada:b.ubicacion.fila, metrosTxt:String(v??"").trim(),
      estadoTxt: est && est!==b.estado ? est : "", nota:"", lecturaTxt:"", orden:null, importar:true,
      asignado:b.id, confirmado:true, tocado:true, propuesta:null });
  });
  const ms = [];
  Object.keys(cargaBuf).filter(k=>k.startsWith("ms:")).forEach(k=>{
    const key = k.slice(3), v = cargaBuf[k]||{};
    const pes = pesadasDeTexto(v.pes), pct = numeroDe(v.pct), ini = numeroDe(v.ini);
    if(!pes.length && (pct===null||pct===undefined)) return;
    const dieta = key==="__dieta", fal = dieta ? proponerFaltantes(v.nota) : {};
    ms.push({ id:uuid(), nombre: dieta?"Dieta mezclada":(D.alimentos[key]||{}).nombre, alimento: dieta?null:key, dieta,
      pctArchivo: pct===undefined?null:pct, pesoIni: ini===undefined?null:ini, pesadas:pes,
      origen: dieta?"mixer":(v.origen||null), origenTxt:v.origen||"", cual:v.cual||"", nota:v.nota||"",
      faltantes:Object.keys(fal), porQueFaltantes:fal, importar:true });
  });
  return { id:uuid(), tipo:"manual", fuente:"a mano", archivo:"", fecha, quien:cargaBuf.__quien||"",
           filas, ms, recuento:{}, faltantes:[], motivo:"" };
}

/* ══════════════════ PANTALLA: MAPA ═══════════════════════════════════ */
/* Un silo bolsa visto desde arriba es un tubo de polietileno con las dos
   puntas atadas, no una elipse. Se dibuja como cápsula con los atados en
   las puntas, las arrugas del plástico, y —si está en uso— la extractora
   enganchada en el frente de extracción. El contorno punteado marca el
   largo original cuando se conoce: el bolsón se ve encogerse. */

function svgBolson(o){
  const {cx, cy, largo, ancho, color, estado, ini, id, sub, sel} = o;
  const w = ancho, h = Math.max(14, largo), r = w/2;
  const y0 = cy - h/2, y1 = cy + h/2;
  const term = estado==="terminado", uso = estado==="en_uso", arm = estado==="armando";
  const abierto = uso || arm;
  const col = term ? "#9aa3b0" : color;
  let s = "";

  // huella del largo original: se ve cuánto encogió
  if(ini!==null && ini>h){
    const iy0 = cy - ini/2, iy1 = cy + ini/2;
    s += `<rect x="${(cx-w/2).toFixed(1)}" y="${iy0.toFixed(1)}" width="${w}" height="${(iy1-iy0).toFixed(1)}"
           rx="${r}" fill="none" stroke="${col}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45"/>`;
  }
  // sombra en el piso
  s += `<rect x="${(cx-w/2+2).toFixed(1)}" y="${(y0+3).toFixed(1)}" width="${w}" height="${h.toFixed(1)}"
         rx="${r}" fill="#0f1e38" opacity=".07"/>`;
  // cuerpo del tubo
  s += `<rect x="${(cx-w/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="${r}"
         fill="${term?"#eef0f4":"#fdfdfb"}" stroke="${col}" stroke-width="${sel?3.4:2.2}"/>`;
  // banda de color del alimento, a lo largo
  if(!term)
    s += `<rect x="${(cx-w*0.17).toFixed(1)}" y="${(y0+r*0.7).toFixed(1)}" width="${(w*0.34).toFixed(1)}"
           height="${Math.max(0,h-r*1.4).toFixed(1)}" rx="${(w*0.17).toFixed(1)}" fill="${col}" opacity=".26"/>`;
  // arrugas del polietileno
  const paso = term?7:10;
  for(let y=y0+r+3; y<y1-r-2; y+=paso)
    s += `<line x1="${(cx-w/2+3).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx+w/2-3).toFixed(1)}" y2="${y.toFixed(1)}"
           stroke="${col}" stroke-width="1" opacity="${term?.28:.15}"/>`;
  // brillo del plástico
  if(!term)
    s += `<rect x="${(cx-w/2+3.5).toFixed(1)}" y="${(y0+r).toFixed(1)}" width="2.5"
           height="${Math.max(0,h-r*2).toFixed(1)}" rx="1.2" fill="#fff" opacity=".9"/>`;
  // atados de las puntas
  const atado=(y,dir)=>`<path d="M${(cx-w*0.26).toFixed(1)} ${y} L${cx.toFixed(1)} ${(y+dir*9)} L${(cx+w*0.26).toFixed(1)} ${y} Z"
     fill="${col}" opacity=".85"/>`;
  s += atado(y0.toFixed(1),-1);
  if(!abierto) s += atado(y1.toFixed(1),1);

  // la máquina enganchada dice qué le está pasando al bolsón
  if(uso) s += svgExtractora(cx, y1, w, color);
  if(arm) s += svgEmbolsadora(cx, y1, w, color);

  // etiquetas
  s += `<text x="${cx.toFixed(1)}" y="${(y0-(ini!==null&&ini>h?(ini-h)/2:0)-15).toFixed(1)}" text-anchor="middle"
         font-size="11.5" font-weight="700" fill="#1a2233">${id}</text>`;
  s += `<text x="${cx.toFixed(1)}" y="${(y1+(arm?74:(uso?52:20))).toFixed(1)}" text-anchor="middle" font-size="11.5"
         fill="${sub.sd?"#b0b8c6":"#5b6678"}" style="font-style:${sub.sd?"italic":"normal"}">${sub.txt}</text>`;
  return s;
}

/* Embolsadora: tolva de recepción que carga el bolsón mientras la máquina
   retrocede. Se dibuja con la tolva del lado de afuera y la barra de
   enganche al tractor: el material entra al bolsón, no sale. */
function svgEmbolsadora(cx, y, w, color){
  const bw = Math.max(30, w*1.75), bh = 16, by = y + 8;
  return `<g class="maq">
    <rect x="${(cx-bw/2-5).toFixed(1)}" y="${(by+3).toFixed(1)}" width="5" height="12" rx="2" fill="#2f3947"/>
    <rect x="${(cx+bw/2).toFixed(1)}" y="${(by+3).toFixed(1)}" width="5" height="12" rx="2" fill="#2f3947"/>
    <rect x="${(cx-bw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh}" rx="3"
          fill="#57627a" stroke="#3b4557" stroke-width="1"/>
    <path d="M${(cx-bw*0.34).toFixed(1)} ${(by+bh).toFixed(1)} L${(cx-bw*0.46).toFixed(1)} ${(by+bh+13).toFixed(1)}
             L${(cx+bw*0.46).toFixed(1)} ${(by+bh+13).toFixed(1)} L${(cx+bw*0.34).toFixed(1)} ${(by+bh).toFixed(1)} Z"
          fill="${color}" fill-opacity=".55" stroke="#3b4557" stroke-width="1"/>
    <line x1="${cx.toFixed(1)}" y1="${(by+bh+13).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(by+bh+22).toFixed(1)}"
          stroke="#3b4557" stroke-width="2.5"/>
    <path d="M${cx.toFixed(1)} ${(by-4).toFixed(1)} l-4 6 h8 Z" fill="${color}" class="lat"/>
  </g>`;
}
function svgExtractora(cx, y, w, color){
  const bw = Math.max(26, w*1.55), bh = 15, by = y + 7;
  return `<g class="maq">
    <rect x="${(cx-bw/2-5).toFixed(1)}" y="${(by+2).toFixed(1)}" width="5" height="11" rx="2" fill="#2f3947"/>
    <rect x="${(cx+bw/2).toFixed(1)}" y="${(by+2).toFixed(1)}" width="5" height="11" rx="2" fill="#2f3947"/>
    <rect x="${(cx-bw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh}" rx="3"
          fill="#57627a" stroke="#3b4557" stroke-width="1"/>
    <line x1="${(cx-bw/2+4).toFixed(1)}" y1="${(by+bh/2).toFixed(1)}" x2="${(cx+bw/2-4).toFixed(1)}"
          y2="${(by+bh/2).toFixed(1)}" stroke="#8f9ab0" stroke-width="2"/>
    <path d="M${(cx+bw/2).toFixed(1)} ${(by+4).toFixed(1)} L${(cx+bw/2+15).toFixed(1)} ${(by+21).toFixed(1)}"
          stroke="#57627a" stroke-width="4.5" stroke-linecap="round"/>
    <circle class="lat" cx="${(cx+bw/2+15).toFixed(1)}" cy="${(by+21).toFixed(1)}" r="4.5" fill="${color}"/>
  </g>`;
}

function vMapa(){
  const bs = recorrido();
  if(!bs.length) return `<div class="card"><h2>Mapa</h2><p class="hint" style="margin:0">No hay bolsones en la base todavía.${D.relevamientos.length&&esAdmin()
    ?" Los relevamientos cargados son fotos: si alguno es de los bolsones de hoy, se vincula desde Panel → Evolución del stock.":""}</p></div>`;
  const filas = [...new Set(bs.map(b=>b.ubicacion.fila||"A"))].sort();
  const W=1240, PAD=34, rowH=330, topY=70, MAXH=196;
  const maxM = Math.max(60, ...bs.map(b=>Math.max(metrosAct(b)||0, n(b.armado.metros_iniciales)||0)));
  const H = topY + filas.length*rowH;
  const nMax = Math.max(1, ...filas.map(fl=>bs.filter(b=>(b.ubicacion.fila||"A")===fl).length));
  const step = (W-PAD*2)/nMax;
  const anchoBolsa = Math.min(step*0.60, 34);
  let s = `<rect x="8" y="8" width="${W-16}" height="${H-16}" fill="none" stroke="#1a2233" stroke-width="2.5" rx="4"/>`;

  filas.forEach((fl,fi)=>{
    let lista = bs.filter(b=>(b.ubicacion.fila||"A")===fl);
    if(fi%2===1) lista = [...lista].reverse();
    const cy = topY + fi*rowH + rowH/2 - 34;
    s += `<text x="${PAD}" y="${topY+fi*rowH-16}" font-size="12" font-weight="700" fill="#6b7789">
      PASADA ${esc(fl)} · ${fl==="A"?"desde el galpón para el fondo":"desde el fondo para el galpón (dibujada al revés)"}</text>`;
    const grupos=[];
    lista.forEach(b=>{ const g=gkey(b),l=grupos[grupos.length-1];
      if(l&&l.key===g) l.items.push(b); else grupos.push({key:g,items:[b]}); });
    let idx=0; const cxsFila=[];
    grupos.forEach(gr=>{
      const multi = gr.items.length>1, xs=[];
      const w = multi ? anchoBolsa*0.78 : anchoBolsa;
      gr.items.forEach(b=>{
        const a=ali(b), m=metrosAct(b), ini=n(b.armado.metros_iniciales);
        const cx = PAD+step*(idx+0.5); xs.push(cx); cxsFila.push(cx);
        const largo = m===null ? 46 : m/maxM*MAXH;
        const rot = esc(multi?(et(b).replace(b.grupo,"")||et(b)):et(b));
        s += `<g class="bolg" data-ficha="${esc(b.id)}">`;
        if(m===null){
          const hh=46, y0=cy-hh/2;
          s += `<rect x="${(cx-w/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${w}" height="${hh}" rx="${w/2}"
                 fill="#f6f7fa" stroke="#b0b8c6" stroke-width="2" stroke-dasharray="5 4"/>
                <text x="${cx.toFixed(1)}" y="${(y0-15).toFixed(1)}" text-anchor="middle" font-size="11.5"
                 font-weight="700" fill="#1a2233">${rot}</text>
                <text x="${cx.toFixed(1)}" y="${(cy+hh/2+20).toFixed(1)}" text-anchor="middle" font-size="11.5"
                 fill="#b0b8c6" style="font-style:italic">s/d</text>`;
        } else {
          s += svgBolson({ cx, cy, largo, ancho:w, color:a.color, estado:b.estado,
            ini: ini===null?null:ini/maxM*MAXH, id: rot,
            sub:{sd:false, txt:f(m, m%1?1:0)+" m"+(difMedicion(b)?" ⚠":"")}, sel:selMapa===b.id });
        }
        const p = pctConsumido(b);
        s += `<title>${esc(et(b))} · ${esc(a.nombre)} · ${esc(ESTADOS[b.estado])}
${m===null?"sin medición":f(m,1)+" m → "+f(kgAct(b)/1000,1)+" tn"}${p===null?"\nconsumido: s/d (falta el largo inicial)":"\nconsumido: "+f(p,0)+"%"}${difMedicion(b)?"\ndiferencia de medición en la última":""}</title></g>`;
        idx++;
      });
      if(multi){
        const x0=xs[0]-w/2-5, x1=xs[xs.length-1]+w/2+5, yb=cy+MAXH/2+46;
        const mt=gr.items.reduce((t,b)=>t+(metrosAct(b)||0),0);
        s += `<path d="M${x0.toFixed(1)} ${yb-8} L${x0.toFixed(1)} ${yb} L${x1.toFixed(1)} ${yb} L${x1.toFixed(1)} ${yb-8}"
                fill="none" stroke="#8a93a3" stroke-width="1.6"/>
              <text x="${((x0+x1)/2).toFixed(1)}" y="${yb+16}" text-anchor="middle" font-size="11"
                font-weight="700" fill="#5b6678">${esc(gr.key)} · 1 bolsón partido · ${f(mt,1)} m</text>`;
      }
    });
    if(cxsFila.length && esAdmin()) s += svgHuecos(fl, cxsFila, cy, MAXH+70);
  });
  const ley = Object.entries(D.alimentos).map(([k,a])=>{
    const c = nBols(bs.filter(b=>b.alimento===k));
    return c?`<span class="chip"><span class="dot" style="background:${a.color}"></span> ${esc(a.nombre)} · ${c}</span>`:"";
  }).join(" ");
  return `<div class="card"><h2>Mapa</h2>
    ${esAdmin()?`<p class="hint">Desde acá se maneja la playa: <b>arrastrá un bolsón</b> para reordenarlo o pasarlo a la otra
    pasada, y <b>arrastrá una máquina</b> sobre un bolsón para ponerlo en uso o en armado. En el celular,
    tocá una vez para elegir y otra vez para soltar. Tocando dos veces el mismo bolsón se abre lo que se puede hacer con él.</p>
    ${vPaleta()}`:`<p class="hint">Tocá un bolsón para abrir su ficha. Mover bolsones y máquinas lo hace el admin.</p>`}
    <p class="hint">El <b>largo es proporcional a los metros que quedan</b>; el contorno punteado marca el largo original
    cuando se conoce. Extractora enganchada = en uso; embolsadora = en armado. ⚠ = diferencia de medición en la última.</p>
    <div class="bar">${ley}
      <span class="chip"><span class="dot" style="background:#9aa3b0"></span> terminado</span>
      <span class="chip"><span class="dot" style="background:#dfe4ec"></span> sin medir</span></div>
    <div style="overflow-x:auto"><svg class="map" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="min-width:${Math.min(W, 560)}px">${s}</svg></div></div>`;
}

/* ══════════════════ MAPA INTERACTIVO ═════════════════════════════════
   Cada movimiento es una operación contra la base con la versión de cada
   bolsón. «Deshacer» manda la operación inversa: el historial queda
   completo (nada se borra), y la playa vuelve a como estaba. */
let arrastre = null, maqArmada = null, selMapa = null;
function reordenarLocal(fila, lista){
  return lista.filter(b=>(b.ubicacion.fila||"A")===fila)
    .sort((a,b)=>(a.ubicacion.posicion||0)-(b.ubicacion.posicion||0))
    .map((b,i)=>({b, posicion:i+1}));
}
function moverBolson(id, filaDest, posDest){
  const b = bol(id); if(!b || !esAdmin()) return;
  const antes = vivos().map(x=>({id:x.id, fila:x.ubicacion.fila, posicion:x.ubicacion.posicion}));
  const copia = vivos().map(x=>({id:x.id, ubicacion:Object.assign({}, x.ubicacion)}));
  const yo_ = copia.find(x=>x.id===id); const filaOrig = yo_.ubicacion.fila||"A";
  yo_.ubicacion.fila = filaDest; yo_.ubicacion.posicion = posDest - 0.5;
  const cambios = [];
  [...new Set([filaDest, filaOrig])].forEach(fl=>reordenarLocal(fl, copia).forEach(({b:x,posicion})=>{
    const real = bol(x.id);
    if(real.ubicacion.fila!==x.ubicacion.fila || real.ubicacion.posicion!==posicion)
      cambios.push({id:x.id, fila:x.ubicacion.fila, posicion, version:real.actualizado_en});
  }));
  if(!cambios.length) return;
  undoPila.push({etiqueta:"mover "+et(b), deshacer:()=>{
    const inv = antes.filter(a=>{ const r=bol(a.id); return r && (r.ubicacion.fila!==a.fila || r.ubicacion.posicion!==a.posicion); })
      .map(a=>({id:a.id, fila:a.fila, posicion:a.posicion, version:bol(a.id).actualizado_en}));
    if(inv.length) encolar({fn:"mover_bolsones", args:{p:inv}, desc:"Deshacer: "+"mover "+et(b)});
  }});
  encolar({fn:"mover_bolsones", args:{p:cambios}, desc:`Mover ${et(b)} a la pasada ${filaDest}`});
  mostrarAviso(`${et(b)} movido a la pasada ${filaDest}, posición ${Math.max(1,posDest-(filaOrig===filaDest&&posDest>b.ubicacion.posicion?1:0))}.`,"Deshacer",deshacer);
}
function deshacer(){
  const u = undoPila.pop(); if(!u) return;
  aviso = null; u.deshacer();
}
function ponerEstado(id, estado, txt){
  const b = bol(id); if(!b || b.estado===estado || !esAdmin()) return;
  const antes = b.estado;
  undoPila.push({etiqueta:txt, deshacer:()=>{ const x=bol(id); if(x && x.estado!==antes) editarBolson(x, {estado:antes}, `Deshacer: ${txt}`); }});
  editarBolson(b, {estado}, `${et(b)}: ${ESTADOS[estado]}`);
  mostrarAviso(`${et(b)}: ${txt}.`,"Deshacer",deshacer);
}
function engancharMaquina(id, estado){ ponerEstado(id, estado, ESTADOS[estado]); }
function desengancharMaquina(id){
  const b = bol(id); if(!b || (b.estado!=="en_uso" && b.estado!=="armando")) return;
  ponerEstado(id, "cerrado", "máquina sacada, queda cerrado");
}
/* Sacar un bolsón es «ya no está»: sale del mapa y de los totales y
   conserva toda su historia. No hay borrado: nada se pisa. */
function accionesBolson(id){
  const b = bol(id); if(!b) return;
  if(!esAdmin()){ fichaId=id; vista="ficha"; render(); return; }
  const nMed = D.mediciones.filter(m=>m.bolson_id===id && !m.anulada).length;
  const opts = [];
  if(b.estado!=="en_uso")  opts.push({t:"Enganchar la extractora — pasa a en uso", f:()=>engancharMaquina(id,"en_uso")});
  if(b.estado!=="armando") opts.push({t:"Enganchar la embolsadora — pasa a en armado", f:()=>engancharMaquina(id,"armando")});
  if(b.estado==="en_uso"||b.estado==="armando") opts.push({t:"Sacar la máquina — vuelve a cerrado", f:()=>desengancharMaquina(id)});
  if(b.estado!=="terminado") opts.push({t:"Marcar como terminado", f:()=>ponerEstado(id,"terminado","terminado")});
  opts.push({t:"Mover a la otra pasada", f:()=>{
    const otra = (b.ubicacion.fila||"A")==="A" ? "B" : "A";
    moverBolson(id, otra, vivos().filter(x=>(x.ubicacion.fila||"A")===otra).length+1); }});
  opts.push({t:"Abrir la ficha", f:()=>{ fichaId=id; vista="ficha"; render(); }});
  abrirModal({
    titulo:`${et(b)} — ${(D.alimentos[b.alimento]||{}).nombre||b.alimento}`,
    texto:`${esc(ESTADOS[b.estado])} · pasada ${esc(b.ubicacion.fila)} posición ${b.ubicacion.posicion} · ${nMed} medición(es)`,
    lista: opts,
    peligrosas: [
      {t:"Ya no está", sub:"Sale del mapa y de los totales, pero conserva sus " + nMed + " medición(es). No se borra nada.",
       f:()=>{ cerrarModal(); ponerEstado(id,"retirado","marcado como «ya no está»"); }}
    ],
    soloOk:true, ok:"Cerrar", onOk:cerrarModal
  });
}
function vPaleta(){

  return `<div class="paleta">
    <span style="font-size:12px;color:var(--muted);font-weight:600">Máquinas:</span>
    <span class="maqchip${maqArmada==="en_uso"?" activo":""}" data-maq="en_uso" title="Arrastrala sobre un bolsón, o tocala y después tocá el bolsón">
      <svg width="30" height="15"><rect x="2" y="4" width="16" height="8" rx="2" fill="#57627a"/>

     <button id="cancelSel" style="min-height:44px;padding:4px 10px">cancelar</button></div>`:""}`;

function svgHuecos(fila, cxs, cy, alto){
  let s = "";
  for(let i=0;i<=cxs.length;i++){
    const x = i===0 ? cxs[0]-34 : (i===cxs.length ? cxs[i-1]+34 : (cxs[i-1]+cxs[i])/2);
    s += `<rect class="hueco" data-fila="${fila}" data-pos="${i+1}" x="${(x-13).toFixed(1)}"
            y="${(cy-alto/2).toFixed(1)}" width="26" height="${alto}" rx="6" fill="transparent" stroke="none"/>`;
  }
  return s;
}
function cablearMapa(){
  const svg = document.querySelector("svg.map[viewBox]");
  if(!svg) return;
  if(!esAdmin()){
    svg.querySelectorAll("g.bolg").forEach(g=>{ g.onclick=()=>{ fichaId=g.dataset.ficha; vista="ficha"; render(); }; });
    return;
  }
  document.querySelectorAll("[data-maq]").forEach(el=>{
    el.onclick = ()=>{ maqArmada = maqArmada===el.dataset.maq ? null : el.dataset.maq; selMapa=null; render(); };
    el.onpointerdown = ()=>{ arrastre = {tipo:"maquina", estado:el.dataset.maq}; };
  });
  const cm=document.getElementById("cancelMaq"); if(cm) cm.onclick=()=>{ maqArmada=null; render(); };
  const cs=document.getElementById("cancelSel"); if(cs) cs.onclick=()=>{ selMapa=null; render(); };
  const as=document.getElementById("accionesSel"); if(as) as.onclick=()=>{ const id=selMapa; selMapa=null; accionesBolson(id); };
  const bd=document.getElementById("btnDeshacer"); if(bd) bd.onclick=deshacer;
  svg.querySelectorAll("g.bolg").forEach(g=>{
    const id = g.dataset.ficha;
    g.onclick = null;
    g.style.touchAction = "none";
    g.onpointerdown = ev=>{
      if(maqArmada) return;
      arrastre = {tipo:"bolson", id, x0:ev.clientX, y0:ev.clientY, movido:false};
    };
    g.onpointermove = ev=>{
      if(!arrastre || arrastre.tipo!=="bolson" || arrastre.id!==id) return;
      if(Math.abs(ev.clientX-arrastre.x0)+Math.abs(ev.clientY-arrastre.y0) > 8){ arrastre.movido = true; g.classList.add("arrastrando"); }
    };
    g.onpointerup = ()=>{
      const arr = arrastre;
      if(arr && arr.tipo==="maquina"){ soltarMaquina(arr.estado, id); arrastre=null; return; }
      g.classList.remove("arrastrando");
      if(arr && arr.tipo==="bolson" && arr.movido){ arrastre=null; return; }
      arrastre = null;
      if(maqArmada){ const m=maqArmada; maqArmada=null; soltarMaquina(m, id); return; }
      if(selMapa===id){ selMapa=null; accionesBolson(id); return; }
      selMapa = id; render();
    };
  });
  svg.querySelectorAll("rect.hueco").forEach(r=>{
    r.style.pointerEvents = "all";
    r.onpointerup = ()=>{
      if(arrastre && arrastre.tipo==="bolson" && arrastre.movido){
        const id = arrastre.id; arrastre=null; moverBolson(id, r.dataset.fila, +r.dataset.pos); return; }
      if(selMapa){ const id=selMapa; selMapa=null; moverBolson(id, r.dataset.fila, +r.dataset.pos); }
    };
    r.onpointerenter = ()=>{ if(arrastre&&arrastre.tipo==="bolson"&&arrastre.movido) r.setAttribute("fill","rgba(43,111,214,.18)"); };
    r.onpointerleave = ()=>{ r.setAttribute("fill","transparent"); };
  });
  svg.onpointerup = ()=>{ if(arrastre&&arrastre.tipo==="maquina") arrastre=null; };
}
function soltarMaquina(estado, id){
  maqArmada = null;
  if(estado==="quitar") desengancharMaquina(id); else engancharMaquina(id, estado);
}

      ${b.estado==="armando" ? `

      : `

      <div class="mini"><div class="t">Días restantes</div><div class="v mono">${diasRest(b)===null?SD:f(diasRest(b),0)}</div><div class="u">al ritmo actual</div></div>`}

    </div></div>`;

  h += `<div class="card"><h2>Armado</h2>
    <p class="hint">Lo que se sepa de cuándo se hizo el bolsón. Si los kilos declarados están cargados y el bolsón
