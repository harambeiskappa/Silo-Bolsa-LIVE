    <div class="frow">
      <div><span class="lbl">Fecha de armado</span><input type="date" data-arm="armado_fecha" value="${b.armado.fecha||""}" ${dis}></div>
      <div><span class="lbl">Metros iniciales</span><input class="mono" type="number" step="0.5" data-arm="armado_metros_iniciales" placeholder="s/d" value="${b.armado.metros_iniciales===null?"":b.armado.metros_iniciales}" style="width:110px" ${dis}></div>
      <div><span class="lbl">Kg declarados</span><input class="mono" type="number" step="10" data-arm="armado_kg_declarados" placeholder="s/d" value="${b.armado.kg_declarados===null?"":b.armado.kg_declarados}" style="width:120px" ${dis}></div>
      <div><span class="lbl">Origen</span><input data-arm="armado_origen" placeholder="lote, campo" value="${esc(b.armado.origen)}" ${dis}></div>
      <div><span class="lbl">Responsable</span><input data-arm="armado_responsable" value="${esc(b.armado.responsable)}" ${dis}></div>
      <div><span class="lbl">Estado</span><select data-arm="estado" ${dis}>${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}"${b.estado===k?" selected":""}>${v}</option>`).join("")}</select></div>
      <div style="flex:1;min-width:160px"><span class="lbl">Nota</span><input data-arm="nota" value="${esc(b.nota)}" style="width:100%" ${dis}></div>
    </div></div>`;

  // curva (fase 1)
  h += `<div class="card"><h2>Metros en el tiempo</h2>`;
  if(ms.length<2){
    h += `<p class="hint" style="margin:0">Hay ${ms.length} medición(es) válida(s). La curva aparece a partir de la segunda.</p>`;
  } else {
    const W=640,H=190,P=38;
    const t0=new Date(ms[0].fecha).getTime(), t1=new Date(ms[ms.length-1].fecha).getTime();
    const vals=ms.map(m=>n(m.metros_restantes));
    const vmax=Math.max(...vals, n(b.armado.metros_iniciales)||0), vmin=0;
    const X=t=>P+((t-t0)/((t1-t0)||1))*(W-P-16);
    const Y=v=>H-26-((v-vmin)/((vmax-vmin)||1))*(H-26-14);
    const pts=ms.map(m=>`${X(new Date(m.fecha).getTime()).toFixed(1)},${Y(n(m.metros_restantes)).toFixed(1)}`).join(" ");
    let g=`<line x1="${P}" y1="${H-26}" x2="${W-16}" y2="${H-26}" stroke="#dfe4ec"/>
           <line x1="${P}" y1="14" x2="${P}" y2="${H-26}" stroke="#dfe4ec"/>
           <text x="4" y="18" font-size="10.5" fill="#8a93a3">${f(vmax,0)} m</text>
           <text x="4" y="${H-22}" font-size="10.5" fill="#8a93a3">0</text>
           <polyline points="${pts}" fill="none" stroke="${a.color}" stroke-width="2.5"/>`;
    ms.forEach(m=>{
      const x=X(new Date(m.fecha).getTime()), y=Y(n(m.metros_restantes));
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${m.revision_marca==="diferencia_medicion"?"#d97706":a.color}"><title>${dmy(m.fecha)}: ${f(m.metros_restantes,1)} m${m.revision_marca?" · diferencia de medición":""}</title></circle>`;
    });
    g+=`<text x="${P}" y="${H-8}" font-size="10.5" fill="#8a93a3">${dmy(ms[0].fecha)}</text>
        <text x="${W-16}" y="${H-8}" font-size="10.5" fill="#8a93a3" text-anchor="end">${dmy(ms[ms.length-1].fecha)}</text>`;
    h += `<svg class="map" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  }
  h += `</div>`;

  // mediciones: todas, también las anuladas
  const todas = D.mediciones.filter(m=>m.bolson_id===b.id)
    .sort((x,y)=>x.fecha.localeCompare(y.fecha)||String(x.cargado_en).localeCompare(String(y.cargado_en)));
  const usadas = new Set(ms.map(m=>m.id));
  h += `<div class="card"><h2>Mediciones</h2>
    <p class="hint">Todas, también las anuladas: nada se borra. Corregir una medición la anula y carga otra que la reemplaza, con motivo.
    ${esAuditor()?"Como auditor podés cargar una re-medición: <b>no reemplaza</b> a la original, la decisión es de Iñaki.":""}</p>
    ${(esAuditor()||ad)?`<div class="bar"><button id="btnRemedir">${esAuditor()?"Cargar re-medición de auditoría":"Cargar medición de auditoría"}</button></div>`:""}`;
  if(!todas.length) h += `<p class="hint" style="margin:0">Sin mediciones cargadas.</p>`;
  else {
    h += `<table class="resp"><thead><tr><th>Fecha</th><th class="r">Metros</th><th>Origen</th><th>Etiqueta en la hoja</th>
      <th>Medido · cargado</th><th></th></tr></thead><tbody>`;
    todas.forEach(m=>{
      const lote = D.importaciones.find(l=>l.id===m.importacion_id);
      h += `<tr class="${m.anulada?"anulada":""}"><td data-l="Fecha">${dmy(m.fecha)}</td>
        <td data-l="Metros" class="r mono">${f(m.metros_restantes,1)}</td>
        <td data-l="Origen"><span class="chip${m.origen==="auditoria"?" aud":""}">${esc(ORIGEN_MED[m.origen]||m.origen)}</span>
          ${m.revision_marca==="diferencia_medicion"?` <span class="chip dif">dif. medición</span>`:m.revision_marca==="dentro_resolucion"?` <span class="chip">en la resolución</span>`:""}${m.lectura==="dudosa"?` <span class="chip pen">dudosa</span>`:""}
          ${usadas.has(m.id)?"":(!m.anulada?` <span class="src">no se usa: hay otra válida esa fecha</span>`:"")}
          ${m._pendiente?` <span class="chip pen">sin guardar</span>`:""}</td>
        <td data-l="En la hoja">${m.etiqueta_planilla?esc(m.etiqueta_planilla)+(m.orden_planilla!=null?` (${m.orden_planilla}.º)`:""):SD}</td>
        <td data-l="Quién">${esc(m.medido_por)||SD} · ${esc(nombreUsuario(m.cargado_por))} ${esc(dmyh(m.cargado_en))}${lote?` · <a href="#" data-lote="${esc(lote.id)}">lote</a>`:""}</td>
        <td class="r">${ad && !m.anulada && !m._pendiente?`<button data-corr="${esc(m.id)}" style="min-height:44px;padding:3px 9px">Corregir</button>
          <button class="d" data-anul="${esc(m.id)}" style="min-height:44px;padding:3px 9px">Anular</button>`:""}</td></tr>`;
      if(m.anulada || m.reemplaza_a || m.revision_nota || m.nota)
        h += `<tr class="${m.anulada?"anulada":""}"><td colspan="6" class="nota-anul src" data-l="">
          ${m.anulada?`Anulada${m.anulada_por?" por "+esc(nombreUsuario(m.anulada_por)):""}${m.anulada_en?" el "+esc(dmyh(m.anulada_en)):""}: «${esc(m.anulada_motivo)}». `:""}
          ${m.reemplaza_a?`Reemplaza a otra medición. Motivo: «${esc(m.motivo)}». `:""}
          ${m.revision_nota?esc(m.revision_nota)+" ":""}${m.nota?"Nota: «"+esc(m.nota)+"»":""}</td></tr>`;
    });
    h += `</tbody></table>`;
  }
  h += `</div>`;

  // auditoría: las dos mediciones juntas y la diferencia
  const aud = todas.filter(m=>m.origen==="auditoria" && !m.anulada);
  if(aud.length){
    h += `<div class="card"><h2>Re-mediciones de auditoría</h2>
      <p class="hint">La de auditoría no reemplaza a la original. Si las dos siguen válidas, para los cálculos manda la
      original. Decide Iñaki: anulando una de las dos con motivo.</p>
      <table class="resp"><thead><tr><th>Fecha</th><th class="r">Original</th><th class="r">Auditoría</th>
        <th class="r">Diferencia</th><th class="r">En kg</th><th>Quién</th></tr></thead><tbody>`;
    aud.forEach(m=>{
      const o = D.mediciones.filter(x=>x.bolson_id===b.id && x.fecha===m.fecha && x.origen!=="auditoria" && !x.anulada)[0];
      const d = o ? n(m.metros_restantes)-n(o.metros_restantes) : null;
      h += `<tr><td data-l="Fecha">${dmy(m.fecha)}</td><td data-l="Original" class="r mono">${o?f(o.metros_restantes,1)+" m":SD}</td>
        <td data-l="Auditoría" class="r mono">${f(m.metros_restantes,1)} m</td>
        <td data-l="Diferencia" class="r mono"><b>${d===null?SD:fDelta(d)}</b></td>
        <td data-l="En kg" class="r mono">${d===null||!a.kg_por_metro?SD:(d>0?"+":"")+f(d*a.kg_por_metro)+" kg"}</td>
        <td data-l="Quién">${esc(m.medido_por||nombreUsuario(m.cargado_por))}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }

  // eventos
  const evs = D.eventos.filter(e=>e.bolson_id===b.id).sort((x,y)=>x.fecha.localeCompare(y.fecha)||String(x.cargado_en).localeCompare(String(y.cargado_en)));
  h += `<div class="card"><h2>Eventos</h2>
    ${ad?`<div class="frow">
      <div><span class="lbl">Fecha</span><input type="date" id="evFecha" value="${hoy()}"></div>
      <div><span class="lbl">Tipo</span><select id="evTipo">${Object.entries(TIPOS_EV).filter(([k])=>!["alta","renumeracion"].includes(k)).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
      <div style="flex:1;min-width:150px"><span class="lbl">Detalle</span><input id="evDet" placeholder="qué pasó" style="width:100%"></div>
      <div><button id="btnEv">Agregar</button></div>
    </div>`:""}`;
  if(!evs.length) h += `<p class="hint" style="margin:0">Sin eventos.</p>`;
  else {
    h += `<table class="resp"><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Cargó</th><th></th></tr></thead><tbody>`;
    evs.forEach(e=>{
      h += `<tr class="${e.anulado?"anulada":""}"><td data-l="Fecha">${dmy(e.fecha)}</td><td data-l="Tipo">${esc(TIPOS_EV[e.tipo]||e.tipo)}</td>
        <td data-l="Detalle">${esc(e.detalle)}${e.anulado?` <span class="src">(anulado: «${esc(e.anulado_motivo)}»)</span>`:""}</td>
        <td data-l="Cargó">${esc(nombreUsuario(e.cargado_por))}</td>
        <td class="r">${ad && !e.anulado && !e._pendiente?`<button class="d" data-anulev="${esc(e.id)}" style="min-height:44px;padding:3px 9px">Anular</button>`:""}</td></tr>`;
    });
    h += `</tbody></table>`;
  }
  h += `</div>`;

  // registro de cambios de la base
  const cf = cambiosFicha.id===b.id ? cambiosFicha : null;
  h += `<div class="card"><details class="hist" id="detCambios" ${cf&&cf.abierto?"open":""}><summary>Registro de cambios en la base</summary>
    <p class="hint" style="margin:8px 0">Toda alta, edición y anulación de este bolsón, sus mediciones y eventos, con antes, después, quién y cuándo.</p>`;
  if(cf && cf.cargando) h += `<p class="hint">Leyendo…</p>`;
  else if(cf && cf.error) h += `<p class="hint">${esc(cf.error)}</p>`;
  else if(cf && cf.filas){
    h += `<div style="overflow-x:auto"><table><thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Cambió</th></tr></thead><tbody>`;
    cf.filas.forEach(c=>{
      const antes=c.antes||{}, desp=c.despues||{};
      const campos = c.operacion==="UPDATE" ? Object.keys(desp).filter(k=>JSON.stringify(antes[k])!==JSON.stringify(desp[k]) && !["actualizado_en","actualizado_por"].includes(k)) : [];
      h += `<tr><td class="mono" style="white-space:nowrap">${esc(dmyh(c.en))}</td><td>${esc(nombreUsuario(c.usuario))}</td>
        <td>${esc({INSERT:"alta",UPDATE:"edición",DELETE:"baja"}[c.operacion]||c.operacion)} · ${esc(c.tabla)}</td>
        <td class="src">${c.operacion==="INSERT" ? esc(c.tabla==="mediciones"?`${desp.metros_restantes} m del ${dmy(desp.fecha)}`:c.tabla==="eventos"?desp.detalle:"alta del bolsón "+(desp.etiqueta||""))
          : campos.map(k=>`${esc(k)}: ${esc(JSON.stringify(antes[k]))} → ${esc(JSON.stringify(desp[k]))}`).join("<br>")}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  h += `</details></div>`;
  return h;
}
async function leerCambios(id){
  cambiosFicha = {id, filas:null, cargando:true, abierto:true}; render();
  try{ cambiosFicha.filas = await rpc("cambios_de_bolson", {p_id:id}); }
  catch(e){ cambiosFicha.error = e.red ? "Sin conexión: el registro se lee de la base." : e.message; }
  cambiosFicha.cargando = false; render();
}
function modalCorregir(m){
  abrirModal({titulo:`Corregir la medición del ${dmy(m.fecha)}`,
    texto:`Ahora dice <b>${f(m.metros_restantes,1)} m</b>. La original queda anulada (no se borra) y la nueva la reemplaza.`,
    ok:"Corregir",
    campos:[{clave:"metros", etiqueta:"Metros correctos", valor:"", placeholder:"ej. 64,5", tipo:"text"},
            {clave:"motivo", etiqueta:"Motivo (una línea)", valor:"", placeholder:"ej. mal tipeado al cargar"}],
    validar:v=>{ const x=numeroDe(v.metros); if(x===null||x===undefined) return "Poné los metros (un número).";
                 if(x===0 && (bol(m.bolson_id)||{}).estado!=="terminado") return "Un 0 solo vale en un bolsón terminado.";
                 if(!String(v.motivo||"").trim()) return "Hace falta el motivo."; return null; },
    onOk:v=>{ cerrarModal(); encolar({fn:"corregir_medicion", desc:`Corregir ${et(bol(m.bolson_id))} del ${dmy(m.fecha)}`,
      args:{p_id:m.id, p_metros:numeroDe(v.metros), p_motivo:v.motivo.trim(), p_nuevo_id:uuid()}}); }});
}
function modalAnular(tabla, fila, titulo){
  abrirModal({titulo, peligro:true, ok:"Anular",
    texto:`No se borra: queda tachada, con el motivo, quién y cuándo. Deja de contar en los cálculos.`,
    campos:[{clave:"motivo", etiqueta:"Motivo (una línea)", valor:"", placeholder:"ej. vale la re-medición de Nico"}],
    validar:v=>String(v.motivo||"").trim()?null:"Hace falta el motivo.",
    onOk:v=>{ cerrarModal(); encolar({fn:"anular", desc:titulo, args:{p_tabla:tabla, p_id:fila.id, p_motivo:v.motivo.trim()}}); }});
}
function modalRemedir(b){
  abrirModal({titulo:`Re-medición de auditoría — ${et(b)}`,
    texto:`Se carga como medición de origen <b>auditoría</b>. No reemplaza a la original: la ficha muestra las dos y la diferencia.`,
    ok:"Cargar",
    campos:[{clave:"fecha", etiqueta:"Fecha", valor:(ultimaMed(b.id)||{}).fecha||hoy(), tipo:"date"},
            {clave:"metros", etiqueta:"Metros que quedan", valor:"", placeholder:"ej. 66,5"},
            {clave:"nota", etiqueta:"Nota", valor:"", placeholder:"opcional"}],
    validar:v=>{ const x=numeroDe(v.metros); if(x===null||x===undefined) return "Poné los metros.";
                 if(x===0 && b.estado!=="terminado") return "Un 0 solo vale en un bolsón terminado."; if(!v.fecha) return "Poné la fecha."; return null; },
    onOk:v=>{ cerrarModal(); encolar({fn:"medicion_auditoria", desc:`Re-medición de ${et(b)}`,
      args:{p_id:uuid(), p_bolson:b.id, p_fecha:v.fecha, p_metros:numeroDe(v.metros), p_nota:v.nota||""}}); }});
}
function modalRenumerar(b){
  abrirModal({titulo:`Cambiar la etiqueta de ${et(b)}`,
    texto:`La historia sigue entera: el bolsón es el mismo (su id interno no cambia). Queda un evento de renumeración.`,
    ok:"Cambiar", campos:[{clave:"etiqueta", etiqueta:"Etiqueta nueva", valor:"", placeholder:"ej. MG40"},
                          {clave:"motivo", etiqueta:"Por qué (opcional)", valor:"", placeholder:"ej. se pintó el número"}],
    validar:v=>String(v.etiqueta||"").trim()?null:"Poné la etiqueta.",
    onOk:v=>{ cerrarModal(); editarBolson(b, {etiqueta:v.etiqueta.trim(), motivo_etiqueta:v.motivo||""}, `Etiqueta ${et(b)} → ${v.etiqueta.trim()}`); }});
}

/* ══════════════════ PANTALLA: AUDITORÍA ══════════════════════════════
   Arriba, un número: cuántos lotes faltan auditar. Abajo, la bandeja. Un
   lote se abre, se ve lo que entró y lo que la revisión marcó en su
   momento, y se marca ok u observado con comentario. */
const EST_AUD = { pendiente:["pen","pendiente"], ok:["ok","ok"], observada:["obs","observado"], no_aplica:["","no aplica"] };
function vAuditoria(){
  const lotes = [...lotesAuditables()].sort((a,b)=>String(b.fecha_medicion).localeCompare(String(a.fecha_medicion))||String(b.cargado_en).localeCompare(String(a.cargado_en)));
  const pend = pendientesAuditar().length;
  if(auditLote){ const l = D.importaciones.find(x=>x.id===auditLote); if(l) return vLote(l); auditLote=null; }
  let h = `<div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="grande mono">${pend}</div>
    <div><b>lote${pend===1?"":"s"} pendiente${pend===1?"":"s"} de auditar</b>
    <p class="hint" style="margin:2px 0 0">Cada planilla o carga confirmada es un lote. ${esAuditor()
      ?"Abrí uno, mirá lo que entró y marcalo ok u observado. Si querés re-medir un bolsón, cargalo desde su ficha."
      :"Los audita el auditor (Nico). Un lote observado le aparece a Iñaki con el comentario."}</p></div></div>`;
  if(!lotes.length) return h + `<div class="card"><p class="hint" style="margin:0">Todavía no hay lotes cargados.</p></div>`;
  h += `<div class="card"><h2>Bandeja</h2><table class="resp"><thead><tr><th>Medición</th><th>Lote</th><th>Cargó</th>
    <th class="r">Mediciones</th><th>Marcas de la revisión</th><th>Auditoría</th></tr></thead><tbody>`;
  lotes.forEach(l=>{
    const r = l.resumen||{}, e = EST_AUD[l.estado_auditoria]||["",l.estado_auditoria];
    const marcas = [r.diferencias?`${r.diferencias} dif. de medición`:"", r.dentro_resolucion?`${r.dentro_resolucion} dentro de la resolución`:"", r.dudosas?`${r.dudosas} dudosa(s)`:"",
                    r.reemplazos?`${r.reemplazos} reemplazo(s)`:"", r.nuevos?`${r.nuevos} nuevo(s)`:""].filter(Boolean).join(" · ");
    h += `<tr class="cl" data-lote="${esc(l.id)}"><td data-l="Medición"><b>${dmy(l.fecha_medicion)}</b></td>
      <td data-l="Lote">${esc(l.tipo==="manual"?"carga a mano":(l.archivo||"planilla"))}${l._pendiente?' <span class="chip pen">sin guardar</span>':""}</td>
      <td data-l="Cargó">${esc(nombreUsuario(l.cargado_por))} · ${esc(dmyh(l.cargado_en))}</td>
      <td data-l="Mediciones" class="r mono">${f(r.mediciones)}</td>
      <td data-l="Marcas">${marcas||'<span class="src">ninguna</span>'}</td>
      <td data-l="Auditoría"><span class="chip ${e[0]}">${esc(e[1])}</span></td></tr>`;
  });
  return h + `</tbody></table></div>`;
}
function vLote(l){
  const r = l.resumen||{}, e = EST_AUD[l.estado_auditoria]||["",l.estado_auditoria];
  const meds = D.mediciones.filter(m=>m.importacion_id===l.id)
    .sort((a,b)=>(a.orden_planilla??999)-(b.orden_planilla??999) || String(a.etiqueta_planilla).localeCompare(String(b.etiqueta_planilla)));
  const auds = D.auditorias.filter(a=>a.importacion_id===l.id || meds.some(m=>m.id===a.medicion_id))
    .sort((a,b)=>String(a.en).localeCompare(String(b.en)));
  const cal = D.calidad.filter(c=>c.importacion_id===l.id);
  let h = `<div class="bar"><button id="volverBandeja">← Bandeja</button></div>
    <div class="card"><h2>Lote del ${dmy(l.fecha_medicion)} <span class="chip ${e[0]}">${esc(e[1])}</span></h2>
    <p class="hint">${esc(l.tipo==="manual"?"Carga a mano":(l.archivo||"Planilla"))} · medido por ${esc(l.medido_por)||SD} ·
      cargado por ${esc(nombreUsuario(l.cargado_por))} el ${esc(dmyh(l.cargado_en))}.</p>
    <div class="miniblock">
      <div class="mini"><div class="t">Mediciones</div><div class="v mono">${f(r.mediciones)}</div></div>
      <div class="mini"><div class="t">Vinculadas</div><div class="v mono">${f(r.vinculados)}</div></div>
      <div class="mini"><div class="t">Nuevos</div><div class="v mono">${f(r.nuevos)}</div></div>
      <div class="mini"><div class="t">Dif. medición</div><div class="v mono">${f(r.diferencias)}</div><div class="u">subió más de ${fNum(TOL_CERRADO_M)} m</div></div>
      <div class="mini"><div class="t">En la resolución</div><div class="v mono">${f(r.dentro_resolucion??0)}</div><div class="u">subió hasta ${fNum(TOL_CERRADO_M)} m</div></div>
      ${Object.entries(r.totales||{}).map(([k,t])=>`<div class="mini"><div class="t">${esc((D.alimentos[k]||{}).nombre||k)}</div>
        <div class="v mono">${f(t.m,1)} m</div><div class="u">${t.n} bolsones</div></div>`).join("")}
    </div></div>`;

  if(esAuditor()){
    h += `<div class="card"><h2>Auditar este lote</h2>
      <div class="frow">
        <div><span class="lbl">Resultado</span><select id="audRes"><option value="ok">ok</option><option value="observada">observado</option></select></div>
        <div style="flex:1;min-width:200px"><span class="lbl">Comentario (obligatorio si se observa)</span>
          <input id="audCom" style="width:100%" placeholder="qué viste"></div>
        <div><button class="p" id="btnAuditar">Guardar auditoría</button></div>
      </div><div id="audErr" class="hint" style="color:#a33;margin:0"></div></div>`;
  }
  if(auds.length){
    h += `<div class="card"><h2>Auditorías</h2>`;
    auds.forEach(a=>{

/* Lo que el proyecto de Supabase dice de su configuración de Auth (es
   público: /auth/v1/settings). Si el alta está abierta o el mail no se
   confirma, el admin lo ve acá en rojo. */
let authCfg = null, authCfgPedida = false;
function vAvisoAuth(){
  if(!authCfgPedida){ authCfgPedida = true;
    sbFetch("/auth/v1/settings", {sinToken:true}, false).then(j=>{ authCfg = j; render(); }).catch(()=>{ authCfg = {error:true}; render(); }); }
  if(!authCfg) return "";
  if(authCfg.error) return `<p class="hint">No pude leer la configuración de Auth del proyecto.</p>`;
  const av = [];
  if(authCfg.disable_signup===false) av.push(`<b>El alta de usuarios está abierta.</b> Cualquiera puede crearse una cuenta con la clave
    pública. Apagala: Authentication → Sign In / Providers → Email → «Allow new users to sign up» en off.`);
  if(authCfg.mailer_autoconfirm===true) av.push(`<b>«Confirm email» está apagado</b>: las cuentas nuevas nacen con el mail confirmado sin
    que nadie lo confirme. Prendelo en Authentication → Sign In / Providers → Email.`);
  return av.length ? `<div class="alert e" id="avisoAuth" style="margin:10px 0 0">⚠ ${av.join("<br>⚠ ")}</div>`
                   : `<p class="hint" id="avisoAuth" style="margin:10px 0 0;color:#1c6b3a">Auth del proyecto: alta de usuarios apagada y confirmación de mail activa.</p>`;
}

/* ── respaldo ──────────────────────────────────────────────────────── */
const TABLAS_RESPALDO = ["parametros","importaciones","relevamientos","relevamiento_items","bolsones",
                         "mediciones","eventos","calidad","auditorias"];
async function exportarRespaldo(){
  try{
    const t = {};
    for(const x of TABLAS_RESPALDO) t[x] = await leerTodo(x, x==="parametros"?"clave":"id");
    t.perfiles = (await leerTodo("perfiles","id")).map(p=>({id:p.id, email:p.email, nombre:p.nombre, rol:p.rol}));
    t.cambios = await leerTodo("cambios","id");
    const j = {formato:"silobolsa-respaldo", version:1, exportado_en:new Date().toISOString(),
               exportado_por:yo.email, base:SB_URL, tablas:t};
    bajar(JSON.stringify(j,null,1), "silobolsa_respaldo_"+hoy()+".json", "application/json");
    mostrarAviso(`Respaldo exportado desde la base: ${t.bolsones.length} bolsones, ${t.mediciones.length} mediciones, ${t.cambios.length} cambios.`);
  }catch(e){
    abrirModal({titulo:"No se pudo exportar", soloOk:true, ok:"Entendido", onOk:cerrarModal,
      texto: e.red ? "El respaldo se lee de la base y no hay conexión. Probá cuando vuelva la red." : esc(e.message)});
  }
}
function importarJson(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(j.formato==="silobolsa-respaldo"){ prepararRestauracion(j, file.name); return; }
      if((j.bolsones && j.mediciones) || j.sesiones){ prepararRelevamiento(j, file.name); return; }
      throw new Error("No reconozco el formato: no es un respaldo de esta app ni un JSON de la versión anterior.");
    }catch(err){ abrirModal({titulo:"No se pudo leer el JSON", soloOk:true, ok:"Entendido",
      texto:`Lo que encontré: <b>${esc(err.message)}</b>.<br><br>Si lo que querés subir es la planilla de mediciones, va por la pestaña Carga.`,
      onOk:cerrarModal}); }
  };
  r.readAsText(file); e.target.value="";
}
function prepararRestauracion(j, archivo){
  const res = {};
  TABLAS_RESPALDO.forEach(t=>{
    const filas = (j.tablas&&j.tablas[t])||[], k = t==="parametros"?"clave":"id";
    const local = t==="parametros" ? Object.keys(D.parametrosFila) : (D[t]||[]).map(x=>x.id);
    const ya = new Set(local);
    res[t] = {total:filas.length, existen:filas.filter(x=>ya.has(x[k])).length};
  });
  restauracion = {j, archivo, res, resultado:null};
  vista = "restaurar"; render();
}
function vRestaurar(){
  const R = restauracion; if(!R){ vista="param"; return vParam(); }
  let h = `<div class="bar"><button id="volverParam">← Ajustes</button></div><div class="card"><h2>Restaurar un respaldo</h2>
    <p class="hint"><b>${esc(R.archivo)}</b> · exportado el ${esc(dmyh(R.j.exportado_en))} por ${esc(R.j.exportado_por||"s/d")}
    desde ${esc(R.j.base||"s/d")}.</p>
    <div class="alert w"><b>Qué se pisa: nada.</b> Cada fila del respaldo se agrega solo si no existe en esta base.
    Si ya existe una con el mismo id, no se toca: si es idéntica cuenta como «igual», si difiere como «distinta» y se informa.
    Los usuarios no se restauran (son de cada proyecto) y el registro de cambios de la base nueva anota la restauración.</p>
    <table class="resp"><thead><tr><th>Tabla</th><th class="r">En el respaldo</th><th class="r">Ya están en esta base</th>
    ${R.resultado?`<th class="r">Insertadas</th><th class="r">Iguales</th><th class="r">Distintas</th>`:""}</tr></thead><tbody>
    ${TABLAS_RESPALDO.map(t=>`<tr><td data-l="Tabla">${t}</td><td data-l="Respaldo" class="r mono">${R.res[t].total}</td>
      <td data-l="Ya están" class="r mono">${R.res[t].existen}</td>
      ${R.resultado?`<td data-l="Insertadas" class="r mono">${R.resultado[t].insertadas}</td><td data-l="Iguales" class="r mono">${R.resultado[t].iguales}</td>
        <td data-l="Distintas" class="r mono" style="color:${R.resultado[t].distintas?"#a33":"inherit"}">${R.resultado[t].distintas}</td>`:""}</tr>`).join("")}
    </tbody></table>
    ${R.resultado?`<p class="hint" style="margin:10px 0 0">Listo.</p>`:`<div class="sticky-save"><button class="p" id="btnRestaurar">Restaurar (agregar lo que falta)</button></div>`}</div>`;
  return h;

async function hacerRestauracion(){
  try{
    restauracion.resultado = await rpc("restaurar_respaldo", {p:{tablas:restauracion.j.tablas}});
    await recargar();
  }catch(e){ abrirModal({titulo:"No se restauró", soloOk:true, ok:"Entendido", onOk:cerrarModal,
    texto: e.red?"Restaurar necesita conexión con la base.":esc(e.message)}); }

}

/* ── relevamiento histórico ────────────────────────────────────────── */
function convertirViejo(j){
  // formato de sesiones (libreta del 31/7) → bolsones + mediciones
  const bolsones=[], mediciones=[], vistos={};
  (j.sesiones||[]).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(s=>{
    (s.bolsones||[]).forEach((b,i)=>{
      if(!vistos[b.id]){ vistos[b.id]=true;
        bolsones.push({ id:b.id, grupo:b.grupo||"", alimento:b.tipo, estado:b.estado||"cerrado", nota:b.nota||"",
                        ubicacion:{sector:"Playa", fila:b.pasada||"A", posicion:i+1}, armado:{} }); }
      if(n(b.metros)!==null) mediciones.push({bolson_id:b.id, fecha:s.fecha, metros_restantes:n(b.metros), nota:""});
    });
  });
  return {bolsones, mediciones, eventos:[], meta:j.meta||{}};
}
/* JSON con las claves en cualquier orden → texto comparable */
function canon(x){
  if(Array.isArray(x)) return "["+x.map(canon).join(",")+"]";
  if(x && typeof x==="object") return "{"+Object.keys(x).sort().map(k=>JSON.stringify(k)+":"+canon(x[k])).join(",")+"}";
  return JSON.stringify(x===undefined?null:x);
}
/* Coeficientes de un archivo sobre los de la base. Entiende el formato de la
   libreta vieja (calidad "MEDIDO", kg_por_metro_origen, ms_pct_origen). */
function mezclarAlimentos(base, archivo){
  const CALV = { MEDIDO:"med", ESTIMADO:"est", "SIN VALIDAR":"sv" };
  const out = clonar(base||{});
  Object.entries(archivo||{}).forEach(([k,v])=>{
    const x = Object.assign({}, v);
    if(CALV[x.calidad]) x.calidad = CALV[x.calidad];
    if(x.kg_por_metro_origen!==undefined){ if(!x.origen_kgm) x.origen_kgm = x.kg_por_metro_origen; delete x.kg_por_metro_origen; }
    if(x.ms_pct_origen!==undefined){ if(!x.origen_ms) x.origen_ms = x.ms_pct_origen; delete x.ms_pct_origen; }
    out[k] = Object.assign({}, out[k]||{}, x);
  });
  return out;
}
/* La última hoja conocida de un alimento (relevamiento o lote anterior a la
   fecha del archivo) tiene exactamente las mismas etiquetas: es un indicio,
   no una prueba. Se avisa; no se tilda solo. */
function numeracionCoincide(k, g){
  const et = xs => [...new Set(xs)].sort((a,b)=>a.localeCompare(b,"es",{numeric:true}));
  const mias = et(g.items.filter(i=>i.alimento===k).map(i=>i.etiqueta));
  if(!mias.length) return null;
  const hojas = [];
  D.relevamientos.filter(r=>r.fecha<g.fecha).forEach(r=>hojas.push({fecha:r.fecha, fuente:"hoja del relevamiento",
    etiquetas:et(D.relevamiento_items.filter(i=>i.relevamiento_id===r.id && i.alimento===k).map(i=>i.etiqueta))}));
  D.importaciones.filter(l=>(l.tipo==="planilla"||l.tipo==="manual") && l.fecha_medicion<g.fecha).forEach(l=>hojas.push({fecha:l.fecha_medicion, fuente:"planilla",
    etiquetas:et(D.mediciones.filter(m=>m.importacion_id===l.id && !m.anulada && (bol(m.bolson_id)||{}).alimento===k).map(m=>m.etiqueta_planilla))}));
  const u = hojas.filter(x=>x.etiquetas.length).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];
  return u && u.etiquetas.join("|")===mias.join("|") ? u : null;
}
function prepararRelevamiento(j, archivo){
  const x = j.sesiones ? convertirViejo(j) : j;
  const fechas = [...new Set((x.mediciones||[]).filter(m=>n(m.metros_restantes)!==null).map(m=>m.fecha))].sort();
  if(!fechas.length) throw new Error("El archivo no trae ninguna medición con fecha.");
  const grupos = fechas.map(fe=>{
    const items = [], porAli = {};
    (x.bolsones||[]).forEach(b=>{
      const ms = (x.mediciones||[]).filter(m=>m.bolson_id===b.id && m.fecha===fe && n(m.metros_restantes)!==null);
      const u = ms[ms.length-1];
      const cuenta = porAli[b.alimento] = (porAli[b.alimento]||0) + 1;
      items.push({ etiqueta:b.id, grupo:b.grupo||"", alimento:b.alimento, metros:u?n(u.metros_restantes):null,
        estado:b.estado||"", nota:[b.nota, u&&u.nota].filter(Boolean).join(" · "), orden:cuenta, _b:b, _m:u||null });
    });
    return {fecha:fe, items, ya:D.relevamientos.some(r=>r.fecha===fe)};
  });
  const ultima = grupos[grupos.length-1];
  const alimentos = {};
  ultima.items.forEach(i=>{ const a = alimentos[i.alimento] = alimentos[i.alimento]||{n:0, m:0, conMed:0, vivo:false};
    a.n++; if(i.metros!==null){ a.m = +(a.m+i.metros).toFixed(2); a.conMed++; } });
  const params = {};
  ["referencia","dieta","alimentos"].forEach(k=>{
    if(!j[k]) return;
    // los coeficientes se MEZCLAN con los de la base, alimento por alimento: un archivo viejo
    // que no trae algún alimento (el del 31/7 no tiene germen ni núcleo) no lo borra
    const valor = k==="alimentos" ? mezclarAlimentos(D.alimentos, j[k]) : j[k];
    const igual = canon(valor)===canon(D[k]);
    // se propone cargarlo si la base sigue con el valor de arranque (nadie lo editó) o si el
    // archivo es más nuevo que todo relevamiento ya cargado
    const fila = D.parametrosFila[k];
    const deArranque = !fila || !fila.actualizado_por;
    const masNuevo = fechas[fechas.length-1] > (D.relevamientos.map(r=>String(r.fecha)).sort().pop() || "");
    params[k] = {valor, igual, deArranque, masNuevo, traer: !igual && (deArranque || masNuevo)};
  });
  relev = { id:uuid(), archivo, grupos:grupos.map(g=>({fecha:g.fecha, ya:g.ya, relevamiento_id:uuid(), importacion_id:uuid(),
            items:g.items.map(i=>({etiqueta:i.etiqueta, grupo:i.grupo, alimento:i.alimento, metros:i.metros, estado:i.estado,
                                   nota:i.nota, orden:i.orden, b:i._b, m:i._m}))})),
            alimentos, params, nota:(x.meta&&x.meta.nota)||"", eventos:x.eventos||[] };
  vista = "relevamiento"; render();
}

function confirmarRelevamiento(){
  const R = relev;
  R.grupos.forEach((g,gi)=>{
    if(g.ya) return;
    const esUlt = gi===R.grupos.length-1;
    const vivos = [];
    if(esUlt) g.items.filter(i=>R.alimentos[i.alimento] && R.alimentos[i.alimento].vivo).forEach(i=>{
      const b = i.b||{}, ar = b.armado||{}, ub = b.ubicacion||{}, id = uuid();
      vivos.push({ bolson:{ id, etiqueta:i.etiqueta, grupo:i.grupo||"", alimento:i.alimento, diametro_pies:b.diametro_pies||9,
          armado_fecha:ar.fecha||null, armado_metros_iniciales:ar.metros_iniciales??null, armado_kg_declarados:ar.kg_declarados??null,
          armado_origen:ar.origen||"", armado_responsable:ar.responsable||"", sector:ub.sector||"Playa", fila:ub.fila||"A",
          posicion:ub.posicion||i.orden, estado:b.estado||"cerrado", fecha_apertura:b.fecha_apertura||null,
          fecha_cierre:b.fecha_cierre||null, nota:b.nota||"" },
        medicion: i.metros===null ? null : {id:uuid(), metros:i.metros, etiqueta_planilla:i.etiqueta, orden_planilla:i.orden, nota:(i.m&&i.m.nota)||""},
        eventos: (R.eventos||[]).filter(e=>e.bolson_id===i.etiqueta).map(e=>({fecha:e.fecha, tipo:e.tipo, detalle:e.detalle})),
        motivo_alta:`Dado de alta desde el relevamiento del ${dmy(g.fecha)} (etiqueta ${i.etiqueta}): ${yo.nombre||yo.email} confirmó que es el mismo bolsón que se mide hoy.` });
    });
    const tot = {};
    g.items.forEach(i=>{ const t = tot[i.alimento] = tot[i.alimento]||{m:0,n:0,medidos:0}; t.n++; if(i.metros!==null){ t.m=+(t.m+i.metros).toFixed(2); t.medidos++; } });
    const parametros = esUlt ? Object.entries(R.params).filter(([k,p])=>p.traer && !p.igual)
      .map(([k,p])=>({clave:k, valor:p.valor, origen:`Del relevamiento del ${dmy(g.fecha)} (${R.archivo}).`})) : [];
    const p = { id:g.importacion_id, relevamiento_id:g.relevamiento_id, archivo:R.archivo, fecha:g.fecha, nota:R.nota,
      items:g.items.map(i=>({etiqueta:i.etiqueta, grupo:i.grupo, alimento:i.alimento, metros:i.metros, estado:i.estado, nota:i.nota, orden:i.orden})),
      vivos, parametros, resumen:{totales:tot, vivos:vivos.length},
      revision: Object.entries(R.alimentos).map(([k,a])=>({alimento:k, vivo:esUlt && !!a.vivo})) };
    encolar({fn:"cargar_relevamiento", args:{p}, desc:`Relevamiento del ${dmy(g.fecha)}: ${p.items.length} tramos${vivos.length?`, ${vivos.length} bolsones vivos`:""}`});
  });
  relev = null; vista = "panel"; render();
}

/* ── escritor mínimo de .xlsx (ZIP sin compresión + CRC32) ─────────── */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0;} return t;})();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=CRCT[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), locals=[], central=[]; let off=0;
  files.forEach(fl=>{
    const nm=enc.encode(fl.name), dt=typeof fl.data==="string"?enc.encode(fl.data):fl.data;
    const c=crc32(dt);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,c,true); lh.setUint32(18,dt.length,true); lh.setUint32(22,dt.length,true);
    lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    locals.push(new Uint8Array(lh.buffer),nm,dt);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,c,true); ch.setUint32(20,dt.length,true); ch.setUint32(24,dt.length,true);
    ch.setUint16(28,nm.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off += 30+nm.length+dt.length;
  });
  const cdSize=central.reduce((s,a)=>s+a.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,off,true);
  const partes=[...locals,...central,new Uint8Array(eo.buffer)];
  const total=partes.reduce((s,a)=>s+a.length,0), out=new Uint8Array(total);

}
function xesc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")

function hojaXml(hoja){
  const filas=hoja.filas, anchos=hoja.anchos||[];
  const col = anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const vista = hoja.congelar
    ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="B2" sqref="B2"/></sheetView></sheetViews>`
    : `<sheetViews><sheetView workbookViewId="0"/></sheetViews>`;
  const rows = filas.map((r,ri)=>{
    const cs = r.map((v,ci)=>{
      const ref = String.fromCharCode(65+ci)+(ri+1);
      const st = ri===0 ? ' s="1"' : (v && v.__inp ? ' s="2"' : '');
      const val = (v && typeof v==="object" && "f" in v) ? null : (v && v.__inp ? v.v : v);
      if(v && typeof v==="object" && "f" in v) return `<c r="${ref}"${st}><f>${xesc(v.f)}</f></c>`;
      if(typeof val==="number" && isFinite(val)) return `<c r="${ref}"${st}><v>${val}</v></c>`;
      if(val==="" || val==null) return `<c r="${ref}"${st}/>`;
      return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`;
    }).join("");
    return `<row r="${ri+1}">${cs}</row>`;
  }).join("");
  const dv = (hoja.listas||[]).map(l=>
    `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${l.rango}">`
    + `<formula1>"${l.opciones}"</formula1></dataValidation>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${vista}<cols>${col}</cols>
<sheetData>${rows}</sheetData>${dv?`<dataValidations count="${(hoja.listas||[]).length}">${dv}</dataValidations>`:""}</worksheet>`;
}

/* ══════════════════ REFERENCIA EXTERNA (portal de Nico) ══════════════
   Valores cargados a mano, con su fecha. La app NO se conecta al portal:
   esto está para contrastar dos caminos independientes, no para depender
   de uno. Cuando cierran, las dos fuentes se refuerzan; cuando no, la
   diferencia misma es la información. */
/* De dónde salió el número del portal que se está mostrando */
function origenReferencia(){
  const pr = D.parametrosFila.referencia;
  if(!pr || !pr.actualizado_por) return "Sin cargar.";
  const cuando = `el ${dmyh(pr.actualizado_en)} por ${esc(nombreUsuario(pr.actualizado_por))}`;
  const o = String(pr.origen||"");
  if(/^Del relevamiento/i.test(o)) return `Cargado ${esc(o.replace(/^Del relevamiento/i,"del relevamiento").replace(/\.$/,""))}, ${cuando}.`;
  return `Cargado a mano ${cuando}.`;
}
function vReferencia(){
  const R = D.referencia;
  if(!R || !Object.values(R.valores||{}).some(v=>v!=null)) return "";
  let filas = "";
  Object.entries(R.valores||{}).forEach(([k,kg])=>{
    const a = D.alimentos[k]; if(!a || kg==null) return;
    const g = vivos().filter(b=>b.alimento===k && metrosAct(b)!==null);
    const nuestro = g.reduce((s,b)=>s+kgAct(b),0);
    const m = g.reduce((s,b)=>s+metrosAct(b),0);
    const dif = nuestro && kg ? (nuestro-kg)/kg*100 : null;
    const implicito = m ? kg/m : null;
    filas += `<tr><td data-l="Alimento"><span class="dot" style="background:${a.color}"></span>
        <b>${esc(a.nombre)}</b></td>
      <td data-l="En bolsones" class="r mono">${g.length?f(nuestro/1000,1):SD}</td>
      <td data-l="Portal" class="r mono">${f(kg/1000,1)}</td>
      <td data-l="Diferencia" class="r mono" style="color:${dif===null?"inherit":Math.abs(dif)<5?"#1c6b3a":"#8a5d00"}">
        ${dif===null?SD:(dif>0?"+":"")+f(dif,1)+"%"}</td>
      <td data-l="kg/m que implica" class="r mono">${implicito===null?SD:f(implicito)}</td>
      <td data-l="Lectura" style="font-size:12px;color:var(--muted)">${
        dif===null ? "sin bolsones medidos de este alimento"
        : ((a.fuera_de_alcance||(ALIMENTOS[k]||{}).fuera_de_alcance) && dif<0) ? `el portal suma también ${esc(a.fuera_de_alcance||ALIMENTOS[k].fuera_de_alcance)}, que esta app deja afuera a propósito: el ${f(-dif,0)} % del stock del portal no está en bolsones. La diferencia es esperable, no un error.`
        : Math.abs(dif)<5 ? "cierra: lo embolsado explica el stock del portal"
        : dif<0 ? "el portal tiene más: hay stock fuera de los bolsones (celdas, silo puente)"
        : "los bolsones dan más que el portal: revisar el coeficiente o la vista SQL"}</td></tr>`;
  });
  return `<div class="card"><h2>Contraste con el portal de Nico</h2>
    <p class="hint">${esc(R.fuente)} · <b>al ${esc(R.fecha||"s/d")}</b>. ${esc(R.nota)}
    ${origenReferencia()}</p>
    <table class="resp"><thead><tr><th>Alimento</th><th class="r">En bolsones</th>
      <th class="r">Portal (tn)</th><th class="r">Diferencia</th><th class="r">kg/m que implica</th>
      <th>Qué dice</th></tr></thead><tbody>${filas}</tbody></table></div>`;
}

function bajar(txt,nombre,tipo){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href);
}
function expCsv(){
  const rows=[["bolson","grupo","alimento","estado","fecha_medicion","metros_restantes","metros_iniciales",
               "kg_declarados","pct_consumido","kg_estimados","kg_ms","medido_por","nota"]];
  recorrido().forEach(b=>{
    const ms=medsDe(b.id), a=ali(b);
    if(!ms.length){ rows.push([et(b),b.grupo||"",a.nombre,ESTADOS[b.estado],"s/d","s/d",
      b.armado.metros_iniciales??"s/d", b.armado.kg_declarados??"s/d","s/d","s/d","s/d","",b.nota||""]); return; }
    ms.forEach(m=>{
      const kg=n(m.metros_restantes)*a.kg_por_metro;
      rows.push([et(b),b.grupo||"",a.nombre,ESTADOS[b.estado],m.fecha,m.metros_restantes,
        b.armado.metros_iniciales??"s/d", b.armado.kg_declarados??"s/d",
        pctConsumido(b)===null?"s/d":Math.round(pctConsumido(b)),
        Math.round(kg), Math.round(kg*a.ms_pct/100), m.medido_por||"", m.nota||""]);
    });
  });
  bajar("﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n"),
        "silobolsa_"+hoy()+".csv","text/csv");
}

async function despuesDeEntrar(){
  pantallaAuth = "cargando"; render();
  try{
    const p = await sbFetch(`/rest/v1/perfiles?select=*&id=eq.${ses.user.id}`);
    yo = p[0] || {id:ses.user.id, email:ses.user.email, rol:"sin_acceso", nombre:""};
    lsSet("silobolsa_perfil", yo);
  }catch(e){
    if(e.red){ const c = lsGet("silobolsa_perfil"); if(c && c.id===ses.user.id) yo = c; }
    else { msgAuth = e.message; pantallaAuth = "login"; render(); return; }
  }
  if(!yo){ msgAuth = "Sin conexión y sin datos guardados en este navegador."; pantallaAuth="login"; render(); return; }
  if(yo.rol==="sin_acceso"){ pantallaAuth = "sin_acceso"; render(); return; }
  pantallaAuth = null;
  cola = (lsGet(K_COLA)||[]);
  const c = lsGet(K_CACHE);
  if(c && c.uid===yo.id){ aplicarTablas(c.t); cacheEn = c.en; }
  recuperarBorrador();
  render();
  await recargar();
  vaciarCola();
}

                   revision:vRevision, relevamiento:vRelevamiento, restaurar:vRestaurar})[vista]();

function cablearAuth(){
  const fl = document.getElementById("formLogin");
  if(fl) fl.onsubmit = async ev=>{
    ev.preventDefault();
    const email = document.getElementById("lgEmail").value.trim(), clave = document.getElementById("lgClave").value;
    if(!email || !clave){ msgAuth="Poné el email y la contraseña."; render(); return; }
    lsSet("silobolsa_ultimo_email", email);
    try{ await entrar(email, clave); msgAuth=""; await despuesDeEntrar(); }
    catch(e){ msgAuth = e.red ? "Sin conexión con la base." : /invalid/i.test(e.message) ? "Email o contraseña incorrectos." : e.message; render(); }
  };
  const bo = document.getElementById("btnOlvide");
  if(bo) bo.onclick = async ()=>{
    const email = (document.getElementById("lgEmail").value||"").trim();
    if(!email){ msgAuth = "Escribí tu email arriba y tocá de nuevo."; render(); return; }
    try{ await sbFetch(`/auth/v1/recover?redirect_to=${encodeURIComponent(location.origin+location.pathname)}`,
                       {method:"POST", body:JSON.stringify({email}), sinToken:true}, false);
         msgAuth = "Si el email tiene cuenta, te llega un link para elegir una contraseña nueva."; }
    catch(e){ msgAuth = e.message; }
    render();
  };
  const bg = document.getElementById("btnGuardarClave");
  if(bg) bg.onclick = async ()=>{
    const a = document.getElementById("nuevaClave").value, b = document.getElementById("nuevaClave2").value;
    if(a.length<8){ msgAuth="Tiene que tener al menos 8 caracteres."; render(); return; }
    if(a!==b){ msgAuth="No coinciden."; render(); return; }
    try{ await sbFetch("/auth/v1/user", {method:"PUT", body:JSON.stringify({password:a})}); msgAuth=""; await despuesDeEntrar(); }
    catch(e){ msgAuth = e.message; render(); }
  };
  const br = document.getElementById("btnReintentar"); if(br) br.onclick = despuesDeEntrar;
  const bs = document.getElementById("btnSalir"); if(bs) bs.onclick = salir;
}

function cablear(){

  document.querySelectorAll("[data-ficha]").forEach(el=>{
    if(el.closest("svg.map") && vista==="mapa") return;

  });

    el.onclick = ev=>{ ev.preventDefault(); auditLote = el.dataset.lote; vista = "auditoria"; render(); };
  });

  document.querySelectorAll("[data-dieta]").forEach(el=>{
    el.onchange = ()=>{ const v = el.value.trim()==="" ? null : numeroDe(el.value); if(v===undefined) return mostrarAviso("Eso no es un porcentaje.");
      guardarDieta(d=>{ if(v===null) delete d.proporciones[el.dataset.dieta]; else d.proporciones[el.dataset.dieta] = v; }); }; });
  document.querySelectorAll("[data-dietakg]").forEach(el=>{
    el.onchange = ()=>{ const k = el.dataset.dietakg;
      if(k==="origen") return guardarDieta(d=>{ d.origen = el.value.trim(); });
      const v = el.value.trim()==="" ? null : numeroDe(el.value); if(v===undefined) return mostrarAviso("Eso no es un número.");
      guardarDieta(d=>{ d[k] = v; }); }; });
  const rfe = document.getElementById("refFecha");
  if(rfe) rfe.onchange = ()=>guardarReferencia(r=>{ r.fecha = rfe.value; });
  document.querySelectorAll("[data-ref]").forEach(el=>{
    el.onchange = ()=>guardarReferencia(r=>{ r.valores[el.dataset.ref] = el.value===""?null:numeroDe(el.value); }); });
  ["btnInforme","btnInforme2"].forEach(id=>on(id, abrirInforme));
  on("btnExp", exportarRespaldo);
  on("btnCsv", expCsv);
  on("btnDatosXls", ()=>bajarBlob(datosXlsx(), "silobolsa_datos_"+hoy()+".xlsx"));
  on("btnImp", ()=>document.getElementById("fImp").click());
  const fi = document.getElementById("fImp"); if(fi) fi.onchange = importarJson;
  document.querySelectorAll("[data-rolde]").forEach(el=>{ el.onchange = ()=>{
    const p = D.perfiles.find(x=>x.id===el.dataset.rolde);
    encolar({fn:"cambiar_rol", desc:`Rol de ${p.email}: ${el.value}`, args:{p_id:p.id, p_rol:el.value, p_nombre:p.nombre||null}}); }; });
  on("btnInvitar", async ()=>{
    const email = document.getElementById("invEmail").value.trim().toLowerCase(), nombre = document.getElementById("invNombre").value.trim(),
          r = document.getElementById("invRol").value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return mostrarAviso("Ese email no parece válido.");
    try{
      await rpc("invitar", {p_email:email, p_nombre:nombre, p_rol:r});
      await recargar();
      abrirModal({titulo:"Rol registrado", soloOk:true, ok:"Entendido", onOk:cerrarModal,
        texto:`${esc(email)} queda autorizado como <b>${esc(r)}</b>. <b>La app no crea la cuenta ni manda mails.</b>
          Ahora creale la cuenta en el panel de Supabase: Authentication → Users → Add user → <b>Create new user</b>,
          con ese mail, una contraseña provisoria y <b>Auto Confirm User</b> tildado. Pasale la contraseña en persona o por
          WhatsApp: entra con su rol y la cambia en Ajustes → Mi cuenta.`});
    }catch(e){ mostrarAviso(e.red?"Invitar necesita conexión.":"No se pudo invitar: "+e.message); }
  });
  on("btnClave", ()=>abrirModal({titulo:"Cambiar mi contraseña", ok:"Cambiar",
    campos:[{clave:"a", etiqueta:"Contraseña nueva (8 o más)", valor:"", tipo:"password"},{clave:"b", etiqueta:"Repetila", valor:"", tipo:"password"}],
    validar:v=>v.a.length<8?"Al menos 8 caracteres.":v.a!==v.b?"No coinciden.":null,
    onOk:async v=>{ try{ await sbFetch("/auth/v1/user",{method:"PUT", body:JSON.stringify({password:v.a})}); cerrarModal(); mostrarAviso("Contraseña cambiada."); }
                    catch(e){ document.getElementById("modalErr").textContent = e.message; } }}));
  // relevamiento y restauración
  document.querySelectorAll("[data-vincular]").forEach(el=>{ el.onclick = ()=>{ const [rid,k] = el.dataset.vincular.split("|"); modalVincular(rid,k); }; });
  on("relCancel", ()=>{ relev=null; vista="param"; render(); });
  on("relOk", confirmarRelevamiento);
  document.querySelectorAll("[data-relvivo]").forEach(el=>{ el.onchange = ()=>{ relev.alimentos[el.dataset.relvivo].vivo = el.checked; render(); }; });
  document.querySelectorAll("[data-relpar]").forEach(el=>{ el.onchange = ()=>{ relev.params[el.dataset.relpar].traer = el.checked; render(); }; });
  on("volverParam", ()=>{ restauracion=null; vista="param"; render(); });
  on("btnRestaurar", hacerRestauracion);

  cablearRevision();
  cablearModal();
  if(vista==="mapa") cablearMapa();
}

function cablearRevision(){
  const op1=document.getElementById("opSubir"), op2=document.getElementById("opMano"),
        fp=document.getElementById("fPlanilla"), vm=document.getElementById("volverModo");
  if(op1) op1.onclick = ()=> fp.click();
  if(fp)  fp.onchange = e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length) importarPlanilla(fs); };
  if(op2) op2.onclick = ()=>{ cargaModo="mano"; render(); };
  if(vm)  vm.onclick  = ()=>{ cargaModo=null; render(); };
  if(!staging) return;
  document.querySelectorAll("[data-rev]").forEach(box=>{
    const fila = staging.filas[+box.dataset.rev];
    const sa=box.querySelector('select[data-rv="aliTxt"]'), se=box.querySelector('select[data-rv="estadoTxt"]'),
          sg=box.querySelector('select[data-rv="asignado"]');
    if(sa) sa.value = fila.alimento || "";
    if(se) se.value = fila.estado || "";
    if(sg) sg.value = fila.asignado || "";
    box.querySelectorAll("[data-rv]").forEach(el=>{
      el.onchange = ()=>{
        const k = el.dataset.rv;
        fila[k] = el.type==="checkbox" ? el.checked : el.value;
        if(k==="asignado"){ fila.tocado = true; fila.confirmado = !!el.value; }
        if(k==="confirmado") fila.tocado = true;      // confirmar es una decisión de Iñaki: no se recalcula encima
        if(k==="aliTxt"||k==="etiqueta"||k==="metrosTxt"||k==="estadoTxt"){ if(!fila.tocado){ fila.asignado=null; } }
        procesarStaging(); render();
      };
    });
  });
  document.querySelectorAll("[data-ms] [data-mv]").forEach(el=>{
    el.onchange = ()=>{ staging.ms[+el.closest("[data-ms]").dataset.ms].importar = el.checked; procesarStaging(); render(); };
  });
  document.querySelectorAll("[data-ms] [data-falt]").forEach(el=>{
    el.onchange = ()=>{ const m = staging.ms[+el.closest("[data-ms]").dataset.ms]; const k = el.dataset.falt;
      m.faltantes = el.checked ? [...new Set(m.faltantes.concat(k))] : m.faltantes.filter(x=>x!==k); procesarStaging(); render(); };
  });
  document.querySelectorAll("[data-falta]").forEach(el=>{
    el.onchange = ()=>{ staging.faltantes[+el.dataset.falta].decision = el.value; procesarStaging(); render(); };
  });
  const bfn = document.getElementById("revFaltNoMed");
  if(bfn) bfn.onclick = ()=>{ staging.faltantes.forEach(x=>{ if(!x.decision) x.decision="no_medido"; }); procesarStaging(); render(); };
  const bca = document.getElementById("revConfAltas");
  if(bca) bca.onclick = ()=>{ staging.filas.forEach(x=>{ if(x.importar && x.propuesta && x.propuesta.conf==="alta" && x.asignado===x.propuesta.id){ x.confirmado=true; x.tocado=true; } });
                              procesarStaging(); render(); };
  const rf=document.getElementById("revFecha"), rq=document.getElementById("revQuien"), rm=document.getElementById("revMotivo");
  if(rf) rf.onchange = ()=>{ staging.fecha = rf.value; staging.fechaVarias = null; procesarStaging(); render(); };
  if(rq) rq.oninput  = ()=>{ staging.quien = rq.value; guardarBorrador(); };
  if(rm){ rm.oninput = ()=>{ staging.motivo = rm.value; guardarBorrador(); }; rm.onchange = ()=>render(); }
  const rc=document.getElementById("revCancel"), ro=document.getElementById("revOk");
  if(rc) rc.onclick = ()=>{ staging=null; vista="carga"; render(); };
  if(ro) ro.onclick = confirmarImport;
}
function cablearModal(){
  const mo=document.getElementById("modalOk"), mc=document.getElementById("modalCancel"), mf=document.getElementById("modalFondo");
  if(mc) mc.onclick = cerrarModal;
  if(mf) mf.onclick = e=>{ if(e.target===mf) cerrarModal(); };
  if(modal && modal.soloOk && mc) mc.style.display="none";
  document.querySelectorAll("[data-ml]").forEach(el=>{ el.onclick = ()=>{ const o=modal.lista[+el.dataset.ml]; cerrarModal(); o.f(); }; });
  document.querySelectorAll("[data-mp]").forEach(el=>{ el.onclick = ()=>{ const o=modal.peligrosas[+el.dataset.mp]; o.f(); }; });
  if(mo) mo.onclick = ()=>{
    const v={}; document.querySelectorAll("[data-mc]").forEach(el=> v[el.dataset.mc]=el.value);
    if(modal.validar){ const err = modal.validar(v); if(err){ document.getElementById("modalErr").textContent = err; return; } }
    modal.onOk(v);
  };
  const aa=document.getElementById("avisoAccion"), ac=document.getElementById("avisoCerrar");
  if(aa) aa.onclick = ()=>{ const fn=aviso.accionFn; aviso=null; fn(); render(); };
  if(ac) ac.onclick = ()=>{ aviso=null; render(); };
}
function bajarBlob(bytes, nombre){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href);
}

/* ══════════════════ MODALES, AVISOS Y DESHACER ═══════════════════════
   Reemplazan a prompt() y confirm(): formularios en la pantalla, con los
   campos a la vista y validación mientras se escribe. */

function abrirModal(cfg){ modal = cfg; render(); }
function cerrarModal(){ modal = null; render(); }
function vModal(){
  if(!modal) return "";
  const campos = (modal.campos||[]).map(c=>`
    <div style="margin-bottom:11px">
      <span class="lbl">${esc(c.etiqueta)}</span>
      ${c.opciones
        ? `<select data-mc="${esc(c.clave)}" style="width:100%">${c.opciones.map(o=>
            `<option value="${esc(o.v)}"${o.v===c.valor?" selected":""}>${esc(o.t)}</option>`).join("")}</select>`
        : `<input data-mc="${esc(c.clave)}" type="${c.tipo||"text"}" value="${esc(c.valor||"")}"
             placeholder="${esc(c.placeholder||"")}" style="width:100%" ${c.paso?`step="${c.paso}"`:""}>`}
      ${c.ayuda?`<div class="hint" style="margin:4px 0 0">${esc(c.ayuda)}</div>`:""}
    </div>`).join("");
  return `<div class="overlay" id="modalFondo"><div class="modal">
      <h2 style="margin:0 0 6px">${esc(modal.titulo)}</h2>
      ${modal.texto?`<p class="hint" style="margin:0 0 13px">${modal.texto}</p>`:""}
      ${campos}
      ${(modal.lista||[]).length ? `<div style="display:grid;gap:7px;margin-bottom:14px">${
        modal.lista.map((o,i)=>`<button class="opcion" data-ml="${i}" style="padding:11px 13px">${esc(o.t)}</button>`).join("")
      }</div>` : ""}
      ${(modal.peligrosas||[]).length ? `<div style="border-top:1px solid var(--line);padding-top:12px;margin-bottom:12px">
        <div class="lbl" style="margin-bottom:7px">Sacar este bolsón</div>
        <div style="display:grid;gap:7px">${modal.peligrosas.map((o,i)=>
          `<button class="opcion" data-mp="${i}" style="padding:10px 13px;${o.grave?"border-color:#f0c4c4":""}">
             <b style="font-size:14px;${o.grave?"color:#a33":""}">${esc(o.t)}</b>
             <span>${esc(o.sub||"")}</span></button>`).join("")}</div></div>` : ""}
      <div id="modalErr" class="hint" style="color:#a33;margin:0 0 10px"></div>
      <div style="display:flex;gap:9px;justify-content:flex-end">
        <button id="modalCancel">Cancelar</button>
        <button class="${modal.peligro?"dg":"p"}" id="modalOk">${esc(modal.ok||"Aceptar")}</button>
      </div></div></div>`;
}
function mostrarAviso(txt, accionTxt, accionFn){
  aviso = {txt, accionTxt, accionFn, id:uid("a")};
  const mio = aviso.id;
  render();
  setTimeout(()=>{ if(aviso && aviso.id===mio){ aviso=null; render(); } }, 9000);
}
function vAviso(){
  if(!aviso) return "";
  return `<div class="toast"><span>${esc(aviso.txt)}</span>
    ${aviso.accionFn?`<button id="avisoAccion">${esc(aviso.accionTxt||"Deshacer")}</button>`:""}
    <button id="avisoCerrar" aria-label="cerrar">×</button></div>`;
}

  b.onclick = ()=>{ vista=b.dataset.p; if(vista==="auditoria") auditLote=null;
    if(vista==="ficha"&&!bol(fichaId)) fichaId=(recorrido()[0]||{}).id; render(); };

(async function iniciar(){
  pantallaAuth = "cargando"; render();
  const h = await leerHash();
  if(h && h.error){ msgAuth = "El link no sirve: " + h.error + ". Pedí otro, o usá «Me olvidé la contraseña»."; }
  ses = ses || lsGet(K_SES);
  if(!ses || !ses.user){ pantallaAuth = "login"; render(); return; }
  if(h && /invite|recovery|signup|magiclink/.test(h.tipo)){ pantallaAuth = "clave"; render(); return; }
  await despuesDeEntrar();
})();
