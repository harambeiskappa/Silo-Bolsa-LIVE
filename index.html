<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Silo Bolsa LIVE</title>
<style>
  :root{
    --navy:#0f1e38; --navy2:#16294a; --blue:#2b6fd6;
    --ink:#1a2233; --muted:#6b7789; --line:#dfe4ec; --bg:#f4f6fa;
    --warn:#F59E0B; --warnbg:#FEF3C7; --warntx:#78350F;
    --bad:#DC2626; --badbg:#FEE2E2; --badtx:#7F1D1D;
    --ok:#2E9E5B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
       font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  .sd{color:#aab2c0;font-style:italic}
  header{background:var(--navy);color:#fff;padding:12px 18px}
  header h1{margin:0;font-size:16px;font-weight:700}
  header .sub{font-size:11px;color:#93a4c4;text-transform:uppercase;letter-spacing:1.1px;margin-top:2px}
  nav{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex}
  nav button{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:12px 4px 10px;
             font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:48px}
  nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .card h2{margin:0 0 3px;font-size:14px;font-weight:700}
  .hint{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.55}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
  .kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c,#0f1e38);border-radius:10px;padding:12px 14px}
  .kpi .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:25px;font-weight:700;margin:4px 0 0;letter-spacing:-.5px;line-height:1.15}
  .kpi .u{font-size:11.5px;color:var(--muted)}
  .kpi .r{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);
          display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2f8;color:#465a7e;font-weight:600}
  .chip.bad{background:var(--warnbg);color:var(--warntx)}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:1px 6px;border-radius:3px}
  .tag.med{background:#dcf1e3;color:#1c6b3a}
  .tag.est{background:#fdf0d4;color:#8a5d00}
  .tag.sv{background:#fbe0e0;color:#8f2323}
  .alert{padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;line-height:1.5}
  .alert.w{background:var(--warnbg);border:1px solid var(--warn);color:var(--warntx)}
  .alert.e{background:var(--badbg);border:1px solid var(--bad);color:var(--badtx)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
     padding:7px 7px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:6px 7px;border-bottom:1px solid #eef1f6}
  td.r,th.r{text-align:right}
  tbody tr.cl{cursor:pointer}
  tbody tr.cl:hover{background:#f5f8fd}
  input,select,textarea{font:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:7px;
                        background:#fff;color:inherit;max-width:100%}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
  button{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;
         cursor:pointer;font-weight:600;min-height:44px}
  button:hover{background:#f0f3f8}
  button.p{background:var(--blue);border-color:var(--blue);color:#fff}
  button.d{border-color:#f0c4c4;color:#a33}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  svg.map{display:block;width:100%;height:auto;background:#fff;border-radius:6px}
  .bolg{cursor:pointer}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.3}}
  .lat{animation:lat 1.6s ease-in-out infinite}
  /* carga rápida */
  .crow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);
        border-radius:10px;margin-bottom:8px;background:#fff;min-height:60px}
  .crow .lft{flex:1;min-width:0}
  .crow .idl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
  .crow .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .crow input.m{width:96px;text-align:right;font-size:19px;padding:11px 10px;min-height:48px;
                font-variant-numeric:tabular-nums}
  .crow select.e{font-size:12px;padding:6px;min-height:44px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
  .sticky-save{position:sticky;bottom:0;background:linear-gradient(to top,#f4f6fa 62%,rgba(244,246,250,0));
               padding:12px 0 6px;margin-top:6px}
  .sticky-save button{width:100%;font-size:16px;min-height:52px}
  .miniblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:12px}
  .mini{background:#f7f9fc;border-radius:8px;padding:9px 11px}
  .mini .t{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
  .mini .v{font-size:18px;font-weight:700;margin-top:2px}
  .mini .u{font-size:10.5px;color:var(--muted)}
  .parrow{display:grid;grid-template-columns:120px 105px 80px 1fr;gap:10px;align-items:start;
          padding:11px 0;border-bottom:1px solid #eef1f6}
  .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:3px}
  .src{font-size:11px;color:var(--muted);line-height:1.55}
  .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .frow>div{display:flex;flex-direction:column}
  .overlay{position:fixed;inset:0;background:rgba(15,30,56,.45);z-index:200;display:flex;
           align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:12px;padding:20px 22px;max-width:440px;width:100%;
         max-height:90vh;overflow:auto;box-shadow:0 14px 40px rgba(15,30,56,.3)}
  button.dg{background:var(--bad);border-color:var(--bad);color:#fff}
  button.dg:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:190;
         background:var(--navy);color:#fff;border-radius:10px;padding:11px 14px;display:flex;
         gap:12px;align-items:center;font-size:13px;max-width:min(560px,94vw);
         box-shadow:0 8px 24px rgba(15,30,56,.35)}
  .toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;
                padding:5px 11px;min-height:44px;font-size:12.5px}
  .toast button:hover{background:rgba(255,255,255,.14)}
  .guardado{font-size:11px;color:#93a4c4;display:flex;align-items:center;gap:6px}
  .guardado b{color:#ffd479;font-weight:700}
  .opcion{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;
          cursor:pointer;text-align:left;font-weight:400;display:block;width:100%;min-height:auto}
  .opcion:hover{border-color:var(--blue);background:#f5f8fd}
  .opcion b{display:block;font-size:15px;margin-bottom:3px}
  .opcion span{font-size:12.5px;color:var(--muted);line-height:1.5}
  .arrastrando{opacity:.4}
  .destino rect:first-of-type{stroke:var(--blue)!important;stroke-width:4!important}
  .paleta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;
          background:#f7f9fc;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px}
  .maqchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;background:#fff;
           border:1px solid var(--line);border-radius:8px;cursor:grab;font-size:12.5px;font-weight:600;
           touch-action:none;user-select:none}
  .maqchip.activo{border-color:var(--blue);background:#eef4fd}
  @media(max-width:700px){
    .wrap{padding:12px}
    .toast{bottom:80px;left:12px;right:12px;transform:none;max-width:none}
    nav{position:fixed;bottom:0;left:0;right:0;top:auto;border-top:1px solid var(--line);border-bottom:none;
        padding-bottom:env(safe-area-inset-bottom)}
    nav button{border-bottom:none;border-top:3px solid transparent;padding:10px 2px;font-size:11px}
    nav button.on{border-top-color:var(--blue)}
    body{padding-bottom:72px}
    .parrow{grid-template-columns:1fr 1fr}
    .sticky-save{bottom:66px}
    table.resp thead{display:none}
    table.resp tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
    table.resp td{display:flex;justify-content:space-between;border:none;padding:3px 2px}
    table.resp td::before{content:attr(data-l);font-size:10.5px;text-transform:uppercase;
                          letter-spacing:.6px;color:var(--muted);font-weight:700}
  }
  /* ── fase 3: usuarios, base compartida, auditoría ── */
  header .quien{font-size:11.5px;color:#c9d4ea;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  header .quien b{color:#fff}
  header .quien button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;min-height:44px;padding:3px 12px;font-size:11.5px}
  .rolchip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
           padding:2px 7px;border-radius:4px;background:#2b6fd6;color:#fff}
  .rolchip.auditor{background:#8a5d00}.rolchip.lectura{background:#5b6678}
  .pend{display:inline-block;background:#ffd479;color:#4a3300;font-weight:800;border-radius:12px;padding:1px 9px;font-size:11.5px}
  .guardado .ok{color:#7be0a6}
  .guardado .no{color:#ffd479;font-weight:700}
  .login{max-width:380px;margin:40px auto}
  .login input{width:100%;margin-bottom:10px;min-height:46px}
  .login button{width:100%;min-height:48px}
  tr.anulada td{color:#9aa4b5;text-decoration:line-through}
  tr.anulada td.nota-anul{text-decoration:none;font-size:11.5px}
  .chip.ok{background:#dcf1e3;color:#1c6b3a}.chip.obs{background:var(--badbg);color:var(--badtx)}
  .chip.pen{background:var(--warnbg);color:var(--warntx)}.chip.aud{background:#efe6fb;color:#5a2d91}
  .chip.dif{background:#fde7d3;color:#8a3c00}
  .grande{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
  .renglon-rev{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;background:#fff}
  .renglon-rev.error{background:#fdf1f1;border-color:#f0c4c4}
  .renglon-rev.revisar{background:#fffaf0;border-color:var(--warn)}
  .renglon-rev.listo{border-left:5px solid var(--ok)}
  .renglon-rev .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .renglon-rev .por{font-size:12px;color:#465a7e;margin-top:6px;line-height:1.5}
  .renglon-rev .marca{font-size:12px;margin-top:4px;line-height:1.45}
  .renglon-rev select.asig{min-width:0;flex:1 1 200px}
  .conf{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:4px}
  .conf.alta{background:#dcf1e3;color:#1c6b3a}.conf.media{background:#fdf0d4;color:#8a5d00}.conf.baja{background:#fbe0e0;color:#8f2323}
  .diff td{font-size:12.5px}
  /* Controles táctiles: 44 px como mínimo (criterio de la fase 1). Las casillas
     van dentro de una etiqueta de 44 × 44 que es la que se toca. */
  input:not([type=checkbox]):not([type=radio]):not([type=file]),select{min-height:44px}
  input[type=checkbox]{width:20px;height:20px;margin:0;flex:none}
  label.tap{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;cursor:pointer}
  label.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px}
  summary{min-height:44px;display:flex;align-items:center}
  a[data-ficha],a[data-lote]{display:inline-flex;align-items:center;min-height:44px;min-width:44px}
  details.hist summary{display:flex}
  .sticky-save .hint{background:var(--bg);padding:4px 2px;border-radius:6px}
  details.hist summary{cursor:pointer;font-weight:700;font-size:13px}
  @media(max-width:700px){
    header .quien{justify-content:flex-start}
    .grande{font-size:38px}
    nav button{font-size:10.5px}
  }
</style>
</head>
<body>

<header style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
  <div>
    <h1>Silo Bolsa LIVE</h1>
    <div class="sub">PEGSA &amp; Bulltrade · Feedlot</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
    <div class="quien" id="indQuien"></div>
    <div class="guardado" id="indGuardado"></div>
  </div>
</header>

<nav id="navPrincipal">
  <button data-p="panel" class="on">Panel</button>
  <button data-p="carga">Carga</button>
  <button data-p="mapa">Mapa</button>
  <button data-p="ficha">Ficha</button>
  <button data-p="auditoria">Auditoría</button>
  <button data-p="param">Ajustes</button>
</nav>

<div class="wrap">
  <div id="pantalla"></div>
</div>
<div id="modalRoot"></div>
<div id="avisoRoot"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   SILO BOLSA LIVE — Fase 3: sistema compartido
   La fuente de verdad es la base (Supabase). Este navegador guarda solo
   una caché para mirar sin conexión y un borrador de lo que se está
   tipeando. Toda la lógica de cálculo, lectura de planillas, revisión,
   mapa y ficha viene de silo-bolsa.html (fases 1 y 2).
   ══════════════════════════════════════════════════════════════════════ */

/* ── conexión ──────────────────────────────────────────────────────────
   Solo la URL y la clave pública (anon / publishable). La clave pública
   no protege nada por sí sola: lo que protege es la RLS de la base. La
   clave service_role NO va acá nunca. */
const SB_URL_PROD = "https://ckvsiwiizwdrvrpuucxa.supabase.co";
const SB_KEY = "sb_publishable_fLwisrwlOO9Mv2_lwXguXg_L-btmbLu";
/* Banco de pruebas: «?api=http://localhost:PUERTO» solo se acepta si la app
   también se abrió desde localhost. Desde GitHub Pages se ignora, así nadie
   puede mandar un link que apunte la app a otro servidor y robe contraseñas. */
const SB_URL = (()=>{
  try{
    const q = new URLSearchParams(location.search).get("api");
    if(q && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
         && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(q)) return q;
  }catch(e){}
  return SB_URL_PROD;
})();
const K_SES="silobolsa_sesion_v4", K_CACHE="silobolsa_cache_v4", K_COLA="silobolsa_cola_v4", K_BORR="silobolsa_borrador_v4";

/* Respaldo mínimo por si la base todavía no tiene la fila de parámetros.
   Igual que en 01_esquema.sql: nombres, colores y coeficientes vigentes, SIN
   textos de origen, sin %MS de casa y sin fórmula de dieta. Eso es de la
   empresa y el repo es público: entra desde el relevamiento o en Ajustes y
   vive solo en la base. */
const ALIMENTOS = {
  MG:{ nombre:"Maíz Grano", color:"#C9A227", kg_por_metro:3664, ms_pct:null, calidad:"med", origen_kgm:"", origen_ms:"" },
  MS:{ nombre:"Maíz Silo", color:"#2E9E5B", kg_por_metro:4000, ms_pct:null, calidad:"est", origen_kgm:"", origen_ms:"",
       fuera_de_alcance:"el silo de maíz que no está embolsado" },
  GL:{ nombre:"Gluten", color:"#8E2A2A", kg_por_metro:4700, ms_pct:null, calidad:"sv", origen_kgm:"", origen_ms:"" },
  HG:{ nombre:"Harina de Germen", color:"#7A5C3E", kg_por_metro:null, ms_pct:null, calidad:"est", sinBolson:true, origen_kgm:"", origen_ms:"" },
  NU:{ nombre:"Núcleo", color:"#5B6E8C", kg_por_metro:null, ms_pct:null, calidad:"est", sinBolson:true, origen_kgm:"", origen_ms:"" }
};
const DIETA = { proporciones:{}, kg_dia_min:null, kg_dia_max:null, origen:"" };
const REFERENCIA = { fuente:"Portal PEGSA · vista v_PB_StockInsumo (SQL WinCampo)", fecha:"",
  nota:"Valor externo, cargado a mano. La app no se conecta al portal: esto es solo para contrastar.",
  valores:{ MG:null, MS:null, GL:null } };
const ORIGEN_MS = { bolson:"Bolsón en uso", celda:"Celda de alimento", mixer:"Mixer / dieta mezclada" };
const ESTADOS = { armando:"En armado", cerrado:"Cerrado", en_uso:"En uso", terminado:"Terminado", retirado:"Ya no está" };
const ESTADO_LETRA = { armando:"A", cerrado:"C", en_uso:"U", terminado:"T", retirado:"X" };
const TIPOS_EV = { alta:"Alta", armado:"Inicio de armado", apertura:"Apertura", cierre:"Cierre",
                   rotura:"Rotura", perdida:"Pérdida", retiro:"Retiro", nota:"Nota", renumeracion:"Renumeración" };
const ORIGEN_MED = { planilla:"planilla", manual:"a mano", auditoria:"auditoría", migracion:"relevamiento" };
const ROLES = { admin:"admin", auditor:"auditor", lectura:"lectura", sin_acceso:"sin acceso" };
const CAL = {
  med:{cls:"med",txt:"MEDIDO",desc:"Pesada propia en el feedlot."},
  est:{cls:"est",txt:"ESTIMADO",desc:"Bibliografía coherente con el cálculo físico. Sin pesada propia."},
  sv :{cls:"sv", txt:"SIN VALIDAR",desc:"Orden de magnitud. Nada medido todavía."}
};
/* Umbrales, con su porqué:
   · PESO_CONSTANTE_G = 1 g: las pesadas vienen en gramos enteros, así que
     dos pesadas seguidas que difieren en más de 1 g quieren decir que la
     muestra seguía perdiendo agua → el %MS es una cota superior.
   · TOL_CERRADO_M = 0,5 m: la resolución de la medición. El odómetro lee
     de a 0,1 m y medir "de la mitad del triángulo a la mitad del otro" mueve
     unos decímetros por punta. Se usa para dos cosas:
       - proponer correspondencias: un cerrado "mide lo mismo" si cambió ±0,5 m;
       - el nivel del aviso cuando un bolsón que no está en armado crece:
         hasta 0,5 m es «dentro de la resolución» (informativo), más de 0,5 m
         es «diferencia de medición» (aviso). Con cualquier aumento, el par
         no da ritmo de consumo. Lo mismo hace la base (02_seguridad.sql). */
const PESO_CONSTANTE_G = 1, TOL_CERRADO_M = 0.5;
/* Ingredientes de la fórmula; si todavía no hay fórmula cargada, todos los
   alimentos conocidos (para que la planilla y la carga de MS no queden vacías). */
function ingsDieta(){
  const p = Object.keys((D.dieta&&D.dieta.proporciones)||{});
  return p.length ? p : Object.keys(D.alimentos);
}
function hayFormula(){ return Object.keys((D.dieta&&D.dieta.proporciones)||{}).length>0; }

let D = vacio(), vista = "panel", fichaId = null, cargaBuf = {};
let staging = null, undoPila = [], modal = null, aviso = null;
let ses = null, yo = null, conexion = "ok", cola = [], cacheEn = null, cargando = false;
let pantallaAuth = null;    // null · "login" · "clave" · "sin_acceso" · "cargando"
let auditLote = null;       // lote abierto en la bandeja
let relev = null;           // revisión de un relevamiento histórico
let restauracion = null;    // revisión de un respaldo a restaurar
let borradorRecuperado = null;

function vacio(){
  return { meta:{version:4}, alimentos:clonar(ALIMENTOS), dieta:clonar(DIETA), referencia:clonar(REFERENCIA),
           bolsones:[], mediciones:[], eventos:[], calidad:[], importaciones:[], auditorias:[],
           relevamientos:[], relevamiento_items:[], perfiles:[], latidos:[], parametrosFila:{} };
}

/* ── utilidades ────────────────────────────────────────────────────── */
const SD = '<span class="sd">s/d</span>';
function clonar(x){ return JSON.parse(JSON.stringify(x)); }
function n(v){ if(v===null||v===undefined||v===""||isNaN(v)) return null; return Number(v); }
function f(v,d=0){ const x=n(v); return x===null?SD:x.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hoy(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function dmy(iso){ return iso? String(iso).slice(0,10).split("-").reverse().join("/") : "s/d"; }
function dmyh(ts){ if(!ts) return "s/d"; const d=new Date(ts);
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }
function dias(f1,f2){ return (new Date(f2+"T00:00:00") - new Date(f1+"T00:00:00"))/86400000; }
function ali(b){ return D.alimentos[b.alimento] || {nombre:b.alimento,color:"#999",kg_por_metro:0,ms_pct:0,calidad:"sv"}; }
function cal(a){ return CAL[a.calidad] || CAL.sv; }
function tagCal(a){ const c=cal(a); return `<span class="tag ${c.cls}" title="${esc(c.desc)}">${c.txt}</span>`; }
function gkey(b){ return (b.grupo||"").trim() || b.id; }
function nBols(lista){ return new Set(lista.map(gkey)).size; }
function et(b){ return b ? (b.etiqueta||"s/etiqueta") : "s/d"; }
function bol(id){ return D.bolsones.find(x=>x.id===id); }
function uuid(){
  if(globalThis.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function uid(){ return uuid(); }
function lsGet(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function nombreUsuario(id){
  if(!id) return "s/d";
  const p=(D.perfiles||[]).find(x=>x.id===id);
  return p ? (p.nombre||p.email) : "usuario de otro proyecto";
}

/* ══════════════════ SUPABASE POR FETCH ═══════════════════════════════ */
async function sbFetch(path, opts={}, reintento=true){
  if(ses && !opts.sinToken && ses.expires_at && ses.expires_at*1000-Date.now() < 60000) await refrescar();
  const h = Object.assign({ apikey:SB_KEY, "Content-Type":"application/json" }, opts.headers||{});
  if(ses && ses.access_token && !opts.sinToken) h.Authorization = "Bearer "+ses.access_token;
  let r;
  try{ r = await fetch(SB_URL+path, {method:opts.method||"GET", headers:h, body:opts.body}); }
  catch(e){ const er=new Error("Sin conexión con la base."); er.red=true; throw er; }
  if(r.status===401 && reintento && ses && ses.refresh_token && !opts.sinToken){
    if(await refrescar()) return sbFetch(path, opts, false);
  }
  const txt = await r.text(); let j=null;
  try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const er = new Error((j&&(j.message||j.msg||j.error_description||j.error))||("HTTP "+r.status));
    er.status=r.status; er.code=j&&(j.code||j.error_code); er.details=j&&j.details; er.hint=j&&j.hint;
    throw er;
  }
  return j;
}
function rpc(fn, args){ return sbFetch("/rest/v1/rpc/"+fn, {method:"POST", body:JSON.stringify(args||{})}); }
async function leerTodo(tabla, orden){
  const out=[]; let off=0;
  for(;;){
    const lote = await sbFetch(`/rest/v1/${tabla}?select=*&order=${orden||"id"}.asc&limit=1000&offset=${off}`);
    out.push(...lote); if(lote.length<1000) break; off+=1000;
  }
  return out;
}

/* ── sesión ────────────────────────────────────────────────────────── */
function guardarSesion(s){
  ses = s ? { access_token:s.access_token, refresh_token:s.refresh_token,
              expires_at: s.expires_at || (Math.floor(Date.now()/1000)+(s.expires_in||3600)),
              user: s.user ? {id:s.user.id, email:s.user.email} : (ses&&ses.user) } : null;
  if(ses) lsSet(K_SES, ses); else lsDel(K_SES);
}
let refrescando = null;
async function refrescar(){
  if(refrescando) return refrescando;
  refrescando = (async()=>{
    try{
      const j = await sbFetch("/auth/v1/token?grant_type=refresh_token",
        {method:"POST", body:JSON.stringify({refresh_token:ses.refresh_token}), sinToken:true}, false);
      guardarSesion(j); return true;
    }catch(e){
      if(e.red) return false;               // sin red: se sigue con la caché
      guardarSesion(null); yo=null; pantallaAuth="login"; render(); return false;
    }finally{ setTimeout(()=>{ refrescando=null; },0); }
  })();
  return refrescando;
}
async function entrar(email, clave){
  const j = await sbFetch("/auth/v1/token?grant_type=password",
    {method:"POST", body:JSON.stringify({email, password:clave}), sinToken:true}, false);
  guardarSesion(j);
}
async function salir(){
  try{ await sbFetch("/auth/v1/logout", {method:"POST"}, false); }catch(e){}
  guardarSesion(null); yo=null; D=vacio(); lsDel(K_CACHE);
  pantallaAuth="login"; render();
}
/* Los links de invitación y de "me olvidé la contraseña" vuelven a la app
   con la sesión en el #hash. Se toma, se limpia la barra y se pide clave. */
async function leerHash(){
  if(!location.hash || location.hash.length<2) return null;
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get("error") || q.get("error_code")){
    history.replaceState(null,"",location.pathname+location.search);
    return {error: q.get("error_description") || q.get("error_code") || q.get("error")};
  }
  if(!q.get("access_token")) return null;
  history.replaceState(null,"",location.pathname+location.search);
  guardarSesion({access_token:q.get("access_token"), refresh_token:q.get("refresh_token"),
                 expires_in:+q.get("expires_in")||3600});
  try{ const u = await sbFetch("/auth/v1/user"); ses.user={id:u.id,email:u.email}; lsSet(K_SES,ses); }catch(e){}
  return {tipo:q.get("type")||""};
}

/* ── lectura completa desde la base ────────────────────────────────── */
const TABLAS = ["bolsones","mediciones","eventos","calidad","importaciones","auditorias",
                "parametros","relevamientos","relevamiento_items","perfiles"];
async function recargar(){
  if(!ses || !yo || cargando) return;
  cargando = true;
  try{
    const t = {};
    await Promise.all(TABLAS.map(async x=>{ t[x] = await leerTodo(x, x==="parametros"?"clave":"id"); }));
    t.latidos = await sbFetch("/rest/v1/latidos?select=*&order=en.desc&limit=1").catch(()=>[]);
    if(esAdmin()) t.invitaciones = await leerTodo("invitaciones","email").catch(()=>[]);
    lsSet(K_CACHE, {uid:yo.id, en:new Date().toISOString(), t});
    cacheEn = null;
    aplicarTablas(t);
    if(conexion==="sin_red" && !cola.length) conexion="ok";
  }catch(e){
    if(e.red){ conexion="sin_red"; }
    else mostrarAviso("No pude leer la base: "+e.message);
  }finally{ cargando=false; render(); }
}
/* D = lo que dice la base + lo que todavía está en la cola sin guardar */
function aplicarTablas(t){
  D = desdeBase(t);
  cola.filter(op=>op.uid===(yo&&yo.id)).forEach(op=>{ try{ aplicarLocal(op); }catch(e){} });
}
function desdeBase(t){
  const par = {}; (t.parametros||[]).forEach(p=>par[p.clave]=p);
  return normalizar({
    meta: par.meta ? par.meta.valor : {version:4},
    alimentos: par.alimentos ? par.alimentos.valor : clonar(ALIMENTOS),
    dieta: par.dieta ? par.dieta.valor : clonar(DIETA),
    referencia: par.referencia ? par.referencia.valor : clonar(REFERENCIA),
    parametrosFila: par,
    bolsones: (t.bolsones||[]).map(bolsonDeFila),
    mediciones: (t.mediciones||[]).map(m=>Object.assign({}, m, {metros_restantes:n(m.metros_restantes)})),
    eventos: t.eventos||[],
    calidad: (t.calidad||[]).map(c=>Object.assign({}, c, {ms_pct:n(c.ms_pct), peso_inicial_g:n(c.peso_inicial_g)})),
    importaciones: t.importaciones||[], auditorias: t.auditorias||[],
    relevamientos: t.relevamientos||[],
    relevamiento_items: (t.relevamiento_items||[]).map(i=>Object.assign({}, i, {metros:n(i.metros)})),
    perfiles: t.perfiles||[], latidos: t.latidos||[], invitaciones: t.invitaciones||[]
  });
}
function bolsonDeFila(r){
  return { id:r.id, etiqueta:r.etiqueta, grupo:r.grupo||"", alimento:r.alimento, diametro_pies:n(r.diametro_pies)||9,
    armado:{ fecha:r.armado_fecha||null, metros_iniciales:n(r.armado_metros_iniciales),
             kg_declarados:n(r.armado_kg_declarados), origen:r.armado_origen||"", responsable:r.armado_responsable||"" },
    ubicacion:{ sector:r.sector||"Playa", fila:r.fila||"A", posicion:n(r.posicion)||0 },
    estado:r.estado, fecha_apertura:r.fecha_apertura||null, fecha_cierre:r.fecha_cierre||null, nota:r.nota||"",
    actualizado_en:r.actualizado_en, actualizado_por:r.actualizado_por, creado_en:r.creado_en };
}
function normalizar(j){
  j.meta = j.meta||{version:4};
  j.alimentos = j.alimentos||clonar(ALIMENTOS);
  ["bolsones","mediciones","eventos","calidad","importaciones","auditorias","relevamientos",
   "relevamiento_items","perfiles","latidos"].forEach(k=>{ j[k]=j[k]||[]; });
  j.dieta = j.dieta||clonar(DIETA);
  j.referencia = j.referencia||clonar(REFERENCIA);
  j.referencia.valores = j.referencia.valores||{};
  j.parametrosFila = j.parametrosFila||{};
  return j;
}

/* ══════════════════ COLA: NADA SE PIERDE SI SE CORTA LA RED ══════════
   Cada cambio es una operación con id propio. Se guarda primero en este
   navegador, se aplica en pantalla, y se manda a la base. Si no hay red,
   queda en la cola ("sin guardar en la base") y se manda sola al volver.
   Las funciones de la base son idempotentes por id: reintentar no duplica. */
function guardarCola(){ lsSet(K_COLA, cola); }
function encolar(op){
  op.id = op.id||uuid(); op.uid = yo.id; op.creado = new Date().toISOString();
  // dos ediciones del mismo bolsón sin guardar se juntan en una, con la versión que se vio primero
  if(op.fn==="actualizar_bolson"){
    const prev = cola.find(o=>o.fn==="actualizar_bolson" && o.args.p_id===op.args.p_id && o.uid===op.uid);
    if(prev){ Object.assign(prev.args.p_cambios, op.args.p_cambios); prev.desc = op.desc;
              guardarCola(); aplicarLocal(op); render(); vaciarCola(); return; }
  }
  cola.push(op); guardarCola();
  aplicarLocal(op);
  render();
  vaciarCola();
}
let vaciando = false;
async function vaciarCola(){
  if(vaciando || !yo) return;
  vaciando = true;
  let hubo = false;
  try{
    while(cola.length){
      const op = cola.find(o=>o.uid===yo.id); if(!op) break;
      conexion = "guardando"; pintarIndicador();
      try{
        await rpc(op.fn, op.args);
        cola = cola.filter(o=>o.id!==op.id); guardarCola(); hubo = true;
      }catch(e){
        if(e.red){ conexion = "sin_red"; pintarIndicador(); break; }
        cola = cola.filter(o=>o.id!==op.id); guardarCola();
        conexion = "ok";
        await recargar();
        errorDeOperacion(op, e);
        break;
      }
    }
  }finally{ vaciando = false; }
  if(conexion!=="sin_red") conexion = "ok";
  if(hubo){ await recargar(); if(cola.some(o=>o.uid===yo.id)) vaciarCola(); }
  else pintarIndicador();
}
window.addEventListener("online", ()=>{ vaciarCola(); if(!cola.length) recargar(); });
setInterval(()=>{ if(yo && cola.length) vaciarCola(); }, 15000);

function errorDeOperacion(op, e){
  if(e.status===409 && e.message==="CONFLICTO" && (op.fn==="actualizar_bolson"||op.fn==="mover_bolsones")){
    let det = {}; try{ det = JSON.parse(e.details||"{}"); }catch(x){}
    return mostrarConflicto(op, det);
  }
  abrirModal({titulo:"No se guardó en la base", soloOk:true, ok:"Entendido", onOk:cerrarModal,
    texto:`<b>${esc(op.desc||op.fn)}</b><br><br>La base respondió: ${esc(e.message)}${e.details?`<br><span class="src">${esc(e.details)}</span>`:""}
      <br><br>Lo que ves ahora es lo que quedó guardado en la base.`});
}

/* ── control de edición concurrente (actualizado_en) ───────────────── */
const CAMPOS_BOLSON = {
  etiqueta:"Etiqueta", estado:"Estado", grupo:"Grupo", alimento:"Alimento", nota:"Nota", fila:"Pasada", posicion:"Posición",
  armado_fecha:"Fecha de armado", armado_metros_iniciales:"Metros iniciales", armado_kg_declarados:"Kg declarados",
  armado_origen:"Origen", armado_responsable:"Responsable", fecha_apertura:"Apertura", fecha_cierre:"Cierre"
};
function filaDeBolson(b){
  return { etiqueta:b.etiqueta, estado:b.estado, grupo:b.grupo, alimento:b.alimento, nota:b.nota,
    fila:b.ubicacion.fila, posicion:b.ubicacion.posicion, armado_fecha:b.armado.fecha,
    armado_metros_iniciales:b.armado.metros_iniciales, armado_kg_declarados:b.armado.kg_declarados,
    armado_origen:b.armado.origen, armado_responsable:b.armado.responsable,
    fecha_apertura:b.fecha_apertura, fecha_cierre:b.fecha_cierre };
}
function vCampo(k,v){ if(v===null||v===undefined||v==="") return "s/d"; if(k==="estado") return ESTADOS[v]||v; return String(v); }
function mostrarConflicto(op, det){
  const actual = det.actual||{}, visto = op.visto||{};
  const filas = [];
  Object.keys(CAMPOS_BOLSON).forEach(k=>{
    const mio = op.fn==="actualizar_bolson" && k in op.args.p_cambios ? op.args.p_cambios[k] : undefined;
    const cambioOtro = String(visto[k]??"")!==String(actual[k]??"");
    if(mio===undefined && !cambioOtro) return;
    filas.push(`<tr><td><b>${CAMPOS_BOLSON[k]}</b></td><td>${esc(vCampo(k,visto[k]))}</td>
      <td style="${cambioOtro?"background:#fff4d6":""}">${esc(vCampo(k,actual[k]))}</td>
      <td>${mio===undefined?"—":esc(vCampo(k,mio))}</td></tr>`);
  });
  const b = bol(op.args.p_id || (op.args.p&&op.args.p[0]&&op.args.p[0].id));
  abrirModal({
    titulo:`${esc(et(b)||"El bolsón")}: alguien guardó antes que vos`,
    texto:`<b>${esc(det.por||"Otro usuario")}</b> lo cambió a las ${esc(dmyh(actual.actualizado_en))}, mientras vos
      lo tenías abierto. <b>Tu cambio no se guardó</b>: nada se pisó.<div style="overflow-x:auto;margin-top:10px">
      <table class="diff"><thead><tr><th>Campo</th><th>Cuando abriste</th><th>Ahora en la base</th><th>Lo tuyo</th></tr></thead>
      <tbody>${filas.join("")}</tbody></table></div>`,
    ok: op.fn==="actualizar_bolson" ? "Guardar lo mío encima" : "Entendido",
    onOk: ()=>{
      cerrarModal();
      if(op.fn!=="actualizar_bolson") return;
      encolar({fn:op.fn, desc:op.desc+" (encima de lo de "+(det.por||"otro")+")",
        args:Object.assign({}, op.args, {p_version:actual.actualizado_en}), visto:actual});
    }
  });
}

/* ── indicador de guardado ─────────────────────────────────────────── */
function pintarIndicador(){
  const el = document.getElementById("indGuardado"); if(!el) return;
  const mios = yo ? cola.filter(o=>o.uid===yo.id).length : 0;
  if(!yo){ el.innerHTML=""; return; }
  if(conexion==="guardando") el.innerHTML = `guardando en la base…`;
  else if(mios) el.innerHTML = `<span class="no">● sin guardar en la base</span> · ${mios} cambio${mios===1?"":"s"}${conexion==="sin_red"?" · sin conexión: se guardan solos al volver":""}`;
  else if(conexion==="sin_red" || cacheEn) el.innerHTML = `<span class="no">● sin conexión</span> · mostrando lo leído el ${dmyh(cacheEn)}`;
  else el.innerHTML = `<span class="ok">●</span> guardado en la base`;
}

/* ── borrador: lo tipeado sobrevive a un corte o a cerrar la pestaña ── */
function guardarBorrador(){
  if(!yo) return;
  if(!staging && !Object.keys(cargaBuf).length && !relev) { lsDel(K_BORR); return; }
  lsSet(K_BORR, {uid:yo.id, en:new Date().toISOString(), staging, cargaBuf, cargaModo, relev});
}
function recuperarBorrador(){
  const b = lsGet(K_BORR);
  if(!b || !yo || b.uid!==yo.id) return;
  staging = b.staging||null; cargaBuf = b.cargaBuf||{}; cargaModo = b.cargaModo||null; relev = b.relev||null;
  if(staging) vista="revision"; else if(relev) vista="relevamiento"; else if(Object.keys(cargaBuf).length) vista="carga";
  borradorRecuperado = b.en;
}

/* ── lo que se ve mientras la operación espera en la cola ──────────── */
function aplicarLocal(op){
  const a = op.args||{}, ahora = new Date().toISOString(), pend = {_pendiente:true};
  if(op.fn==="confirmar_lote"){
    const p = a.p;
    if(D.importaciones.some(x=>x.id===p.id)) return;
    D.importaciones.push(Object.assign({id:p.id, tipo:p.tipo, archivo:p.archivo, fecha_medicion:p.fecha, medido_por:p.medido_por,
      resumen:p.resumen, revision:p.revision, estado_auditoria:"pendiente", cargado_por:yo.id, cargado_en:ahora}, pend));
    (p.nuevos||[]).forEach(x=>{
      D.bolsones.push(Object.assign(bolsonDeFila({id:x.id, etiqueta:x.etiqueta, alimento:x.alimento, fila:x.fila,
        posicion:x.posicion, estado:"cerrado", nota:x.nota||""}), pend));
      D.eventos.push(Object.assign({id:uuid(), bolson_id:x.id, fecha:p.fecha, tipo:"alta", detalle:"Dado de alta (sin guardar)"}, pend));
    });
    (p.renumerar||[]).forEach(x=>{ const b=bol(x.bolson_id); if(b){ D.eventos.push(Object.assign({id:uuid(), bolson_id:b.id,
      fecha:p.fecha, tipo:"renumeracion", detalle:`Etiqueta ${b.etiqueta} → ${x.etiqueta}`}, pend)); b.etiqueta=x.etiqueta; } });
    (p.estados||[]).forEach(x=>{ const b=bol(x.bolson_id); if(b) cambiarEstado(b, x.estado, p.fecha); });
    (p.mediciones||[]).forEach(x=>{
      if(x.reemplaza_a){ const v=D.mediciones.find(m=>m.id===x.reemplaza_a); if(v){ v.anulada=true; v.anulada_motivo=x.motivo; } }
      D.mediciones.push(Object.assign({id:x.id, bolson_id:x.bolson_id, fecha:p.fecha, metros_restantes:n(x.metros),
        etiqueta_planilla:x.etiqueta_planilla, orden_planilla:x.orden_planilla, estado_anotado:x.estado_anotado||"",
        lectura:x.lectura||"ok", medido_por:p.medido_por, nota:x.nota||"", origen:p.tipo, importacion_id:p.id,
        revision_marca:x.revision_marca||null, revision_nota:x.revision_nota||null,
        reemplaza_a:x.reemplaza_a||null, motivo:x.motivo||null, anulada:false, cargado_por:yo.id, cargado_en:ahora}, pend));
    });
    (p.calidad||[]).forEach(x=>{
      if(x.reemplaza_a){ const v=D.calidad.find(m=>m.id===x.reemplaza_a); if(v){ v.anulada=true; v.anulada_motivo=x.motivo; } }
      D.calidad.push(Object.assign({}, x, {fecha:p.fecha, ms_pct:n(x.ms_pct), medido_por:p.medido_por, origen:p.tipo,
        importacion_id:p.id, anulada:false, cargado_por:yo.id, cargado_en:ahora}, pend));
    });
  } else if(op.fn==="actualizar_bolson"){
    const b = bol(a.p_id); if(!b) return;
    const c = a.p_cambios;
    Object.entries(c).forEach(([k,v])=>{
      if(k==="estado") cambiarEstado(b, v, a.p_fecha||hoy());
      else if(k==="etiqueta"){ if(b.etiqueta!==v){ D.eventos.push(Object.assign({id:uuid(), bolson_id:b.id, fecha:a.p_fecha||hoy(),
        tipo:"renumeracion", detalle:`Etiqueta ${b.etiqueta} → ${v}`}, pend)); b.etiqueta=v; } }
      else if(k.startsWith("armado_")) b.armado[k.slice(7)] = v;
      else if(k==="fila"||k==="posicion"||k==="sector") b.ubicacion[k] = v;
      else if(k!=="motivo_etiqueta") b[k] = v;
    });
    b._pendiente = true;
  } else if(op.fn==="mover_bolsones"){
    a.p.forEach(x=>{ const b=bol(x.id); if(b){ b.ubicacion.fila=x.fila; b.ubicacion.posicion=x.posicion; b._pendiente=true; } });
  } else if(op.fn==="agregar_evento"){
    if(!D.eventos.some(e=>e.id===a.p_id))
      D.eventos.push(Object.assign({id:a.p_id, bolson_id:a.p_bolson, fecha:a.p_fecha, tipo:a.p_tipo, detalle:a.p_detalle,
        cargado_por:yo.id, cargado_en:ahora}, pend));
  } else if(op.fn==="anular"){
    const lista = a.p_tabla==="mediciones"?D.mediciones : a.p_tabla==="calidad"?D.calidad : D.eventos;
    const x = lista.find(r=>r.id===a.p_id); if(!x) return;
    if(a.p_tabla==="eventos"){ x.anulado=true; x.anulado_motivo=a.p_motivo; } else { x.anulada=true; x.anulada_motivo=a.p_motivo; }
    x._pendiente = true;
  } else if(op.fn==="corregir_medicion"){
    const m = D.mediciones.find(r=>r.id===a.p_id); if(!m || D.mediciones.some(r=>r.id===a.p_nuevo_id)) return;
    m.anulada=true; m.anulada_motivo="Corregida: "+a.p_motivo;
    D.mediciones.push(Object.assign({}, m, {id:a.p_nuevo_id, metros_restantes:n(a.p_metros), anulada:false,
      anulada_motivo:null, reemplaza_a:m.id, motivo:a.p_motivo, origen:m.origen==="auditoria"?"auditoria":"manual",
      revision_marca:null, revision_nota:null, cargado_por:yo.id, cargado_en:ahora}, pend));
  } else if(op.fn==="medicion_auditoria"){
    if(!D.mediciones.some(r=>r.id===a.p_id))
      D.mediciones.push(Object.assign({id:a.p_id, bolson_id:a.p_bolson, fecha:a.p_fecha, metros_restantes:n(a.p_metros),
        nota:a.p_nota||"", origen:"auditoria", medido_por:yo.nombre||yo.email, anulada:false, cargado_por:yo.id,
        cargado_en:ahora, etiqueta_planilla:"", lectura:"ok"}, pend));
  } else if(op.fn==="auditar"){
    if(D.auditorias.some(r=>r.id===a.p_id)) return;
    D.auditorias.push(Object.assign({id:a.p_id, importacion_id:a.p_importacion, medicion_id:a.p_medicion,
      resultado:a.p_resultado, comentario:a.p_comentario, auditor:yo.id, en:ahora}, pend));
    const l = D.importaciones.find(x=>x.id===a.p_importacion); if(l) l.estado_auditoria = a.p_resultado;
  } else if(op.fn==="guardar_parametro"){
    D[a.p_clave] = clonar(a.p_valor);
  } else if(op.fn==="cargar_relevamiento"){
    const p = a.p; if(D.relevamientos.some(r=>r.id===p.relevamiento_id)) return;
    D.relevamientos.push(Object.assign({id:p.relevamiento_id, fecha:p.fecha, fuente:p.archivo, nota:p.nota}, pend));
    p.items.forEach(i=>D.relevamiento_items.push(Object.assign({relevamiento_id:p.relevamiento_id}, i, {metros:n(i.metros)})));
    D.importaciones.push(Object.assign({id:p.id, tipo:"relevamiento", archivo:p.archivo, fecha_medicion:p.fecha,
      resumen:p.resumen, estado_auditoria:"no_aplica", cargado_por:yo.id, cargado_en:ahora}, pend));
    (p.vivos||[]).forEach(v=>{
      D.bolsones.push(Object.assign(bolsonDeFila(v.bolson), pend));
      if(v.medicion) D.mediciones.push(Object.assign({id:v.medicion.id, bolson_id:v.bolson.id, fecha:p.fecha,
        metros_restantes:n(v.medicion.metros), etiqueta_planilla:v.medicion.etiqueta_planilla,
        orden_planilla:v.medicion.orden_planilla, nota:v.medicion.nota||"", origen:"migracion", importacion_id:p.id,
        anulada:false, cargado_por:yo.id, cargado_en:ahora, lectura:"ok", medido_por:""}, pend));
    });
    (p.parametros||[]).forEach(x=>{ D[x.clave] = clonar(x.valor); });
  } else if(op.fn==="cambiar_rol" || op.fn==="invitar"){
    const pr = D.perfiles.find(x=> op.fn==="cambiar_rol" ? x.id===a.p_id : x.email===String(a.p_email).toLowerCase());
    if(pr){ pr.rol = a.p_rol; if(a.p_nombre) pr.nombre = a.p_nombre; }
  }
}

/* ══════════════════ DERIVADOS (fase 1, con la historia nueva) ═════════
   Una medición anulada no cuenta para nada. Si en una fecha hay a la vez
   una medición de planilla y una de auditoría, manda la de planilla hasta
   que Iñaki anule una de las dos: la de auditoría NO reemplaza sola. */
function medsValidas(id){
  return D.mediciones.filter(m=>m.bolson_id===id && !m.anulada && n(m.metros_restantes)!==null);
}
function medsDe(id){
  const por = {};
  /* Una medición de auditoría solo entra en los cálculos si Iñaki anuló la
     original de esa fecha: es la forma de decir "vale la de Nico". */
  const anuladasOrig = new Set(D.mediciones.filter(m=>m.bolson_id===id && m.anulada && m.origen!=="auditoria").map(m=>m.fecha));
  medsValidas(id).filter(m=>m.origen!=="auditoria" || anuladasOrig.has(m.fecha)).forEach(m=>{
    const ya = por[m.fecha];
    if(!ya || (ya.origen==="auditoria" && m.origen!=="auditoria")
       || ((ya.origen==="auditoria")===(m.origen==="auditoria") && String(m.cargado_en)>String(ya.cargado_en))) por[m.fecha]=m;
  });
  return Object.values(por).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function ultimaMed(id){ const ms=medsDe(id); return ms.length?ms[ms.length-1]:null; }
/* la última medición válida (no de auditoría) antes de una fecha */
function medAnterior(id, fecha){
  const ms = medsValidas(id).filter(m=>m.origen!=="auditoria" && m.fecha<fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return ms.length?ms[ms.length-1]:null;
}
function medEnFecha(id, fecha){
  return medsValidas(id).find(m=>m.origen!=="auditoria" && m.fecha===fecha) || null;
}
function metrosAct(b){ const u=ultimaMed(b.id); return u?n(u.metros_restantes):null; }
function consumido(b){
  const ini=n(b.armado&&b.armado.metros_iniciales), act=metrosAct(b);
  if(ini===null||act===null) return null;
  return ini-act;
}
function pctConsumido(b){
  const ini=n(b.armado&&b.armado.metros_iniciales), c=consumido(b);
  if(ini===null||c===null||ini<=0) return null;
  /* Si consumió menos que cero, el bolsón mide más que su largo inicial: los
     datos se contradicen. Devolver 0% sería inventar un dato limpio sobre uno
     roto — mejor s/d, que se ve y se corrige. */
  if(c<0) return null;
  return Math.min(100, c/ini*100);
}
function inconsistentes(){
  return vivos().filter(b=>{ const c=consumido(b); return c!==null && c<0; });
}
/* ritmo: m/día entre las dos últimas mediciones. null si no hay dos, si no
   pasó tiempo, si el bolsón no bajó, o si el par está marcado como
   diferencia de medición (Paso 0: desvío sistemático sin explicar). */
function tasa(b){
  const ms=medsDe(b.id);
  if(ms.length<2) return null;
  const a=ms[ms.length-2], z=ms[ms.length-1];
  if(z.revision_marca) return null;   // cualquier aumento (dentro de la resolución o no): el par no da ritmo
  const dd=dias(a.fecha,z.fecha);
  if(dd<=0) return null;
  return (n(a.metros_restantes)-n(z.metros_restantes))/dd;   // + se consume, − crece
}
function difMedicion(b){ const u=ultimaMed(b.id); return u && u.revision_marca==="diferencia_medicion" ? u : null; }
function enResolucion(b){ const u=ultimaMed(b.id); return u && u.revision_marca==="dentro_resolucion" ? u : null; }
function ritmo(b){
  if(b.estado==="armando") return null;
  const t=tasa(b); return (t!==null && t>0) ? t : null;
}
function ritmoLlenado(b){
  if(b.estado!=="armando") return null;
  const t=tasa(b); return (t!==null && t<0) ? -t : null;
}
function diasRest(b){
  const r=ritmo(b), act=metrosAct(b);
  if(r===null||act===null) return null;
  return act/r;
}
function rendReal(b){
  if(b.estado!=="terminado") return null;
  const kg=n(b.armado&&b.armado.kg_declarados), ini=n(b.armado&&b.armado.metros_iniciales);
  if(kg===null||ini===null||ini<=0) return null;
  return kg/ini;
}
function kgAct(b){ const m=metrosAct(b); return m===null?null:m*ali(b).kg_por_metro; }

/* ── materia seca ──────────────────────────────────────────────────────
   Una lectura que no llegó a peso constante es una COTA SUPERIOR: la MS
   real es menor. Se muestra "≤ 61 %" (ejemplo) y no se usa como valor en ningún
   cálculo: el %MS vigente sigue siendo el último valor que sí llegó a peso
   constante (o el de casa), y se avisa que hay una cota más nueva. */
function fPct(v){ const x=n(v); return x===null?SD:f(x, x%1?1:0)+" %"; }
function txtMs(c){ return c ? (c.peso_constante===false?"≤ ":"")+fPct(c.ms_pct).replace(/<[^>]+>/g,"") : "s/d"; }
function lecturasMs(filtro){
  return (D.calidad||[]).filter(x=>!x.anulada && n(x.ms_pct)!==null && filtro(x))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||String(a.cargado_en).localeCompare(String(b.cargado_en)));
}
function msVigente(k){
  const todas = lecturasMs(x=>x.tipo==="ingrediente" && x.alimento===k);
  const valores = todas.filter(x=>x.peso_constante!==false);
  const cotas = todas.filter(x=>x.peso_constante===false);
  const u = valores.length ? valores[valores.length-1] : null;
  const cota = cotas.length && (!u || cotas[cotas.length-1].fecha>=u.fecha) ? cotas[cotas.length-1] : null;
  if(u) return { pct:n(u.ms_pct), medido:true, fecha:u.fecha, cota, lectura:u,
                 origen:(ORIGEN_MS[u.origen_tipo]||u.origen_tipo)+(u.origen_id?" "+u.origen_id:"") };
  const a=D.alimentos[k];
  return { pct:a?n(a.ms_pct):null, medido:false, fecha:null, cota, origen:"valor de casa" };
}
function kgMsAct(b){
  const k=kgAct(b); if(k===null) return null;
  const v=msVigente(b.alimento); return v.pct===null?null:k*v.pct/100;
}
/* %MS que DEBERÍA dar la dieta. Si ese día faltó un ingrediente (p. ej.
   no había harina de germen), se calcula sin él, re-proporcionando el resto. */
function msDietaTeorico(faltantes){
  const sin = new Set(faltantes||[]);
  const p=(D.dieta&&D.dieta.proporciones)||{};
  let suma=0, tot=0, faltan=[], medidos=0;
  Object.entries(p).forEach(([k,pc])=>{
    if(sin.has(k)) return;
    const v=msVigente(k); tot+=pc;
    if(v.pct===null) faltan.push(k); else { suma+=pc*v.pct/100; if(v.medido) medidos++; }
  });
  if(!tot||faltan.length) return null;
  return { pct:suma/tot*100, medidos, total:Object.keys(p).length-sin.size, sin:[...sin] };
}
function msDietaMedido(){
  const c = lecturasMs(x=>x.tipo==="dieta");
  return c.length?c[c.length-1]:null;
}
function sensibilidad(faltantes){
  const sin = new Set(faltantes||[]);
  const p=Object.fromEntries(Object.entries((D.dieta&&D.dieta.proporciones)||{}).filter(([k])=>!sin.has(k)));
  const tot=Object.values(p).reduce((s,x)=>s+x,0)||1;
  return Object.entries(p).map(([k,pc])=>({k, pct:pc, efecto:pc/tot})).sort((a,b)=>b.efecto-a.efecto);
}
function calibracion(k){
  const rs = D.bolsones.filter(b=>b.alimento===k).map(rendReal).filter(x=>x!==null);
  if(!rs.length) return null;
  const prom = rs.reduce((s,x)=>s+x,0)/rs.length;
  const vig = D.alimentos[k].kg_por_metro;
  return { n:rs.length, prom, vig, desvio: vig? (prom-vig)/vig*100 : null };
}

/* ── orden de recorrido ────────────────────────────────────────────── */
function vivos(){ return D.bolsones.filter(b=>b.estado!=="retirado"); }
function recorrido(){
  return [...vivos()].sort((a,b)=>{
    const fa=(a.ubicacion.fila||"A"), fb=(b.ubicacion.fila||"A");
    if(fa!==fb) return fa.localeCompare(fb);
    return (a.ubicacion.posicion||0)-(b.ubicacion.posicion||0);
  });
}

/* un solo camino para cambiar de estado (en pantalla; la base hace lo mismo
   en _cambiar_estado) */
function cambiarEstado(b, nuevo, fecha){
  const antes = b.estado;
  if(antes===nuevo) return;
  b.estado = nuevo;
  if(nuevo==="en_uso" && !b.fecha_apertura) b.fecha_apertura = fecha;
  if(nuevo==="terminado") b.fecha_cierre = fecha;
  D.eventos.push({id:uuid(), bolson_id:b.id, fecha, _pendiente:true,
    tipo: nuevo==="terminado"?"cierre" : nuevo==="en_uso"?"apertura"
        : nuevo==="armando"?"armado" : nuevo==="retirado"?"retiro" : "nota",
    detalle:`Estado: ${ESTADOS[antes]||antes} → ${ESTADOS[nuevo]}`});
}
/* editar un bolsón = una operación con la versión que se vio */
function editarBolson(b, cambios, desc){
  if(!esAdmin()) return;
  encolar({fn:"actualizar_bolson", desc: desc || `Editar ${et(b)}`, visto: Object.assign(filaDeBolson(b), {actualizado_en:b.actualizado_en}),
           args:{p_id:b.id, p_cambios:cambios, p_version:b.actualizado_en, p_fecha:hoy()}});
}

/* ══════════════════ PANTALLA: PANEL ══════════════════════════════════ */
function lotesAuditables(){ return D.importaciones.filter(l=>l.tipo==="planilla"||l.tipo==="manual"); }
function pendientesAuditar(){ return lotesAuditables().filter(l=>l.estado_auditoria==="pendiente"); }
function avisosArriba(){
  let h = "";
  if(borradorRecuperado)
    h += `<div class="alert w">Recuperé lo que estabas cargando el ${esc(dmyh(borradorRecuperado))} y

      h += `<div class="alert e">⚠ <b>${esc(nombreUsuario(a&&a.auditor))}</b> observó el lote del ${dmy(l.fecha_medicion)}
        (${esc(l.archivo||l.tipo)}): «${esc(a?a.comentario:"")}».
        <button data-lote="${esc(l.id)}" style="min-height:44px;padding:3px 10px;margin-left:6px">Ver el lote</button></div>`;
    });

function vPanel(){
  const bs = vivos();
  let h = avisosArriba() + `<div class="bar"><button class="p" id="btnInforme">Informe para compartir</button></div>`;

  if(!D.bolsones.length && !D.relevamientos.length)
    h += `<div class="alert w">La base todavía no tiene bolsones. ${esAdmin()
      ? `Primero cargá los relevamientos históricos (Ajustes → Datos → «Cargar relevamiento o respaldo JSON») y después la planilla en Carga.`
      : `Los carga Iñaki.`}</div>`;
  else if(!D.bolsones.length)
    h += `<div class="alert w">Hay relevamientos cargados pero ningún bolsón vivo: los relevamientos son fotos y no se vinculan solos.
      ${esAdmin() ? `Si alguno de esos bolsones es de hoy (por ejemplo, los de silo del 13/8), vinculalo abajo, en Evolución del stock →
      «Vincular un relevamiento con los bolsones de hoy». Si no, la primera planilla los da de alta como nuevos.` : `Lo resuelve Iñaki.`}</div>`;

  Object.keys(D.alimentos).forEach(k=>{
    const c = calibracion(k);
    if(c && c.desvio!==null && Math.abs(c.desvio)>10)
      h += `<div class="alert w">⚠ ${esc(D.alimentos[k].nombre)}: los ${c.n} bolsón(es) terminados con peso declarado
        rinden ${f(c.prom)} kg/m, un ${f(Math.abs(c.desvio),1)}% ${c.desvio>0?"más":"menos"} que el coeficiente

  });
  const inc = inconsistentes();
  if(inc.length)
    h += `<div class="alert e">⚠ ${inc.length} bolsón(es) miden más que el largo inicial cargado
      (${inc.map(b=>`${esc(et(b))}: ${f(metrosAct(b),1)} m contra ${f(b.armado.metros_iniciales,1)} m iniciales`).join("; ")}).
      Su porcentaje consumido queda en s/d hasta que se corrija uno de los dos números.</div>`;
  const dif = bs.filter(difMedicion);
  if(dif.length)
    h += `<div class="alert w">⚠ ${dif.length} bolsón(es) con <b>diferencia de medición</b> en la última medición
      (${dif.map(b=>esc(et(b))).join(", ")}): miden más que la vez anterior sin estar en armado. Hasta que se explique
      el desvío, ese aumento no se lee como dato y no se calcula ritmo de consumo con ese par.
      Umbral: más de ${fNum(TOL_CERRADO_M)} m (la resolución de la medición).</div>`;
  const res = bs.filter(enResolucion);
  if(res.length)
    h += `<p class="hint">${res.length} bolsón(es) crecieron hasta ${fNum(TOL_CERRADO_M)} m, dentro de la resolución de la medición
      (${res.map(b=>esc(et(b))).join(", ")}). No es alerta; ese par tampoco da ritmo de consumo.</p>`;
  const dud = bs.filter(b=>{ const u=ultimaMed(b.id); return u && u.lectura==="dudosa"; });
  if(dud.length)
    h += `<div class="alert w">${dud.length} lectura(s) marcadas como dudosas en la planilla
      (${dud.map(b=>`${esc(et(b))}${ultimaMed(b.id).nota?" — "+esc(ultimaMed(b.id).nota):""}`).join("; ")}).</div>`;
  const ret = D.bolsones.filter(b=>b.estado==="retirado");
  if(ret.length)
    h += `<div class="alert w">${ret.length} bolsón(es) marcados como "ya no está"
      (${ret.slice(0,8).map(b=>esc(et(b))).join(", ")}${ret.length>8?"…":""}).
      No suman en ningún total ni salen en el mapa, pero conservan su historia.</div>`;
  const sinMed = bs.filter(b=>ultimaMed(b.id)===null);
  if(sinMed.length)
    h += `<div class="alert w">⚠ ${sinMed.length} de ${bs.length} tramos nunca fueron medidos
      (${sinMed.slice(0,8).map(b=>esc(et(b))).join(", ")}${sinMed.length>8?"…":""}).
      Los totales solo suman lo medido.</div>`;

  // KPIs por alimento
  if(bs.length){
    h += `<div class="grid" style="margin-bottom:14px">`;
    Object.entries(D.alimentos).forEach(([k,a])=>{
      const g = bs.filter(b=>b.alimento===k);
      if(!g.length) return;
      const cd = g.filter(b=>metrosAct(b)!==null);
      const m = cd.reduce((s,b)=>s+metrosAct(b),0);
      const kg = cd.reduce((s,b)=>s+kgAct(b),0);
      const kms = cd.reduce((s,b)=>s+kgMsAct(b),0);
      const pct = Math.round(nBols(cd)/nBols(g)*100);
      const uso = g.filter(b=>b.estado==="en_uso").length;
      const arm = g.filter(b=>b.estado==="armando").length;
      const fechas = [...new Set(cd.map(b=>ultimaMed(b.id).fecha))].sort();
      h += `<div class="kpi" style="--c:${a.color}">
        <div class="t">${esc(a.nombre)} ${tagCal(a)}</div>
        <div class="v mono">${cd.length?f(kg/1000,1):SD}</div>
        <div class="u">tn estimadas a ${f(a.kg_por_metro)} kg/m · ${cd.length?f(kms/1000,1):"s/d"} tn MS</div>
        <div class="r"><span>${nBols(g)} bolsones · ${f(m,1)} m${uso?` · <b style="color:${a.color}">${uso} en uso</b>`:""}${arm?` · <b style="color:${a.color}">${arm} en armado</b>`:""}</span>
          <span class="chip${pct<100?" bad":""}">${pct}% medido</span></div>
        <div class="u" style="margin-top:4px">medición${fechas.length>1?"es":""} del ${fechas.map(dmy).join(", ")||"s/d"}</div></div>`;
    });
    const cd = bs.filter(b=>metrosAct(b)!==null);
    const kgT = cd.reduce((s,b)=>s+kgAct(b),0);
    const pctT = bs.length?Math.round(nBols(cd)/nBols(bs)*100):0;
    h += `<div class="kpi" style="--c:#0f1e38">
      <div class="t">Total embolsado</div>
      <div class="v mono">${cd.length?f(kgT/1000,1):SD}</div>
      <div class="u">tn estimadas</div>
      <div class="r"><span>${nBols(bs)} bolsones · ${bs.length} tramos</span>
        <span class="chip${pctT<100?" bad":""}">${pctT}% medido</span></div></div></div>`;
  }

  h += vDietaCard();
  h += vReferencia();
  h += vEvolucion();

  // se terminan primero
  const conRitmo = bs.filter(b=>diasRest(b)!==null).sort((a,b)=>diasRest(a)-diasRest(b));
  h += `<div class="card"><h2>Se terminan primero</h2>
    <p class="hint">Según el ritmo entre las dos últimas mediciones de cada bolsón. Hace falta medir al menos dos
    veces el mismo bolsón para que aparezca acá — con una sola medición el ritmo es <b>s/d</b>, no cero. Un par
    marcado como diferencia de medición no da ritmo.</p>`;
  if(!conRitmo.length){
    h += `<p class="hint" style="margin:0">Todavía no hay ningún bolsón con dos mediciones válidas que muestren consumo.</p>`;

function vEvolucion(){
  const filas = [];

    filas.push({fecha:r.fecha, tipo:"Relevamiento histórico", items:it.map(i=>({alimento:i.alimento, metros:i.metros}))});

  lotesAuditables().forEach(l=>{

    filas.push({fecha:l.fecha_medicion, tipo:`Lote ${l.tipo==="manual"?"a mano":"de planilla"}`, lote:l,
      items:ms.map(m=>({alimento:(bol(m.bolson_id)||{}).alimento, metros:n(m.metros_restantes)}))});

  let h = `<div class="card"><h2>Evolución del stock en bolsones</h2>
    <p class="hint">Los <b>relevamientos históricos</b> son fotos del inventario en esa fecha. <b>No están vinculados
    a los bolsones de hoy</b>: en el campo los bolsones se renumeran en cada recorrido y no hay forma de saber cuál
    era cuál. Sirven para ver cómo evolucionó el total, no la historia de cada bolsón. Los lotes suman lo que entró

    <th>Fecha</th><th>Qué es</th>${alims.map(([k,a])=>`<th class="r">${esc(a.nombre)}</th>`).join("")}</tr></thead><tbody>`;
  filas.forEach(x=>{
