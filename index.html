<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Silo Bolsa LIVE</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Fase 4 · lenguaje V2 (diseno/v2, aprobado el 17/11)
   Superficies planas y blancas, borde de 1 px, sin sombras. El color se
   reserva para datos y estados. Números en monoespaciada.
   Fuentes: la pila del sistema. Inter y JetBrains Mono se usan solo si ya
   están instaladas: embeberlas sumaba ~215 KB que no se comprimen (ver el
   informe de la fase 4) y no se cargan de Google Fonts (sin CDN).
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --fondo:#F5F6F8; --borde:#E2E6ED; --borde2:#cfd6e2; --linea:#EEF1F5;
  --tinta:#111a2e; --tinta2:#3b4760; --gris:#5b6780; --sdc:#6b7590;
  --navy:#0f1e38; --azul:#2b6fd6;
  --alerta:#8a4b00; --alertabg:#FFF6E8; --alertaborde:#F1D9B0;
  --uso:#1d4f9e; --usobg:#DCE7FA; --arm:#5a3e8f; --armbg:#EDE7F7;
  --ok:#1d6b3d; --okbg:#e7f5ec; --mal:#a33; --malbg:#fdf1f1;
  --sans: Inter, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fondo);color:var(--tinta);font:14px/1.5 var(--sans)}
a{color:var(--azul)} a:hover{color:#1d55ad}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right}
.sd{color:var(--sdc);font-style:italic}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.2px}
h2{margin:0;font-size:15px;font-weight:600}
.eyebrow,.lbl{font-size:12px;font-weight:600;letter-spacing:.8px;color:var(--gris);text-transform:uppercase}
.lbl{display:block;font-size:11px;letter-spacing:.6px;margin-bottom:4px}
.sub{font-size:13px;color:var(--gris)}
.hint{font-size:12.5px;color:var(--gris);margin:0 0 12px;line-height:1.55}
.src{font-size:12px;color:var(--gris);line-height:1.5}

/* ── barra superior ── */
header.top{min-height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 28px;flex-wrap:wrap}
header.top .marca{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap}
header.top .sep{width:1px;height:22px;background:#2a3b5c}
nav#navPrincipal{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav#navPrincipal button{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:none;border:none;
  border-bottom:2px solid transparent;border-radius:0;font:600 13px var(--sans);color:#b9c4d9;cursor:pointer}
nav#navPrincipal button.on{color:#fff;border-bottom-color:var(--azul)}
nav#navPrincipal button:hover{color:#fff}
nav#navPrincipal .movil{display:none}
.pend{font:600 11px var(--mono);padding:1px 6px;border-radius:3px;background:#d97706;color:#fff}
.guardado{display:flex;align-items:center;gap:6px;font-size:12px;color:#a9d9bd}
.guardado .punto{width:7px;height:7px;border-radius:4px;background:#3fcf7f;display:inline-block}
.guardado.no{color:#f2c58a} .guardado.no .punto{background:#f2a33a}
.quien{display:flex;align-items:center;gap:10px;font-size:13px;color:#d6deec;flex-wrap:wrap}
.quien button{min-height:44px;background:transparent;border:1px solid #2a3b5c;color:#d6deec;border-radius:6px;padding:0 12px;font:600 12px var(--sans);cursor:pointer}

/* ── estructura ── */
main.wrap{max-width:1360px;width:100%;margin:0 auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
.cabeza{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cabeza .tit{display:flex;flex-direction:column;gap:4px}
.cabeza .acc{display:flex;gap:8px;flex-wrap:wrap}
.miga{font-size:12px;color:var(--gris)}
.cols{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cols>.princ{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:18px}
.cols>.lado{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:1px solid var(--borde);border-radius:8px;min-width:0}
.card>.cuerpo,.card .pad{padding:14px 18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--borde)}
.card-h .der{font-size:12px;color:var(--gris)}
.card-f{padding:12px 18px;font-size:12px;color:var(--gris);border-top:1px solid var(--linea)}
.card>.hint{padding:12px 18px 0}

/* ── franja de indicadores ── */
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));background:#fff;border:1px solid var(--borde);border-radius:8px}
.kpis>div{padding:18px 20px;border-left:1px solid var(--borde);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpis>div:first-child{border-left-color:transparent}
.kpis .t{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.6px;color:var(--gris);text-transform:uppercase}
.kpis .t .nom{display:flex;align-items:center;gap:8px}
.kpis .v{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.8px;line-height:1.15}
.kpis .v .u{font-family:var(--sans);font-size:14px;color:var(--gris);margin-left:6px;letter-spacing:0}
.kpis .s{font-size:12px;color:var(--tinta2)}
.kpis .c{font-size:12px;color:var(--ok)} .kpis .c.bad{color:var(--alerta)} .kpis .c.neutro{color:var(--gris)}
.kpis.chico .v{font-size:22px}
.cuad{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

/* ── etiquetas ── */
.cal,.tag{font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:3px;border:1px solid var(--borde2);color:var(--gris);background:#fff;white-space:nowrap}
.cal.med,.tag.med{border-color:#9fd1b2;color:var(--ok)}
.cal.est,.tag.est{border-color:#e3c780;color:#7a5600}
.cal.sv,.tag.sv{border-color:#e2b4b4;color:#8E2A2A}
.est{font-size:12px;padding:2px 8px;border-radius:3px;background:var(--linea);color:var(--tinta2);font-weight:600;white-space:nowrap}
.est.en_uso{background:var(--usobg);color:var(--uso)} .est.armando{background:var(--armbg);color:var(--arm)}
.est.terminado{background:#e9ecf1;color:var(--gris)} .est.retirado{background:#f3f4f6;color:var(--sdc)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 8px;border-radius:3px;background:var(--linea);color:var(--tinta2);font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.obs{background:var(--malbg);color:var(--mal)}
.chip.pen{background:var(--alertabg);color:var(--alerta)} .chip.aud{background:#efe6fb;color:#5a2d91}
.chip.dif{background:#FFF1DE;color:var(--alerta)}
.conf{font-size:11px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:3px;border:1px solid var(--borde2);text-transform:uppercase;white-space:nowrap}
.conf.alta{border-color:#9fd1b2;color:var(--ok)} .conf.media{border-color:#e3c780;color:#7a5600} .conf.baja{border-color:#e2b4b4;color:var(--mal)}
.alerta,.alert.w{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:#6b4300;background:var(--alertabg);border:1px solid var(--alertaborde);border-radius:6px;padding:10px 14px;line-height:1.5}
.alert{padding:10px 14px;border-radius:6px;font-size:13px;line-height:1.5}
.alert.e{background:var(--malbg);border:1px solid #f0c4c4;color:#7F1D1D}
.alerta b{white-space:nowrap}
.txt-alerta{color:var(--alerta)} .txt-uso{color:var(--uso)} .txt-ok{color:var(--ok)} .txt-gris{color:var(--gris)}

/* ── controles: 44 px como mínimo ── */
button,.btn{font:600 13px var(--sans);min-height:44px;min-width:44px;padding:0 14px;border-radius:6px;border:1px solid var(--borde2);background:#fff;color:var(--tinta);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:hover,.btn:hover{background:#f3f5f9}
button.p,.btn.p{background:var(--azul);border-color:var(--azul);color:#fff} button.p:hover,.btn.p:hover{background:#2462c2}
button.d{color:var(--mal);border-color:#f0c4c4} button.dg{background:var(--mal);border-color:var(--mal);color:#fff}
button.okb{background:#1d7a46;border-color:#1d7a46;color:#fff} button.obsb{border-color:#b45309;color:var(--alerta)}
button.link{border:none;background:none;color:var(--azul);padding:0 6px}
button:disabled{opacity:.5;cursor:not-allowed}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{font-size:12px;padding:0 10px;border-radius:4px}
.filtros button.on{background:var(--navy);border-color:var(--navy);color:#fff}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--borde2);border-radius:6px;background:#fff;color:inherit;max-width:100%}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul);outline-offset:-1px}
input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--azul)}
label.tap{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;cursor:pointer}
label.chip{min-height:44px;cursor:pointer;font-size:12.5px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:13px}
a[data-ficha],a[data-lote],a[data-ir],a[data-lista]{display:inline-flex;align-items:center;min-height:44px;min-width:44px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.frow>div{display:flex;flex-direction:column}

/* ── tablas ── */
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--gris);font-size:11px;letter-spacing:.6px;font-weight:600;padding:10px 8px;border-bottom:1px solid var(--borde);white-space:nowrap;text-transform:uppercase}
td{padding:8px;border-bottom:1px solid var(--linea);vertical-align:middle}
th:first-child,td:first-child{padding-left:18px} th:last-child,td:last-child{padding-right:18px}
th.r,td.r{text-align:right}
tr.cl{cursor:pointer} tr.cl:hover{background:#F7F9FD} tr.sel{background:#F7F9FD}
tr.anulada td{color:#9aa4b5;text-decoration:line-through} tr.anulada td.nota-anul{text-decoration:none}
.escala{position:relative;height:10px;background:var(--linea);border-radius:2px;min-width:80px}
.escala>span{position:absolute;left:0;top:0;bottom:0;border-radius:2px;opacity:.85}
.escala>i{position:absolute;left:93.333%;top:-3px;bottom:-3px;width:1px;background:#9aa4b6}
dl.lista{margin:0;padding:12px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:10px;column-gap:12px;font-size:13px}
dl.lista dt{color:var(--gris)} dl.lista dd{margin:0;text-align:right}
dl.lista dd.mono{font-family:var(--mono)}

/* ── listas accionables ── */
.accionable{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--linea);text-decoration:none;color:var(--tinta);min-height:44px;align-items:flex-start}
.accionable:hover{background:#F7F9FD;color:var(--tinta)}
.accionable .n{font:600 13px var(--mono);width:22px;flex:none}
.accionable .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.accionable .tx b{font-size:13px} .accionable .tx span{font-size:12px;color:var(--gris)}

/* ── pasos y opciones de carga ── */
.pasos{display:flex;font-size:12px;font-weight:600;color:var(--gris);flex-wrap:wrap}
.pasos span{padding:6px 12px;border:1px solid var(--borde2);background:#fff;margin-left:-1px}
.pasos span:first-child{border-radius:4px 0 0 4px;margin-left:0} .pasos span:last-child{border-radius:0 4px 4px 0}
.pasos span.on{background:var(--azul);border-color:var(--azul);color:#fff}
.opcion{border:1px solid var(--borde);border-radius:8px;padding:16px;background:#fff;cursor:pointer;text-align:left;font-weight:400;display:block;width:100%;min-height:auto}
.opcion:hover{border-color:var(--azul);background:#F7F9FD}
.opcion b{display:block;font-size:15px;margin-bottom:3px} .opcion span{font-size:12.5px;color:var(--gris);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.crow{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--linea);min-height:60px}
.crow .lft{flex:1;min-width:0} .crow .idl{font-weight:600;display:flex;align-items:center;gap:8px}
.crow .sub{font-size:12px;color:var(--gris)}
.crow input.m{width:96px;text-align:right;font:500 18px var(--mono);min-height:48px}
.crow select.e{font-size:12px;padding:6px} .crow input.e{font-size:12px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}

/* ── revisión ── */
.revtabla td{vertical-align:top}
.revtabla tr.error td{background:var(--malbg)} .revtabla tr.revisar td{background:#FFFBF2}
.revtabla tr.editor td{background:#F7F9FD}
.por{font-size:12px;color:var(--tinta2);line-height:1.5;max-width:420px}
.marca{font-size:12px;margin-top:4px;line-height:1.45}
.renglon-rev{border:1px solid var(--borde);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.renglon-rev.error{background:var(--malbg);border-color:#f0c4c4} .renglon-rev.revisar{background:#FFFBF2;border-color:var(--alertaborde)}
.renglon-rev.listo{border-left:4px solid #2E8F57}
.renglon-rev .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.miniblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.mini{background:var(--fondo);border-radius:6px;padding:9px 11px}
.mini .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:700}
.mini .v{font:600 18px var(--mono);margin-top:2px} .mini .u{font-size:11px;color:var(--gris)}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(to top,var(--fondo) 70%,rgba(245,246,248,0));padding:12px 0 6px}
.sticky-save .hint{background:var(--fondo)}
.parrow{display:block}

/* ── plano ── */
.plano{overflow:hidden}
.pl-regla,.pl-fila,.pl-cab{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;align-items:center}
.pl-regla{height:34px;border-bottom:1px solid var(--borde);font:400 11px var(--mono);color:var(--gris)}
.pl-regla .r{position:relative;height:100%} .pl-regla .r span{position:absolute;bottom:6px;transform:translateX(-50%)}
.pl-regla>span:first-child{padding-left:16px;font:600 11px var(--sans);letter-spacing:.5px}
.pl-regla>span:last-child{text-align:right;padding:0 16px 6px 0;font-family:var(--sans);align-self:end}
.pl-pasada{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--tinta2);text-transform:uppercase}
.pl-pasada span:last-child{font-weight:500;color:var(--gris);text-transform:none;letter-spacing:0}
.pl-fila{min-height:30px;cursor:pointer;touch-action:none;user-select:none}
.pl-fila:hover{background:#F7F9FD} .pl-fila.sel{background:#EEF4FE;outline:1px solid var(--azul);outline-offset:-1px}
.pl-fila.arrastrando{opacity:.4}
.pl-et{padding-left:12px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.pl-et .asa{color:#a6afc0;letter-spacing:-1px}
.pl-pista{position:relative;height:30px;background:linear-gradient(90deg,var(--linea) 1px,transparent 1px) 0 0/13.333% 100%}
.pl-barra{position:absolute;left:0;top:7px;height:16px;border:1px solid;border-radius:2px}
.pl-sd{position:absolute;left:0;top:7px;height:16px;width:46px;border:1px dashed var(--borde2);border-radius:2px;font:italic 11px var(--sans);color:var(--sdc);display:flex;align-items:center;justify-content:center}
.pl-extr{position:absolute;left:-2px;top:5px;height:20px;width:10px;background:var(--navy);border-radius:2px}
.pl-emb{position:absolute;top:5px;height:20px;width:12px;border:2px solid var(--arm);border-radius:2px;background:#fff}
.pl-m{text-align:right;padding-right:16px;font:500 12px var(--mono)}
.hueco{height:6px;margin:0 16px;border-radius:3px}
.moviendo .hueco{height:6px;background:#dce6f7;cursor:pointer}
.moviendo .hueco:hover,.hueco.destino{height:14px;background:#b9cff2}
.hueco span{display:none}
.hueco.destino{background:#d7e5fb}
.hueco.vacia{height:44px;margin:0 16px 16px;border:1px dashed var(--borde2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gris);padding:0}
.hueco.vacia span{display:inline}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--borde);font-size:12px;color:var(--tinta2)}
.leyenda>span{display:flex;align-items:center;gap:6px}
.maq.on{border-color:var(--azul);background:#EEF4FE}

/* ── gráficos ── */
.evol{padding:18px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 12px}
.evol .ejey{display:flex;flex-direction:column;justify-content:space-between;height:180px;font:400 11px var(--mono);color:var(--gris);text-align:right}
.evol .area{height:180px;border-left:1px solid var(--borde2);border-bottom:1px solid var(--borde2);display:grid;align-items:end;gap:24px;padding:0 24px;
  background:linear-gradient(var(--linea) 1px,transparent 1px) 0 0/100% 45px}
.evol .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.evol .col b{font:500 12px var(--mono);text-align:center;padding-bottom:4px}
.evol .etq{display:grid;gap:24px;padding:8px 24px 0;font-size:12px;color:var(--tinta2);text-align:center}
svg.graf{display:block;width:100%;height:auto}

/* ── modales y avisos ── */
.overlay{position:fixed;inset:0;background:rgba(15,30,56,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:8px;padding:20px 22px;max-width:460px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--borde)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:190;background:var(--navy);color:#fff;border-radius:8px;padding:10px 14px;
  display:flex;gap:12px;align-items:center;font-size:13px;max-width:min(560px,94vw)}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:0 12px;font-size:12.5px}
.login{max-width:400px;margin:48px auto}
.login input{width:100%;margin-bottom:10px}
.login button{width:100%}
details.hist summary{display:flex}
/* las pantallas sin maqueta (relevamiento, restauración, login) usan div.card con relleno */
div.card{padding:16px 18px} div.card>h2{margin-bottom:6px}

/* ── celular: se adapta sobre lo mismo ──
   barra inferior de 5 secciones, tablas como listas, paneles laterales abajo */
/* fase 5: planillas y carga a mano con el formato del papel */
.plbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--borde)}
.plsel{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.plren{display:flex;flex-direction:column;gap:3px;margin:0}
.plren input{width:84px}
.dos{display:flex;gap:16px;align-items:flex-start}
.dos>table{flex:1;min-width:0}
table.mano{border-collapse:collapse;width:100%}
table.mano th{font-size:11px;text-align:left;padding:4px 6px}
table.mano td{padding:2px 4px;border-top:1px solid var(--borde)}
table.mano td.n{width:36px;text-align:center;font-weight:600;color:var(--tinta2)}
table.mano input{width:100%;min-height:44px}
table.mano.hum input{min-width:64px}
@media (max-width:760px){
  .alerta b{white-space:normal}
  .dos{flex-direction:column;gap:0}
  header.top{padding:8px 14px;gap:10px;min-height:52px}

<script>
/* ══════════════════════════════════════════════════════════════════════
   SILO BOLSA LIVE — Fase 3: sistema compartido
   La fuente de verdad es la base (Supabase). Este navegador guarda solo
   una caché para mirar sin conexión y un borrador de lo que se está
   tipeando. Toda la lógica de cálculo, lectura de planillas, revisión,
   mapa y ficha viene de silo-bolsa.html (fases 1 y 2).
   ══════════════════════════════════════════════════════════════════════ */

/* ── conexión ──────────────────────────────────────────────────────────
   Solo la URL y la clave pública (anon / publishable). La clave pública
   no protege nada por sí sola: lo que protege es la RLS de la base. La
   clave service_role NO va acá nunca. */
const SB_URL_PROD = "https://ckvsiwiizwdrvrpuucxa.supabase.co";
const SB_KEY = "sb_publishable_fLwisrwlOO9Mv2_lwXguXg_L-btmbLu";
/* Banco de pruebas: «?api=http://localhost:PUERTO» solo se acepta si la app
   también se abrió desde localhost. Desde GitHub Pages se ignora, así nadie
   puede mandar un link que apunte la app a otro servidor y robe contraseñas. */
const SB_URL = (()=>{
  try{
    const q = new URLSearchParams(location.search).get("api");
    if(q && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
         && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(q)) return q;
  }catch(e){}
  return SB_URL_PROD;
})();
const K_SES="silobolsa_sesion_v4", K_CACHE="silobolsa_cache_v4", K_COLA="silobolsa_cola_v4", K_BORR="silobolsa_borrador_v4";

/* Respaldo mínimo por si la base todavía no tiene la fila de parámetros.
   Igual que en 01_esquema.sql: nombres, colores y coeficientes vigentes, SIN
   textos de origen, sin %MS de casa y sin fórmula de dieta. Eso es de la
   empresa y el repo es público: entra desde el relevamiento o en Ajustes y
   vive solo en la base. */
const ALIMENTOS = {
  MG:{ nombre:"Maíz Grano", color:"#C9A227", kg_por_metro:3664, ms_pct:null, calidad:"med", origen_kgm:"", origen_ms:"" },
  MS:{ nombre:"Maíz Silo", color:"#2E9E5B", kg_por_metro:4000, ms_pct:null, calidad:"est", origen_kgm:"", origen_ms:"",
       fuera_de_alcance:"el silo de maíz que no está embolsado" },
  GL:{ nombre:"Gluten", color:"#8E2A2A", kg_por_metro:4700, ms_pct:null, calidad:"sv", origen_kgm:"", origen_ms:"" },
  HG:{ nombre:"Harina de Germen", color:"#7A5C3E", kg_por_metro:null, ms_pct:null, calidad:"est", sinBolson:true, origen_kgm:"", origen_ms:"" },
  NU:{ nombre:"Núcleo", color:"#5B6E8C", kg_por_metro:null, ms_pct:null, calidad:"est", sinBolson:true, origen_kgm:"", origen_ms:"" }
};
const DIETA = { proporciones:{}, kg_dia_min:null, kg_dia_max:null, origen:"" };
const REFERENCIA = { fuente:"Portal PEGSA · vista v_PB_StockInsumo (SQL WinCampo)", fecha:"",
  nota:"Valor externo, cargado a mano. La app no se conecta al portal: esto es solo para contrastar.",
  valores:{ MG:null, MS:null, GL:null } };
const ORIGEN_MS = { bolson:"Bolsón en uso", celda:"Celda de alimento", mixer:"Mixer / dieta mezclada" };
const ESTADOS = { armando:"En armado", cerrado:"Cerrado", en_uso:"En uso", terminado:"Terminado", retirado:"Ya no está" };
const ESTADO_LETRA = { armando:"A", cerrado:"C", en_uso:"U", terminado:"T", retirado:"X" };
const TIPOS_EV = { alta:"Alta", armado:"Inicio de armado", apertura:"Apertura", cierre:"Cierre",
                   rotura:"Rotura", perdida:"Pérdida", retiro:"Retiro", nota:"Nota", renumeracion:"Renumeración" };
const ORIGEN_MED = { planilla:"planilla", manual:"a mano", auditoria:"auditoría", migracion:"relevamiento" };
const ROLES = { admin:"admin", auditor:"auditor", lectura:"lectura", sin_acceso:"sin acceso" };
const CAL = {
  med:{cls:"med",txt:"MEDIDO",desc:"Pesada propia en el feedlot."},
  est:{cls:"est",txt:"ESTIMADO",desc:"Bibliografía coherente con el cálculo físico. Sin pesada propia."},
  sv :{cls:"sv", txt:"SIN VALIDAR",desc:"Orden de magnitud. Nada medido todavía."}
};
/* Umbrales, con su porqué:
   · PESO_CONSTANTE_G = 1 g: las pesadas vienen en gramos enteros, así que
     dos pesadas seguidas que difieren en más de 1 g quieren decir que la
     muestra seguía perdiendo agua → el %MS es una cota superior.
   · TOL_CERRADO_M = 0,5 m: la resolución de la medición. El odómetro lee
     de a 0,1 m y medir "de la mitad del triángulo de una punta a la mitad del otro" mueve
     unos decímetros por punta. Se usa para dos cosas:
       - proponer correspondencias: un cerrado "mide lo mismo" si cambió ±0,5 m;
       - el nivel del aviso cuando un bolsón que no está en armado crece:
         hasta 0,5 m es «dentro de la resolución» (informativo), más de 0,5 m
         es «diferencia de medición» (aviso). Con cualquier aumento, el par
         no da ritmo de consumo. Lo mismo hace la base (02_seguridad.sql). */
const PESO_CONSTANTE_G = 1, TOL_CERRADO_M = 0.5;
/* Ingredientes de la fórmula; si todavía no hay fórmula cargada, todos los
   alimentos conocidos (para que la planilla y la carga de MS no queden vacías). */
function ingsDieta(){
  const p = Object.keys((D.dieta&&D.dieta.proporciones)||{});
  return p.length ? p : Object.keys(D.alimentos);
}
function hayFormula(){ return Object.keys((D.dieta&&D.dieta.proporciones)||{}).length>0; }

let D = vacio(), vista = "panel", fichaId = null, cargaBuf = {};
let staging = null, undoPila = [], modal = null, aviso = null;
let ses = null, yo = null, conexion = "ok", cola = [], cacheEn = null, cargando = false;
let pantallaAuth = null;    // null · "login" · "clave" · "sin_acceso" · "cargando"
let auditLote = null;       // lote abierto en la bandeja
let relev = null;           // revisión de un relevamiento histórico
let restauracion = null;    // revisión de un respaldo a restaurar
let borradorRecuperado = null;

function vacio(){
  return { meta:{version:4}, alimentos:clonar(ALIMENTOS), dieta:clonar(DIETA), referencia:clonar(REFERENCIA),
           bolsones:[], mediciones:[], eventos:[], calidad:[], importaciones:[], auditorias:[],
           relevamientos:[], relevamiento_items:[], perfiles:[], latidos:[], parametrosFila:{} };
}

/* ── utilidades ────────────────────────────────────────────────────── */
const SD = '<span class="sd">s/d</span>';
function clonar(x){ return JSON.parse(JSON.stringify(x)); }
function n(v){ if(v===null||v===undefined||v===""||isNaN(v)) return null; return Number(v); }
function f(v,d=0){ const x=n(v); return x===null?SD:x.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hoy(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function dmy(iso){ return iso? String(iso).slice(0,10).split("-").reverse().join("/") : "s/d"; }
function dmyh(ts){ if(!ts) return "s/d"; const d=new Date(ts);
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }
function dias(f1,f2){ return (new Date(f2+"T00:00:00") - new Date(f1+"T00:00:00"))/86400000; }
function ali(b){ return D.alimentos[b.alimento] || {nombre:b.alimento,color:"#999",kg_por_metro:0,ms_pct:0,calidad:"sv"}; }
function cal(a){ return CAL[a.calidad] || CAL.sv; }
function gkey(b){ return (b.grupo||"").trim() || b.id; }
function nBols(lista){ return new Set(lista.map(gkey)).size; }
function et(b){ return b ? (b.etiqueta||"s/etiqueta") : "s/d"; }
function bol(id){ return D.bolsones.find(x=>x.id===id); }
function uuid(){
  if(globalThis.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function uid(){ return uuid(); }
function lsGet(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function nombreUsuario(id){
  if(!id) return "s/d";
  const p=(D.perfiles||[]).find(x=>x.id===id);
  return p ? (p.nombre||p.email) : "usuario de otro proyecto";
}

/* ── roles: la pantalla esconde, la base prohíbe ───────────────────── */
function rol(){ return yo ? yo.rol : "sin_acceso"; }
function esAdmin(){ return rol()==="admin"; }
function esAuditor(){ return rol()==="auditor"; }

/* ══════════════════ SUPABASE POR FETCH ═══════════════════════════════ */
async function sbFetch(path, opts={}, reintento=true){
  if(ses && !opts.sinToken && ses.expires_at && ses.expires_at*1000-Date.now() < 60000) await refrescar();
  const h = Object.assign({ apikey:SB_KEY, "Content-Type":"application/json" }, opts.headers||{});
  if(ses && ses.access_token && !opts.sinToken) h.Authorization = "Bearer "+ses.access_token;
  let r;
  try{ r = await fetch(SB_URL+path, {method:opts.method||"GET", headers:h, body:opts.body}); }
  catch(e){ const er=new Error("Sin conexión con la base."); er.red=true; throw er; }
  if(r.status===401 && reintento && ses && ses.refresh_token && !opts.sinToken){
    if(await refrescar()) return sbFetch(path, opts, false);
  }
  const txt = await r.text(); let j=null;
  try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const er = new Error((j&&(j.message||j.msg||j.error_description||j.error))||("HTTP "+r.status));
    er.status=r.status; er.code=j&&(j.code||j.error_code); er.details=j&&j.details; er.hint=j&&j.hint;
    throw er;
  }
  return j;
}
function rpc(fn, args){ return sbFetch("/rest/v1/rpc/"+fn, {method:"POST", body:JSON.stringify(args||{})}); }
async function leerTodo(tabla, orden){
  const out=[]; let off=0;
  for(;;){
    const lote = await sbFetch(`/rest/v1/${tabla}?select=*&order=${orden||"id"}.asc&limit=1000&offset=${off}`);
    out.push(...lote); if(lote.length<1000) break; off+=1000;
  }
  return out;
}

/* ── sesión ────────────────────────────────────────────────────────── */
function guardarSesion(s){
  ses = s ? { access_token:s.access_token, refresh_token:s.refresh_token,
              expires_at: s.expires_at || (Math.floor(Date.now()/1000)+(s.expires_in||3600)),
              user: s.user ? {id:s.user.id, email:s.user.email} : (ses&&ses.user) } : null;
  if(ses) lsSet(K_SES, ses); else lsDel(K_SES);
}
let refrescando = null;
async function refrescar(){
  if(refrescando) return refrescando;
  refrescando = (async()=>{
    try{
      const j = await sbFetch("/auth/v1/token?grant_type=refresh_token",
        {method:"POST", body:JSON.stringify({refresh_token:ses.refresh_token}), sinToken:true}, false);
      guardarSesion(j); return true;
    }catch(e){
      if(e.red) return false;               // sin red: se sigue con la caché
      guardarSesion(null); yo=null; pantallaAuth="login"; render(); return false;
    }finally{ setTimeout(()=>{ refrescando=null; },0); }
  })();
  return refrescando;
}
async function entrar(email, clave){
  const j = await sbFetch("/auth/v1/token?grant_type=password",
    {method:"POST", body:JSON.stringify({email, password:clave}), sinToken:true}, false);
  guardarSesion(j);
}
async function salir(){
  try{ await sbFetch("/auth/v1/logout", {method:"POST"}, false); }catch(e){}
  guardarSesion(null); yo=null; D=vacio(); lsDel(K_CACHE);
  pantallaAuth="login"; render();
}
/* Los links de invitación y de "me olvidé la contraseña" vuelven a la app
   con la sesión en el #hash. Se toma, se limpia la barra y se pide clave. */
async function leerHash(){
  if(!location.hash || location.hash.length<2) return null;
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get("error") || q.get("error_code")){
    history.replaceState(null,"",location.pathname+location.search);
    return {error: q.get("error_description") || q.get("error_code") || q.get("error")};
  }
  if(!q.get("access_token")) return null;
  history.replaceState(null,"",location.pathname+location.search);
  guardarSesion({access_token:q.get("access_token"), refresh_token:q.get("refresh_token"),
                 expires_in:+q.get("expires_in")||3600});
  try{ const u = await sbFetch("/auth/v1/user"); ses.user={id:u.id,email:u.email}; lsSet(K_SES,ses); }catch(e){}
  return {tipo:q.get("type")||""};
}

/* ── lectura completa desde la base ────────────────────────────────── */
const TABLAS = ["bolsones","mediciones","eventos","calidad","importaciones","auditorias",
                "parametros","relevamientos","relevamiento_items","perfiles"];
async function recargar(){
  if(!ses || !yo || cargando) return;
  cargando = true;
  try{
    const t = {};
    await Promise.all(TABLAS.map(async x=>{ t[x] = await leerTodo(x, x==="parametros"?"clave":"id"); }));
    t.latidos = await sbFetch("/rest/v1/latidos?select=*&order=en.desc&limit=1").catch(()=>[]);
    if(esAdmin()) t.invitaciones = await leerTodo("invitaciones","email").catch(()=>[]);
    lsSet(K_CACHE, {uid:yo.id, en:new Date().toISOString(), t});
    cacheEn = null;
    aplicarTablas(t);
    if(conexion==="sin_red" && !cola.length) conexion="ok";
  }catch(e){
    if(e.red){ conexion="sin_red"; }
    else mostrarAviso("No pude leer la base: "+e.message);
  }finally{ cargando=false; render(); }
}
/* D = lo que dice la base + lo que todavía está en la cola sin guardar */
function aplicarTablas(t){
  D = desdeBase(t);
  cola.filter(op=>op.uid===(yo&&yo.id)).forEach(op=>{ try{ aplicarLocal(op); }catch(e){} });
}
function desdeBase(t){
  const par = {}; (t.parametros||[]).forEach(p=>par[p.clave]=p);
  return normalizar({
    meta: par.meta ? par.meta.valor : {version:4},
    alimentos: par.alimentos ? par.alimentos.valor : clonar(ALIMENTOS),
    dieta: par.dieta ? par.dieta.valor : clonar(DIETA),
    referencia: par.referencia ? par.referencia.valor : clonar(REFERENCIA),
    parametrosFila: par,
    bolsones: (t.bolsones||[]).map(bolsonDeFila),
    mediciones: (t.mediciones||[]).map(m=>Object.assign({}, m, {metros_restantes:n(m.metros_restantes)})),
    eventos: t.eventos||[],
    calidad: (t.calidad||[]).map(c=>Object.assign({}, c, {ms_pct:n(c.ms_pct), peso_inicial_g:n(c.peso_inicial_g)})),
    importaciones: t.importaciones||[], auditorias: t.auditorias||[],
    relevamientos: t.relevamientos||[],
    relevamiento_items: (t.relevamiento_items||[]).map(i=>Object.assign({}, i, {metros:n(i.metros)})),
    perfiles: t.perfiles||[], latidos: t.latidos||[], invitaciones: t.invitaciones||[]
  });
}
function bolsonDeFila(r){
  return { id:r.id, etiqueta:r.etiqueta, grupo:r.grupo||"", alimento:r.alimento, diametro_pies:n(r.diametro_pies)||9,
    armado:{ fecha:r.armado_fecha||null, metros_iniciales:n(r.armado_metros_iniciales),
             kg_declarados:n(r.armado_kg_declarados), origen:r.armado_origen||"", responsable:r.armado_responsable||"" },
    ubicacion:{ sector:r.sector||"Playa", fila:r.fila||"A", posicion:n(r.posicion)||0 },
    estado:r.estado, fecha_apertura:r.fecha_apertura||null, fecha_cierre:r.fecha_cierre||null, nota:r.nota||"",
    actualizado_en:r.actualizado_en, actualizado_por:r.actualizado_por, creado_en:r.creado_en };
}
function normalizar(j){
  j.meta = j.meta||{version:4};
  j.alimentos = j.alimentos||clonar(ALIMENTOS);
  ["bolsones","mediciones","eventos","calidad","importaciones","auditorias","relevamientos",
   "relevamiento_items","perfiles","latidos"].forEach(k=>{ j[k]=j[k]||[]; });
  j.dieta = j.dieta||clonar(DIETA);
  j.referencia = j.referencia||clonar(REFERENCIA);
  j.referencia.valores = j.referencia.valores||{};
  j.parametrosFila = j.parametrosFila||{};
  return j;
}

/* ══════════════════ COLA: NADA SE PIERDE SI SE CORTA LA RED ══════════
   Cada cambio es una operación con id propio. Se guarda primero en este
   navegador, se aplica en pantalla, y se manda a la base. Si no hay red,
   queda en la cola ("sin guardar en la base") y se manda sola al volver.
   Las funciones de la base son idempotentes por id: reintentar no duplica. */
function guardarCola(){ lsSet(K_COLA, cola); }
function encolar(op){
  op.id = op.id||uuid(); op.uid = yo.id; op.creado = new Date().toISOString();
  // dos ediciones del mismo bolsón sin guardar se juntan en una, con la versión que se vio primero
  if(op.fn==="actualizar_bolson"){
    const prev = cola.find(o=>o.fn==="actualizar_bolson" && o.args.p_id===op.args.p_id && o.uid===op.uid);
    if(prev){ Object.assign(prev.args.p_cambios, op.args.p_cambios); prev.desc = op.desc;
              guardarCola(); aplicarLocal(op); render(); vaciarCola(); return; }
  }
  cola.push(op); guardarCola();
  aplicarLocal(op);
  render();
  vaciarCola();
}
let vaciando = false;
async function vaciarCola(){
  if(vaciando || !yo) return;
  vaciando = true;
  let hubo = false;
  try{
    while(cola.length){
      const op = cola.find(o=>o.uid===yo.id); if(!op) break;
      conexion = "guardando"; pintarIndicador();
      try{
        await rpc(op.fn, op.args);
        cola = cola.filter(o=>o.id!==op.id); guardarCola(); hubo = true;
      }catch(e){
        if(e.red){ conexion = "sin_red"; pintarIndicador(); break; }
        cola = cola.filter(o=>o.id!==op.id); guardarCola();
        conexion = "ok";
        await recargar();
        errorDeOperacion(op, e);
        break;
      }
    }
  }finally{ vaciando = false; }
  if(conexion!=="sin_red") conexion = "ok";
  if(hubo){ await recargar(); if(cola.some(o=>o.uid===yo.id)) vaciarCola(); }
  else pintarIndicador();
}

function errorDeOperacion(op, e){
  if(e.status===409 && e.message==="CONFLICTO" && (op.fn==="actualizar_bolson"||op.fn==="mover_bolsones")){
    let det = {}; try{ det = JSON.parse(e.details||"{}"); }catch(x){}
    return mostrarConflicto(op, det);
  }
  abrirModal({titulo:"No se guardó en la base", soloOk:true, ok:"Entendido", onOk:cerrarModal,
    texto:`<b>${esc(op.desc||op.fn)}</b><br><br>La base respondió: ${esc(e.message)}${e.details?`<br><span class="src">${esc(e.details)}</span>`:""}
      <br><br>Lo que ves ahora es lo que quedó guardado en la base.`});
}

function vCampo(k,v){ if(v===null||v===undefined||v==="") return "s/d"; if(k==="estado") return ESTADOS[v]||v; return String(v); }

/* el estado del lote como lo calcula la base (06_auditoria_compartida.sql) */
function estadoLoteLocal(l){
  const v = audVigentes(l);
  return v.some(a=>a.resultado==="observada") ? "observada" : v.some(a=>a.importacion_id===l.id && a.resultado==="ok") ? "ok" : "pendiente";
}

/* ══════════════════ DERIVADOS (fase 1, con la historia nueva) ═════════
   Una medición anulada no cuenta para nada. Si en una fecha hay a la vez
   una medición de planilla y una de auditoría, manda la de planilla hasta
   que Iñaki anule una de las dos: la de auditoría NO reemplaza sola. */
function medsValidas(id){
  return D.mediciones.filter(m=>m.bolson_id===id && !m.anulada && n(m.metros_restantes)!==null);
}
function medsDe(id){
  const por = {};
  /* Una medición de auditoría solo entra en los cálculos si Iñaki anuló la
     original de esa fecha: es la forma de decir "vale la de Nico". */
  const anuladasOrig = new Set(D.mediciones.filter(m=>m.bolson_id===id && m.anulada && m.origen!=="auditoria").map(m=>m.fecha));
  medsValidas(id).filter(m=>m.origen!=="auditoria" || anuladasOrig.has(m.fecha)).forEach(m=>{
    const ya = por[m.fecha];
    if(!ya || (ya.origen==="auditoria" && m.origen!=="auditoria")
       || ((ya.origen==="auditoria")===(m.origen==="auditoria") && String(m.cargado_en)>String(ya.cargado_en))) por[m.fecha]=m;
  });
  return Object.values(por).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function ultimaMed(id){ const ms=medsDe(id); return ms.length?ms[ms.length-1]:null; }
/* la última medición válida (no de auditoría) antes de una fecha */
function medAnterior(id, fecha){
  const ms = medsValidas(id).filter(m=>m.origen!=="auditoria" && m.fecha<fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return ms.length?ms[ms.length-1]:null;
}
function medEnFecha(id, fecha){
  return medsValidas(id).find(m=>m.origen!=="auditoria" && m.fecha===fecha) || null;
}
function metrosAct(b){ const u=ultimaMed(b.id); return u?n(u.metros_restantes):null; }
function consumido(b){
  const ini=n(b.armado&&b.armado.metros_iniciales), act=metrosAct(b);
  if(ini===null||act===null) return null;
  return ini-act;
}
function pctConsumido(b){
  const ini=n(b.armado&&b.armado.metros_iniciales), c=consumido(b);
  if(ini===null||c===null||ini<=0) return null;
  /* Si consumió menos que cero, el bolsón mide más que su largo inicial: los
     datos se contradicen. Devolver 0% sería inventar un dato limpio sobre uno
     roto — mejor s/d, que se ve y se corrige. */
  if(c<0) return null;
  return Math.min(100, c/ini*100);
}
function inconsistentes(){
  return vivos().filter(b=>{ const c=consumido(b); return c!==null && c<0; });
}
/* ritmo: m/día entre las dos últimas mediciones. null si no hay dos, si no
   pasó tiempo, si el bolsón no bajó, o si el par está marcado como
   diferencia de medición (Paso 0: desvío sistemático sin explicar). */
function tasa(b){
  const ms=medsDe(b.id);
  if(ms.length<2) return null;
  const a=ms[ms.length-2], z=ms[ms.length-1];
  if(z.revision_marca) return null;   // cualquier aumento (dentro de la resolución o no): el par no da ritmo
  const dd=dias(a.fecha,z.fecha);
  if(dd<=0) return null;
  return (n(a.metros_restantes)-n(z.metros_restantes))/dd;   // + se consume, − crece
}
function difMedicion(b){ const u=ultimaMed(b.id); return u && u.revision_marca==="diferencia_medicion" ? u : null; }
function enResolucion(b){ const u=ultimaMed(b.id); return u && u.revision_marca==="dentro_resolucion" ? u : null; }
function ritmo(b){
  if(b.estado==="armando") return null;
  const t=tasa(b); return (t!==null && t>0) ? t : null;
}
function ritmoLlenado(b){
  if(b.estado!=="armando") return null;
  const t=tasa(b); return (t!==null && t<0) ? -t : null;
}
function diasRest(b){
  const r=ritmo(b), act=metrosAct(b);
  if(r===null||act===null) return null;
  return act/r;
}
function rendReal(b){
  if(b.estado!=="terminado") return null;
  const kg=n(b.armado&&b.armado.kg_declarados), ini=n(b.armado&&b.armado.metros_iniciales);
  if(kg===null||ini===null||ini<=0) return null;
  return kg/ini;
}
function kgAct(b){ const m=metrosAct(b); return m===null?null:m*ali(b).kg_por_metro; }

/* ── materia seca ──────────────────────────────────────────────────────
   Una lectura que no llegó a peso constante es una COTA SUPERIOR: la MS
   real es menor. Se muestra "≤ 61 %" (ejemplo) y no se usa como valor en ningún
   cálculo: el %MS vigente sigue siendo el último valor que sí llegó a peso
   constante (o el de casa), y se avisa que hay una cota más nueva. */
function fPct(v){ const x=n(v); return x===null?SD:f(x, x%1?1:0)+" %"; }
function txtMs(c){ return c ? (c.peso_constante===false?"≤ ":"")+fPct(c.ms_pct).replace(/<[^>]+>/g,"") : "s/d"; }
function lecturasMs(filtro){
  return (D.calidad||[]).filter(x=>!x.anulada && n(x.ms_pct)!==null && filtro(x))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||String(a.cargado_en).localeCompare(String(b.cargado_en)));
}
function msVigente(k){
  const todas = lecturasMs(x=>x.tipo==="ingrediente" && x.alimento===k);
  const valores = todas.filter(x=>x.peso_constante!==false);
  const cotas = todas.filter(x=>x.peso_constante===false);
  const u = valores.length ? valores[valores.length-1] : null;
  const cota = cotas.length && (!u || cotas[cotas.length-1].fecha>=u.fecha) ? cotas[cotas.length-1] : null;
  if(u) return { pct:n(u.ms_pct), medido:true, fecha:u.fecha, cota, lectura:u,
                 origen:(ORIGEN_MS[u.origen_tipo]||u.origen_tipo)+(u.origen_id?" "+u.origen_id:"") };
  const a=D.alimentos[k];
  return { pct:a?n(a.ms_pct):null, medido:false, fecha:null, cota, origen:"valor de casa" };
}
function kgMsAct(b){
  const k=kgAct(b); if(k===null) return null;
  const v=msVigente(b.alimento); return v.pct===null?null:k*v.pct/100;
}
/* %MS que DEBERÍA dar la dieta. Si ese día faltó un ingrediente (p. ej.
   no había harina de germen), se calcula sin él, re-proporcionando el resto. */
/* Para el teórico de la dieta, una lectura cuenta solo si llegó a peso
   constante (sí confirmado). Si no, se usa el de casa, y se dice. */
function msParaTeorico(k){
  const v = msVigente(k);
  if(v.medido && v.lectura && v.lectura.peso_constante!==true){
    const a = D.alimentos[k];
    return { pct:a?n(a.ms_pct):null, medido:false, fecha:null, cota:v.cota, origen:"valor de casa",
             porque:`la lectura del ${dmy(v.fecha)} no confirma peso constante (una sola pesada o solo el porcentaje): se usa el de casa` };
  }
  if(!v.medido && v.cota) v.porque = `la muestra del ${dmy(v.cota.fecha)} no llegó a peso constante (${txtMs(v.cota)}): se usa el de casa`;
  return v;
}
function msDietaTeorico(faltantes){
  const sin = new Set(faltantes||[]);
  const p=(D.dieta&&D.dieta.proporciones)||{};
  let suma=0, tot=0, faltan=[], medidos=0;
  Object.entries(p).forEach(([k,pc])=>{
    if(sin.has(k)) return;
    const v=msParaTeorico(k); tot+=pc;
    if(v.pct===null) faltan.push(k); else { suma+=pc*v.pct/100; if(v.medido) medidos++; }
  });
  if(!tot||faltan.length) return null;
  return { pct:suma/tot*100, medidos, total:Object.keys(p).length-sin.size, sin:[...sin] };
}
function msDietaMedido(){
  const c = lecturasMs(x=>x.tipo==="dieta");
  return c.length?c[c.length-1]:null;
}
function sensibilidad(faltantes){
  const sin = new Set(faltantes||[]);
  const p=Object.fromEntries(Object.entries((D.dieta&&D.dieta.proporciones)||{}).filter(([k])=>!sin.has(k)));
  const tot=Object.values(p).reduce((s,x)=>s+x,0)||1;
  return Object.entries(p).map(([k,pc])=>({k, pct:pc, efecto:pc/tot})).sort((a,b)=>b.efecto-a.efecto);
}
function calibracion(k){
  const rs = D.bolsones.filter(b=>b.alimento===k).map(rendReal).filter(x=>x!==null);
  if(!rs.length) return null;
  const prom = rs.reduce((s,x)=>s+x,0)/rs.length;
  const vig = D.alimentos[k].kg_por_metro;
  return { n:rs.length, prom, vig, desvio: vig? (prom-vig)/vig*100 : null };
}

/* ── orden de recorrido ────────────────────────────────────────────── */
function vivos(){ return D.bolsones.filter(b=>b.estado!=="retirado"); }
function recorrido(){
  return [...vivos()].sort((a,b)=>{
    const fa=(a.ubicacion.fila||"A"), fb=(b.ubicacion.fila||"A");
    if(fa!==fb) return fa.localeCompare(fb);
    return (a.ubicacion.posicion||0)-(b.ubicacion.posicion||0);
  });
}

/* un solo camino para cambiar de estado (en pantalla; la base hace lo mismo
   en _cambiar_estado) */
function cambiarEstado(b, nuevo, fecha){
  const antes = b.estado;
  if(antes===nuevo) return;
  b.estado = nuevo;
  if(nuevo==="en_uso" && !b.fecha_apertura) b.fecha_apertura = fecha;
  if(nuevo==="terminado") b.fecha_cierre = fecha;
  D.eventos.push({id:uuid(), bolson_id:b.id, fecha, _pendiente:true,
    tipo: nuevo==="terminado"?"cierre" : nuevo==="en_uso"?"apertura"
        : nuevo==="armando"?"armado" : nuevo==="retirado"?"retiro" : "nota",
    detalle:`Estado: ${ESTADOS[antes]||antes} → ${ESTADOS[nuevo]}`});
}
/* editar un bolsón = una operación con la versión que se vio */
function editarBolson(b, cambios, desc){
  if(!esAdmin()) return;
  encolar({fn:"actualizar_bolson", desc: desc || `Editar ${et(b)}`, visto: Object.assign(filaDeBolson(b), {actualizado_en:b.actualizado_en}),
           args:{p_id:b.id, p_cambios:cambios, p_version:b.actualizado_en, p_fecha:hoy()}});
}

/* ══════════════════ PANTALLA: PANEL ══════════════════════════════════ */
function lotesAuditables(){ return D.importaciones.filter(l=>l.tipo==="planilla"||l.tipo==="manual"); }
function pendientesAuditar(){ return lotesAuditables().filter(l=>l.estado_auditoria==="pendiente"); }
/* ══════════════════ VISTAS V2 (fase 4) ═══════════════════════════════
   Las pantallas siguen el diseño aprobado (diseno/v2). Los números salen
   de las mismas funciones de las fases 1 a 3: acá solo cambia cómo se
   muestran. Los colores de alimento son los de la V2; si aparece un
   alimento que el diseño no tiene, se usa el color que trae la base. */
const COLOR_V2 = { MG:["#B8921C","#D9C27A"], MS:["#2E8F57","#8CC7A3"], GL:["#8E2A2A","#D9A3A3"] };
function colorAli(k){ return (COLOR_V2[k]||[])[0] || ((D.alimentos[k]||{}).color) || "#8a93a3"; }
function colorAliClaro(k){ return (COLOR_V2[k]||[])[1] || "#dfe4ec"; }
const ORDEN_ALI = ["MG","MS","GL","HG","NU"];
function entradasAli(){ const i = k => { const x = ORDEN_ALI.indexOf(k); return x<0 ? 99 : x; };
  return Object.entries(D.alimentos).sort((a,b)=>i(a[0])-i(b[0]) || a[0].localeCompare(b[0])); }
function ordNat(a,b){ return String(a).localeCompare(String(b),"es",{numeric:true}); }
function porEtiqueta(lista){ return [...lista].sort((a,b)=>ordNat(et(a),et(b))); }
function listaEt(lista){ return porEtiqueta(lista).map(b=>esc(et(b))).join(", "); }
function dm(iso){ return iso ? String(iso).slice(0,10).split("-").reverse().slice(0,2).join("/") : "s/d"; }
function fT(kg){ return kg===null||kg===undefined ? SD : f(kg/1000,1); }
function calTag(a){ const c=cal(a); return `<span class="cal ${c.cls}" title="${esc(c.desc)}">${c.txt}</span>`; }
function estTag(b){ return `<span class="est ${esc(b.estado)}">${esc(ESTADOS[b.estado]||b.estado)}</span>`; }
function puedeAuditar(){ return rol()==="admin" || rol()==="auditor"; }
function cabeza(o){
  return `<div class="cabeza"><div class="tit">${o.eyebrow?`<span class="eyebrow">${o.eyebrow}</span>`:""}
    <h1>${o.h1}</h1>${o.sub?`<span class="sub">${o.sub}</span>`:""}</div>${o.acc?`<div class="acc">${o.acc}</div>`:""}</div>`;
}
const EST_AUD = { pendiente:["pen","sin auditar"], ok:["ok","auditado"], observada:["obs","observado"], no_aplica:["","no aplica"] };
function ultimoLote(){
  return [...lotesAuditables()].sort((a,b)=>String(b.fecha_medicion).localeCompare(String(a.fecha_medicion))||String(b.cargado_en).localeCompare(String(a.cargado_en)))[0]||null;

function fechaUltimaMed(bs){ const fs = bs.map(b=>ultimaMed(b.id)).filter(Boolean).map(u=>u.fecha).sort(); return fs.length?fs[fs.length-1]:null; }

/* ── aviso del borrador recuperado (va arriba en cualquier pantalla) ── */
function avisoBorrador(){

/* ══════════════════ PANEL ═════════════════════════════════════════════ */
let filtroPanel = "todos", panelTodos = false;
function vPanel(){
  const bs = vivos(), l = ultimoLote(), fm = fechaUltimaMed(bs);
  const cub = bs.filter(b=>metrosAct(b)!==null);

       ${nBols(cub)} de ${nBols(bs)} bolsones medidos · lote <b class="${l.estado_auditoria==="ok"?"txt-ok":"txt-alerta"}">${esc(estL[1])}</b>`
    : (bs.length ? `${nBols(cub)} de ${nBols(bs)} bolsones medidos` : "Todavía no hay bolsones en la base.");

      : "Los carga Iñaki."}</span></div>`;

  h += `<div class="cols"><div class="princ">${tablaBolsones(bs)}</div>
    <aside class="lado">${requiereAtencion(bs)}${seTerminan(bs)}${tarjetaMs()}</aside></div>`;

  h += vReferencia();

function kpisStock(bs){
  const alims = entradasAli().filter(([k,a])=>!a.sinBolson);
  const cd = bs.filter(b=>metrosAct(b)!==null);
  const kgT = cd.reduce((s,b)=>s+kgAct(b),0), mT = cd.reduce((s,b)=>s+metrosAct(b),0);
  const cals = [...new Set(alims.filter(([k])=>bs.some(b=>b.alimento===k)).map(([k,a])=>a.calidad))];
  const pct = bs.length ? Math.round(nBols(cd)/nBols(bs)*100) : 0;
  let h = `<section class="kpis" style="--n:${1+alims.length}" aria-label="Indicadores">
    <div><span class="t"><span class="nom"><span class="cuad" style="background:var(--navy)"></span>Total</span>
      ${cals.length===1?calTag(D.alimentos[alims.find(([k])=>bs.some(b=>b.alimento===k))[0]]):`<span class="cal" title="Suma alimentos con coeficientes de distinta confianza">MIXTO</span>`}</span>
      <span class="v">${cd.length?fT(kgT):SD}<span class="u">t</span></span>
      <span class="s">${nBols(bs)} bolsones · ${f(mT,1)} m</span>
      <span class="c ${pct<100?"bad":""}">${bs.length?pct+" % medido":"no hay qué medir"}</span></div>`;
  alims.forEach(([k,a])=>{
    const g = bs.filter(b=>b.alimento===k), c = g.filter(b=>metrosAct(b)!==null);
    const kg = c.reduce((s,b)=>s+kgAct(b),0), m = c.reduce((s,b)=>s+metrosAct(b),0);
    const fechas = [...new Set(c.map(b=>ultimaMed(b.id).fecha))].sort();
    h += `<div title="${fechas.length?"medición del "+fechas.map(dmy).join(", "):""}"><span class="t"><span class="nom"><span class="cuad" style="background:${colorAli(k)}"></span>${esc(a.nombre)}</span>${calTag(a)}</span>
      <span class="v ${c.length?"":"sd"}">${c.length?fT(kg):"s/d"}${c.length?'<span class="u">t</span>':""}</span>
      <span class="s">${g.length?`${nBols(g)} bolsones · ${f(m,1)} m · ${a.kg_por_metro?f(a.kg_por_metro)+" kg/m":"sin kg/m"}`:"sin bolsones en la playa"}</span>
      <span class="c ${!g.length?"neutro":c.length<g.length?"bad":""}">${g.length?`${nBols(c)} de ${nBols(g)} medidos`:"no hay qué medir"}</span></div>`;
  });
  return h + `</section>`;
}
/* La observación de cada bolsón: lo primero que hay que mirar, con su porqué */
function obsDe(b){
  const u = ultimaMed(b.id), m = metrosAct(b);
  if(u && u.revision_marca==="diferencia_medicion"){
    const a = medAnterior(b.id, u.fecha);
    return {prio:1, cls:"txt-alerta", txt:`Diferencia de medición: ${a?fDelta(n(u.metros_restantes)-n(a.metros_restantes))+" contra el "+dm(a.fecha):"creció estando cerrado"}`}; }
  const c = consumido(b);
  if(c!==null && c<0) return {prio:2, cls:"txt-alerta", txt:`Mide más que su largo inicial (${f(m,1)} contra ${f(b.armado.metros_iniciales,1)} m)`};
  if(u && u.lectura==="dudosa") return {prio:2, cls:"txt-alerta", txt:`Lectura dudosa en la hoja${u.nota?` · «${esc(u.nota)}»`:""}`};
  if(m===null) return {prio:3, cls:"txt-alerta", txt:"Nunca medido: s/d"};
  if(u && u.revision_marca==="dentro_resolucion"){
    const a = medAnterior(b.id, u.fecha);
    return {prio:5, cls:"txt-gris", txt:`Dentro de la resolución: ${a?fDelta(n(u.metros_restantes)-n(a.metros_restantes)):""}`}; }
  if(b.estado==="en_uso") return {prio:6, cls:"", txt:(u&&u.nota)||"Extractora enganchada"};
  if(b.estado==="armando") return {prio:6, cls:"", txt:(u&&u.nota)||"Embolsadora enganchada"};
  if(b._pendiente) return {prio:7, cls:"txt-alerta", txt:"Sin guardar en la base"};
  return {prio:9, cls:"", txt:""};
}
function tablaBolsones(bs){
  const orden = new Map(recorrido().map((b,i)=>[b.id,i]));
  const filas = bs.map(b=>({b, o:obsDe(b)})).sort((x,y)=>x.o.prio-y.o.prio || (orden.get(x.b.id)-orden.get(y.b.id)));
  const conObs = filas.filter(x=>x.o.prio<=5);
  const alims = entradasAli().filter(([k,a])=>!a.sinBolson && bs.some(b=>b.alimento===k));
  const filtros = [["todos",`Todos · ${bs.length}`],["obs",`Con observación · ${conObs.length}`]]
    .concat(alims.map(([k,a])=>[k,`${a.nombre} · ${bs.filter(b=>b.alimento===k).length}`]));
  const vis = filas.filter(x=> filtroPanel==="todos" ? true : filtroPanel==="obs" ? x.o.prio<=5 : x.b.alimento===filtroPanel);
  const mostrar = panelTodos ? vis : vis.slice(0,10);
  let h = `<section class="card"><div class="card-h"><h2>Bolsones</h2><div class="filtros">${filtros.map(([v,t])=>
    `<button data-filtro="${esc(v)}" class="${filtroPanel===v?"on":""}">${esc(t)}</button>`).join("")}</div></div>`;
  if(!bs.length) return h + `<p class="pad sub">No hay bolsones vivos en la base.</p></section>`;
  h += `<div class="tabla"><table class="resp"><thead><tr><th>Bolsón</th><th>Estado</th><th style="width:34%">Quedan <span style="font-weight:400;text-transform:none">· escala 0–75 m</span></th>
    <th class="r">Metros</th><th class="r">Toneladas</th><th>Observación</th></tr></thead><tbody>`;
  mostrar.forEach(({b,o})=>{
    const m = metrosAct(b), w = m===null?0:Math.min(m,75)/75*100;
    h += `<tr><td data-l="Bolsón"><a href="#" data-ficha="${esc(b.id)}" style="gap:8px;font-weight:600;color:var(--tinta);text-decoration:none">
        <span class="cuad" style="background:${b.estado==="terminado"?"#b0b8c6":colorAli(b.alimento)}"></span>${esc(et(b))}</a>${b.grupo?` <span class="chip">${esc(b.grupo)}</span>`:""}</td>
      <td data-l="Estado">${estTag(b)}</td>
      <td data-l="Quedan"><div class="escala" title="${m===null?"s/d":f(m,1)+" m"}"><span style="width:${w.toFixed(1)}%;background:${colorAli(b.alimento)}"></span><i></i></div></td>
      <td data-l="Metros" class="num ${o.prio===1?"txt-alerta":""}">${m===null?SD:f(m,1)}</td>
      <td data-l="Toneladas" class="num">${kgAct(b)===null?SD:f(kgAct(b)/1000,1)}</td>
      <td data-l="Observación" style="font-size:12px" class="${o.cls}">${o.txt}</td></tr>`;
  });
  h += `</tbody></table></div><div class="card-f bar" style="justify-content:space-between">
    <span>Mostrando ${mostrar.length} de ${vis.length} · primero los que tienen algo para mirar · la línea vertical marca 70 m</span>
    ${vis.length>10?`<button class="link" id="btnVerTodos">${panelTodos?"Ver solo los primeros 10":`Ver los ${vis.length} bolsones`}</button>`:""}</div></section>`;
  return h;
}
/* Requiere atención: solo lo que pide una acción. Lo informativo va aparte, en gris. */
function requiereAtencion(bs){
  const it = [], info = [];
  const enlace = (attr, n, color, titulo, detalle) => it.push(`<a href="#" ${attr} class="accionable"><span class="n" style="color:${color}">${n}</span>
    <span class="tx"><b>${titulo}</b><span>${detalle}</span></span></a>`);
  if(!bs.length && D.relevamientos.length)
    enlace(`data-ir="panel"`, "!", "var(--alerta)", "Ningún bolsón vivo",
      `Hay relevamientos cargados pero ningún bolsón vivo: los relevamientos son fotos y no se vinculan solos.
       ${esAdmin()?"Si alguno es de los bolsones de hoy, vinculalo abajo, en Evolución del stock. Si no, la primera planilla los da de alta como nuevos.":"Lo resuelve Iñaki."}`);
  D.importaciones.filter(l=>l.estado_auditoria==="observada").forEach(l=>{
    const obs = D.auditorias.filter(a=>!a.anulada && a.resultado==="observada" && (a.importacion_id===l.id || D.mediciones.some(m=>m.id===a.medicion_id && m.importacion_id===l.id)))
      .sort((x,y)=>String(y.en).localeCompare(String(x.en)));
    const a = obs[0];
    enlace(`data-lote="${esc(l.id)}"`, "!", "var(--mal)", "Lote observado",
      `${esc(nombreUsuario(a&&a.auditor))} observó el lote del ${dmy(l.fecha_medicion)}${a&&a.comentario?`: «${esc(a.comentario)}»`:""}`);
  });
  const inc = porEtiqueta(inconsistentes());
  if(inc.length) enlace(`data-ficha="${esc(inc[0].id)}"`, inc.length, "var(--alerta)", "Más largos que su largo inicial",
    `${inc.map(b=>`${esc(et(b))}: ${f(metrosAct(b),1)} contra ${f(b.armado.metros_iniciales,1)} m`).join("; ")}. Su consumido queda en s/d.`);
  const dif = porEtiqueta(bs.filter(difMedicion));
  if(dif.length){
    const ds = dif.map(b=>{ const u=ultimaMed(b.id), a=medAnterior(b.id,u.fecha); return a?n(u.metros_restantes)-n(a.metros_restantes):null; }).filter(x=>x!==null);
    enlace(`data-ficha="${esc(dif[0].id)}"`, dif.length, "var(--alerta)", "Diferencias de medición",
      `${listaEt(dif)} crecieron ${ds.length?`${fNum(Math.min(...ds))}${Math.max(...ds)!==Math.min(...ds)?"–"+fNum(Math.max(...ds)):""} m`:""} estando cerrados. No dan ritmo hasta que se explique. Umbral: más de ${fNum(TOL_CERRADO_M)} m.`);
  }
  const dud = porEtiqueta(bs.filter(b=>{ const u=ultimaMed(b.id); return u && u.lectura==="dudosa"; }));
  if(dud.length) enlace(`data-ficha="${esc(dud[0].id)}"`, dud.length, "var(--alerta)", "Lectura dudosa",
    dud.map(b=>`${esc(et(b))}${ultimaMed(b.id).nota?" · «"+esc(ultimaMed(b.id).nota)+"»":""}`).join("; "));
  const sinMed = porEtiqueta(bs.filter(b=>ultimaMed(b.id)===null));
  if(sinMed.length) enlace(`data-ficha="${esc(sinMed[0].id)}"`, sinMed.length, "var(--alerta)", "Nunca medidos",
    `${sinMed.slice(0,8).map(b=>esc(et(b))).join(", ")}${sinMed.length>8?"…":""}. Los totales solo suman lo medido.`);
  Object.keys(D.alimentos).forEach(k=>{
    const c = calibracion(k);
    if(c && c.desvio!==null && Math.abs(c.desvio)>10)
      enlace(`data-ir="param"`, "!", "var(--alerta)", "Coeficiente a revisar",
        `${esc(D.alimentos[k].nombre)}: los ${c.n} bolsón(es) terminados con peso declarado rinden ${f(c.prom)} kg/m, un ${f(Math.abs(c.desvio),1)}% ${c.desvio>0?"más":"menos"} que el coeficiente vigente de ${f(c.vig)} kg/m.`);
  });
  const pend = pendientesAuditar();
  if(pend.length) enlace(`data-ir="auditoria"`, pend.length, "var(--uso)", pend.length===1?"Lote pendiente de auditoría":"Lotes pendientes de auditoría",
    pend.map(l=>`${l.tipo==="manual"?"Carga a mano":"Planilla"} del ${dm(l.fecha_medicion)}`).join(" · ") + " · lo auditan Iñaki o Nico");
  const res = porEtiqueta(bs.filter(enResolucion));
  if(res.length) info.push(`${listaEt(res)} ${res.length===1?"subió":"subieron"} ${res.map(b=>{ const u=ultimaMed(b.id), a=medAnterior(b.id,u.fecha); return a?fNum(n(u.metros_restantes)-n(a.metros_restantes))+" m":""; }).join(", ")}, dentro de la resolución del odómetro (≤ ${fNum(TOL_CERRADO_M)} m). Tampoco da ritmo.`);
  const ret = porEtiqueta(D.bolsones.filter(b=>b.estado==="retirado"));
  if(ret.length) info.push(`${ret.length} bolsón(es) marcados «ya no está» (${listaEt(ret.slice(0,8))}${ret.length>8?"…":""}): no suman ni salen en el plano, pero conservan su historia.`);
  return `<section class="card"><div class="card-h"><h2>Requiere atención</h2></div>
    ${it.length?it.join(""):`<p class="pad sub" style="margin:0">Nada pendiente.</p>`}
    ${info.map(x=>`<div class="card-f">Informativo: ${x}</div>`).join("")}</section>`;
}
function seTerminan(bs){
  const c = bs.filter(b=>diasRest(b)!==null).sort((a,b)=>diasRest(a)-diasRest(b)).slice(0,6);
  let h = `<section class="card"><div class="card-h"><h2>Se terminan primero</h2><span class="der">ritmo entre las dos últimas mediciones</span></div>`;
  if(!c.length) return h + `<p class="pad sub" style="margin:0;color:var(--tinta2)">Ritmo <i class="sd">s/d</i>: hace falta una segunda medición
    del mismo bolsón, y un par marcado como diferencia de medición no cuenta. Con la próxima planilla aparece el orden.</p></section>`;
  return h + `<table><tbody>${c.map(b=>`<tr class="cl" data-ficha="${esc(b.id)}"><td><b>${esc(et(b))}</b></td>
    <td class="num">${f(metrosAct(b),1)} m</td><td class="num">${f(ritmo(b),2)} m/día</td><td class="num"><b>${f(diasRest(b),0)}</b> días</td></tr>`).join("")}
    </tbody></table></section>`;
}
/* Materia seca: la dieta medida contra el teórico DE ESA MUESTRA (sin lo que
   le faltó ese día), y la MS por día con la fórmula completa, que es la que
   se usa todos los días (Iñaki, 16/11: la dieta siempre lleva germen). */
function tarjetaMs(){
  const med = msDietaMedido();
  const head = `<div class="card-h"><h2>Materia seca</h2><span class="der">${med?"muestra del "+dm(med.fecha):"sin muestras de dieta"}</span></div>`;
  const ingr = Object.keys(D.alimentos).map(k=>{ const ls = lecturasMs(x=>x.tipo==="ingrediente" && x.alimento===k); return ls.length?{k, c:ls[ls.length-1]}:null; }).filter(Boolean);
  const filasIngr = ingr.map(({k,c})=>`<dt>${esc((D.alimentos[k]||{}).nombre||k)} · ${esc((ORIGEN_MS[c.origen_tipo]||c.origen_tipo||"").toLowerCase())}${c.origen_id?" "+esc(c.origen_id):""}</dt><dd class="mono">${esc(txtMs(c))}</dd>`).join("");
  if(!hayFormula())
    return `<section class="card">${head}<dl class="lista">
      <dt>Dieta medida</dt><dd class="mono">${med?esc(txtMs(med)):SD}</dd>
      <dt>Teórico</dt><dd class="mono">${SD}</dd>${filasIngr}
      <dt>MS por día</dt><dd class="mono">${SD}</dd></dl>
      <div class="card-f">la fórmula de la dieta no está cargada. Sin fórmula no hay contra qué comparar: el teórico, el desvío y la MS por día
      quedan en s/d. La fórmula no viaja en el código (el repo es público): se carga desde el relevamiento del 13/8 o en Ajustes → Dieta.</div></section>`;
  const falt = med ? (med.ingredientes_faltantes||[]) : [];
  const teoM = msDietaTeorico(falt), teoF = msDietaTeorico([]);
  const cota = med && med.peso_constante===false;
  const desv = (teoM&&med) ? med.ms_pct-teoM.pct : null;
  const nomFalt = falt.map(k=>((D.alimentos[k]||{}).nombre||k).toLowerCase()).join(" y ");
  const kmin = n(D.dieta.kg_dia_min), kmax = n(D.dieta.kg_dia_max);
  const rotulo = falt.length ? `Teórico para la muestra del ${dm(med.fecha)} (sin ${esc(nomFalt)})` : "Teórico de esa muestra";
  let h = `<section class="card">${head}<dl class="lista">
    <dt>Dieta medida</dt><dd class="mono">${med?esc(txtMs(med)):SD}</dd>
    ${med?`<dt>${rotulo}</dt><dd class="mono">${teoM?f(teoM.pct,1)+" %":SD}</dd>
    <dt>Desvío de la muestra</dt><dd class="mono ${desv!==null&&Math.abs(desv)>3?"txt-alerta":""}">${desv===null?SD:(cota?"≤ ":"")+(desv>0?"+":"")+f(desv,1)+" pt"}</dd>`:""}
    ${filasIngr}
    <dt>Teórico de la fórmula</dt><dd class="mono">${teoF?f(teoF.pct,1)+" %":SD}</dd>
    <dt>MS por día</dt><dd class="mono">${teoF&&kmin!==null&&kmax!==null?f(kmin*teoF.pct/100/1000,0)+"–"+f(kmax*teoF.pct/100/1000,0)+" t":SD}</dd></dl>
    <div class="card-f">${cota||ingr.some(x=>x.c.peso_constante===false)?"«≤»: la muestra no llegó a peso constante; es un tope, no un valor. ":""}
    ${falt.length?`El teórico sin ${esc(nomFalt)} se usa solo para comparar esa muestra; la MS por día usa la fórmula completa
    (${teoF?f(teoF.pct,1)+" %":"s/d"} sobre ${kmin===null?"s/d":f(kmin/1000,0)}–${kmax===null?"s/d":f(kmax/1000,0)} t tal cual).`
      :`MS por día con la fórmula completa sobre ${kmin===null?"s/d":f(kmin/1000,0)}–${kmax===null?"s/d":f(kmax/1000,0)} t tal cual.`}
    ${Object.keys(D.dieta.proporciones||{}).map(k=>{ const v=msParaTeorico(k); return v.porque?` El teórico usa el %MS de casa de ${esc(((D.alimentos[k]||{}).nombre||k).toLowerCase())} (${v.pct===null?"s/d":f(v.pct,0)+" %"}): ${esc(v.porque)}.`:""; }).join("")}
    ${desv!==null&&Math.abs(desv)>3&&cota&&desv<0?" La muestra da al menos "+f(Math.abs(desv),1)+" puntos menos que el teórico: repetir la pesada hasta peso constante antes de tocar nada.":""}</div>
    <details class="hist" style="padding:0 18px 10px"><summary>Ingredientes, %MS vigente y origen</summary>${tablaIngredientes()}</details></section>`;
  return h;
}

/* ── evolución: barras apiladas por fecha, a los coeficientes vigentes ── */
function vEvolucion(){
  const cols = [];
  D.relevamientos.forEach(r=>{
    const it = D.relevamiento_items.filter(i=>i.relevamiento_id===r.id);
    cols.push({fecha:r.fecha, tipo:"relevamiento", items:it.map(i=>({alimento:i.alimento, metros:i.metros}))});
  });
  // las mediciones válidas de cada fecha de carga (sin anuladas ni re-mediciones de auditoría)
  const fechasLote = [...new Set(lotesAuditables().map(l=>l.fecha_medicion))];
  fechasLote.forEach(fe=>{
    const ids = new Set(lotesAuditables().filter(l=>l.fecha_medicion===fe).map(l=>l.id));
    const ms = D.mediciones.filter(m=>ids.has(m.importacion_id) && !m.anulada);
    cols.push({fecha:fe, tipo:lotesAuditables().some(l=>ids.has(l.id)&&l.tipo==="planilla")?"planilla":"a mano",
      items:ms.map(m=>({alimento:(bol(m.bolson_id)||{}).alimento, metros:n(m.metros_restantes)}))});
  });
  if(!cols.length) return "";
  cols.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))||a.tipo.localeCompare(b.tipo));
  const alims = entradasAli().filter(([k,a])=>!a.sinBolson && a.kg_por_metro && cols.some(c=>c.items.some(i=>i.alimento===k)));
  cols.forEach(c=>{ c.t = {}; c.med = 0; c.n = c.items.length;
    alims.forEach(([k,a])=>{ const g=c.items.filter(i=>i.alimento===k && i.metros!==null); c.t[k]=g.reduce((s,i)=>s+i.metros,0)*a.kg_por_metro/1000; c.med+=g.length; });
    c.total = Object.values(c.t).reduce((s,x)=>s+x,0); });
  const max = Math.max(1, ...cols.map(c=>c.total)), paso = Math.pow(10, Math.floor(Math.log10(max/4)));
  const tope = Math.ceil(max/4/paso)*paso*4, H = 180;
  const portal = fechaPortal();
  let h = `<section class="card"><div class="card-h"><h2>Evolución del stock embolsado</h2>
    <span class="der">toneladas por fecha de medición, a los coeficientes vigentes${portal?` · el portal está al ${dm(portal)}: ver Contraste`:""}</span></div>
    <div class="evol"><div class="ejey">${[4,3,2,1,0].map(i=>`<span>${f(tope*i/4,0)}</span>`).join("")}</div>
    <div class="area" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(c=>`<div class="col" title="${c.med} de ${c.n} tramos medidos">
      <b>${f(c.total,0)}</b>${[...alims].reverse().map(([k])=>`<span style="height:${(c.t[k]/tope*H).toFixed(1)}px;background:${colorAli(k)}"></span>`).join("")}</div>`).join("")}</div>
    <span></span><div class="etq" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(c=>`<span>${dm(c.fecha)} · ${c.tipo}<br><span class="src">${c.med} de ${c.n} medidos</span></span>`).join("")}</div></div>
    <div class="leyenda" style="border-top:none;padding-top:0">${alims.map(([k,a])=>`<span><span class="cuad" style="width:10px;height:10px;background:${colorAli(k)}"></span>${esc(a.nombre)}</span>`).join("")}
      <span class="src">Los relevamientos son fotos del inventario: no están vinculados a los bolsones de hoy (en el campo se renumeran en cada recorrido).</span></div>
    ${esAdmin()?vVincular():""}</section>`;
  return h;
}
/* Vincular: solo el relevamiento MÁS RECIENTE de cada alimento y solo si
   todavía corresponde. Si no hay nada para vincular, la sección no aparece
   (la base además rechaza uno que no sea el más reciente). */
function vVincular(){
  let filas = "";
  const alims = [...new Set(D.relevamiento_items.map(i=>i.alimento))];
  alims.forEach(k=>{
    const a = D.alimentos[k]||{nombre:k}; if(a.sinBolson) return;
    const conK = D.relevamientos.filter(r=>D.relevamiento_items.some(i=>i.relevamiento_id===r.id && i.alimento===k))
      .sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)));
    const r = conK[0]; if(!r) return;
    if(vinculados(r,k) || hayPosteriores(k, r.fecha)) return;
    const g = D.relevamiento_items.filter(i=>i.relevamiento_id===r.id && i.alimento===k), m = g.filter(i=>i.metros!==null).reduce((s,i)=>s+i.metros,0);
    filas += `<div class="crow"><div class="lft"><b>${esc(a.nombre)}</b> del ${dmy(r.fecha)}<div class="sub">${g.length} tramos · ${f(m,1)} m · el relevamiento más reciente de ${esc(a.nombre)}</div></div>
      <button data-vincular="${esc(r.id)}|${esc(k)}">Son los mismos bolsones de hoy…</button></div>`;
  });
  if(!filas) return "";
  return `<details class="hist" style="border-top:1px solid var(--linea)" ${D.bolsones.length?"":"open"}><summary style="padding:0 18px">Vincular un relevamiento con los bolsones de hoy</summary>
    <p class="hint" style="padding:0 18px">Si al cargar un relevamiento no se tildó «son los mismos bolsones de hoy», se puede hacer acá, solo con el más reciente de cada alimento.
    Da de alta esos bolsones con su medición de esa fecha. Solo si alguien lo confirmó en el campo: no se inventan correspondencias.</p>${filas}</details>`;
}

/* ── contraste con el portal: solo si las fechas están cerca ──
   El stock cambia todos los días por el consumo del mixer: una semana de
   consumo de maíz grano es del orden de 170 t, más que la diferencia que
   se quiere detectar. Con fechas más separadas, la diferencia no dice nada. */
const VENTANA_DEF = { dias:7, porque:"El stock cambia todos los días por el consumo del mixer: una semana de consumo de maíz grano es del orden de 170 t, más que la diferencia que se quiere detectar. Con fechas más separadas, la diferencia no dice nada." };
function ventanaPortal(){ const r = D.referencia||{}; return { dias: n(r.ventana_dias)!==null ? n(r.ventana_dias) : VENTANA_DEF.dias, porque: r.ventana_porque || VENTANA_DEF.porque }; }
function fechaPortal(){ const t = String((D.referencia||{}).fecha||"").trim(); if(!t) return null; const x = fechaDe(t.slice(0,10)); return x||null; }
function origenReferencia(){
  const pr = D.parametrosFila.referencia;
  if(!pr || !pr.actualizado_por) return "Sin cargar.";
  const cuando = `el ${dmyh(pr.actualizado_en)} por ${esc(nombreUsuario(pr.actualizado_por))}`;
  const o = String(pr.origen||"");
  if(/^Del relevamiento/i.test(o)) return `Cargado ${esc(o.replace(/^Del relevamiento/i,"del relevamiento").replace(/\.$/,""))}, ${cuando}.`;
  return `Cargado a mano ${cuando}.`;
}
function vReferencia(){
  const R = D.referencia;
  if(!R || !Object.values(R.valores||{}).some(v=>v!=null)) return "";
  const fp = fechaPortal(), V = ventanaPortal();
  const filas = entradasAli().filter(([k])=>(R.valores||{})[k]!=null).map(([k])=>[k, R.valores[k]]).map(([k,kg])=>{
    const g = vivos().filter(b=>b.alimento===k && metrosAct(b)!==null);
    const fb = fechaUltimaMed(g);
    const nuestro = g.reduce((s,b)=>s+kgAct(b),0), m = g.reduce((s,b)=>s+metrosAct(b),0);
    const sep = (fb && fp) ? Math.abs(dias(fb, fp)) : null;
    return {k, a:D.alimentos[k], kg, g, fb, nuestro, m, sep, compara: sep!==null && sep<=V.dias};
  });
  const fbs = [...new Set(filas.map(x=>x.fb).filter(Boolean))].sort();
  const algunaCompara = filas.some(x=>x.compara);
  let h = `<section class="card"><div class="card-h"><h2>Contraste con el portal</h2>
    <span class="der">portal al ${fp?dmy(fp):"s/d"} · bolsones al ${fbs.length?fbs.map(dmy).join(", "):"s/d"}</span></div>`;
  if(!algunaCompara)
    h += `<div class="pad"><div class="alerta"><b>Fechas distintas (${fbs.length?fbs.map(dm).join(", "):"s/d"} contra ${fp?dm(fp):"s/d"}): no se compara.</b>
      <span>Se compara solo con fechas a ${f(V.dias)} días o menos. ${esc(V.porque)}</span></div></div>`;
  h += `<div class="tabla"><table class="resp"><thead><tr><th>Alimento</th><th class="r">En bolsones</th><th class="r">Portal</th>
    <th class="r">Diferencia</th><th class="r">kg/m que implica</th><th>Qué dice</th></tr></thead><tbody>`;
  filas.forEach(x=>{
    const dif = x.compara && x.nuestro && x.kg ? (x.nuestro-x.kg)/x.kg*100 : null;
    const fa = x.a.fuera_de_alcance || (ALIMENTOS[x.k]||{}).fuera_de_alcance;
    const dice = !x.g.length ? "sin bolsones medidos de este alimento"
      : !x.compara ? `no se compara: ${x.sep===null?"falta una de las fechas":`fechas a ${f(x.sep)} días (${dm(x.fb)} contra ${dm(fp)})`}`
      : Math.abs(dif)<5 ? "cierra: lo embolsado explica el stock del portal"
      : (fa && dif<0) ? `el portal suma también ${esc(fa)}, que esta app deja afuera a propósito: el ${f(-dif,0)} % del stock del portal no está en bolsones. La diferencia es esperable, no un error.`
      : dif<0 ? "el portal tiene más: hay stock fuera de los bolsones (celdas, silo puente)"
      : "los bolsones dan más que el portal: revisar el coeficiente o la vista SQL";
    h += `<tr><td data-l="Alimento"><span class="cuad" style="background:${colorAli(x.k)}"></span> <b>${esc(x.a.nombre)}</b></td>
      <td data-l="En bolsones" class="num">${x.g.length?f(x.nuestro/1000,1)+" t":SD}<div class="src">al ${x.fb?dm(x.fb):"s/d"}</div></td>
      <td data-l="Portal" class="num">${f(x.kg/1000,1)} t<div class="src">al ${fp?dm(fp):"s/d"}</div></td>
      <td data-l="Diferencia" class="num">${dif===null?"—":(dif>0?"+":"")+f(dif,1)+" %"}</td>
      <td data-l="kg/m que implica" class="num">${x.compara&&x.m?f(x.kg/x.m):"—"}</td>
      <td data-l="Qué dice" style="font-size:12px;color:var(--gris)">${dice}</td></tr>`;
  });
  return h + `</tbody></table></div><div class="card-f">${esc(R.fuente||"")} · al ${esc(R.fecha||"s/d")}. ${origenReferencia()}
    La app no se conecta al portal: es solo para contrastar. ${algunaCompara?`Se compara con fechas a ${f(V.dias)} días o menos. ${esc(V.porque)}`:""}</div></section>`;
}
